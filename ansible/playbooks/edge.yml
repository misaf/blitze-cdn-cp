---
- name: Converge BlitzeCDN edge servers
  hosts: blitzecdn_edges
  become: true
  gather_facts: true
  # One failed edge stops the play. `max_fail_percentage` is deliberately not
  # set alongside this: it expresses the same policy in a second dialect, and
  # the two invite a later reader to change one and believe they have changed
  # the rule. `any_errors_fatal` is the stricter of the pair and wins anyway.
  any_errors_fatal: true
  serial: "25%"
  pre_tasks:
    - name: Validate supported operating system
      ansible.builtin.assert:
        that:
          - >-
            (ansible_facts.distribution == 'Debian' and
             ansible_facts.distribution_major_version | int >= 12) or
            (ansible_facts.distribution == 'Ubuntu' and
             ansible_facts.distribution_major_version | int >= 24)
        fail_msg: BlitzeCDN supports Debian 12+ and Ubuntu 24.04+.
      tags: [always]
  roles:
    - role: blitzecdn_base
      tags: [base]
    # Before nginx, which resolves origin hostnames through the host resolver,
    # and before anything that fetches by name. Off unless enabled.
    - role: blitzecdn_resolver
      tags: [base, resolver]
    - role: blitzecdn_kernel
      tags: [kernel]
    - role: blitzecdn_firewall
      tags: [firewall]
    - role: blitzecdn_nginx
      tags: [nginx]
    # SSH policy comes after the firewall so a host that fails firewall
    # validation is never left key-only but unreachable from the management
    # network, and before Fail2Ban so bans apply to a daemon that has already
    # stopped accepting passwords.
    - role: blitzecdn_sshd
      tags: [security, sshd]
    - role: blitzecdn_fail2ban
      tags: [security]
