---
- name: Converge BlitzeCDN edge servers
  hosts: blitzecdn_edges
  become: true
  gather_facts: true
  # One failed edge stops the play. `max_fail_percentage` is deliberately not
  # set alongside this: it expresses the same policy in a second dialect, and
  # the two invite a later reader to change one and believe they have changed
  # the rule. `any_errors_fatal` is the stricter of the pair and wins anyway.
  #
  # It matters more now than it did, not less. A runtime upgrade rolls out one
  # batch at a time, and an image that fails to serve on the first batch must
  # stop the rollout rather than reaching the whole fleet — each failing edge
  # returns to its previous image on its own, but only the play can stop the
  # next batch from being handed the same broken build.
  any_errors_fatal: true
  serial: "25%"
  pre_tasks:
    - name: Validate supported operating system
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Ubuntu'
          - ansible_facts.distribution_version == '26.04'
        fail_msg: BlitzeCDN edges for this release require Ubuntu 26.04 LTS.
      tags: [always]
    # Establishes and validates the shared edge runtime contract: the host
    # paths, the public listener sets, the status endpoint, the runtime image
    # and the GeoIP database that blitzecdn_nginx, blitzecdn_edge_stack and
    # blitzecdn_firewall all converge against. First, and before anything on
    # the host changes, so a contract no edge could serve fails a play that has
    # not yet touched the machine.
    #
    # This replaced a pairwise assertion here that blitzecdn_firewall's and
    # blitzecdn_nginx's HTTP/3 desired state agreed. There is one value now, so
    # they cannot disagree — and the contract asserts the part that assertion
    # could not: that 443 is actually an HTTPS listener for QUIC to attach to.
    - name: Establish the shared edge runtime contract
      ansible.builtin.import_role:
        name: blitzecdn_edge
      tags: [always, firewall, nginx, edge_stack]
    # The container engine, and then everything the edge runtime needs to exist
    # before a configuration is rendered: the persistent directories, the
    # runtime image, the Compose project and the GeoLite2 database.
    #
    # Both run before the firewall: opening the public ports on a host that
    # cannot serve them advertises an edge that is not there. The container
    # itself is not started here — that waits until the configuration exists and
    # has passed `nginx -t`, at the end of the roles below.
    - name: Install and verify the host container engine
      ansible.builtin.import_role:
        name: blitzecdn_docker
      tags: [always, docker]
    - name: Prepare the persistent edge state and runtime image
      ansible.builtin.import_role:
        name: blitzecdn_edge_stack
        tasks_from: prepare.yml
      tags: [always, docker, edge_stack]
    - name: Verify the edge runtime image before firewall changes
      ansible.builtin.import_role:
        name: blitzecdn_nginx
        tasks_from: verify-runtime.yml
      vars:
        # The digest prepare.yml just pinned, not the tag it was asked for. The
        # image that is probed has to be the image that will serve.
        blitzecdn_nginx_config_test_image: >-
          {{ blitzecdn_edge_stack_resolved_image
             | default(blitzecdn_edge_runtime.image) }}
      tags: [always, nginx]
  roles:
    - role: blitzecdn_base
      tags: [base]
    # Before nginx, which resolves origin hostnames through the host resolver,
    # and before anything that fetches by name. Off unless enabled.
    - role: blitzecdn_resolver
      tags: [base, resolver]
    - role: blitzecdn_kernel
      tags: [kernel]
    - role: blitzecdn_firewall
      tags: [firewall]
    # Renders the whole configuration tree onto the host filesystem and proves
    # it loads, under the very image the container will run. Nothing is started
    # here and nothing is reloaded unless a container is already serving.
    - role: blitzecdn_nginx
      tags: [nginx]
    # Starts the edge, or leaves a running one alone, or replaces it for a
    # runtime upgrade — and then proves it is serving. Strictly after the
    # configuration exists: a container started against an incomplete tree is
    # an edge answering 444 for every customer.
    - role: blitzecdn_edge_stack
      tags: [nginx, edge_stack]
    # SSH policy comes after the firewall so a host that fails firewall
    # validation is never left key-only but unreachable from the management
    # network, and before Fail2Ban so bans apply to a daemon that has already
    # stopped accepting passwords. Both stay on the host: they protect and
    # configure the host itself, and an edge whose containers are all broken
    # must still be reachable for Ansible to repair it.
    - role: blitzecdn_sshd
      tags: [security, sshd]
    - role: blitzecdn_fail2ban
      tags: [security]
