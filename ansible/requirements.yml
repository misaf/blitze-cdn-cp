collections:
  # The edge roles ship separately from this control plane. Pin an exact
  # version: the desired-state document is a versioned contract, and an
  # unpinned edge collection would let the two drift with no diff to review.
  # Upgrading edges is a deliberate bump here, checked by tests/test_contract.py.
  - name: blitzecdn.edge
    source: https://github.com/misaf/blitze-cdn-edge.git
    type: git
    version: "1.0.0"
  - name: ansible.posix
    version: "2.1.0"
  - name: community.general
    version: "11.4.0"
