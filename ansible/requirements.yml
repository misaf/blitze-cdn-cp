---
collections:
  # The edge roles are no longer a collection: they live in ansible/roles/ and
  # ship with this control plane, so the desired-state contract and the roles
  # that honour it always move in the same commit. Only their third-party
  # dependencies are installed here, pinned exactly — an unpinned range would
  # let a Galaxy release change how an edge is converged with no diff to review.
  - name: ansible.posix
    version: "2.2.0"
  - name: community.general
    version: "11.4.0"
  # Docker Engine, Compose projects, images and container exec. Pinned exactly
  # for the same reason as the two above: these modules start, recreate and
  # stop the process that serves every visitor, so a Galaxy release must not be
  # able to change how that happens without a diff in this repository.
  - name: community.docker
    version: "5.2.2"
