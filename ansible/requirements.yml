---
collections:
  # The edge roles are no longer a collection: they live in ansible/roles/ and
  # ship with this control plane, so the desired-state contract and the roles
  # that honour it always move in the same commit. Only their third-party
  # dependencies are installed here, pinned exactly — an unpinned range would
  # let a Galaxy release change how an edge is converged with no diff to review.
  - name: ansible.posix
    version: "2.2.0"
  - name: community.general
    version: "11.4.0"
