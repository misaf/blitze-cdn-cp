---
collections:
  # The edge roles ship separately from this control plane. Pin an exact
  # version: the desired-state document is a versioned contract, and an
  # unpinned edge collection would let the two drift with no diff to review.
  # Upgrading edges is a deliberate bump here, checked by
  # tests/test_contract.py.
  - name: blitzecdn.edge
    source: https://github.com/misaf/blitze-cdn-edge.git
    type: git
    # This is a Git ref, not the Ansible collection metadata version. Release
    # tags use a v prefix; galaxy.yml and MANIFEST.json must not.
    version: "v1.4.3"
  - name: ansible.posix
    version: "2.2.0"
  - name: community.general
    version: "11.4.0"
