[defaults]
inventory = inventory/hosts.yml
host_key_checking = True
forks = 20
; Every role BlitzeCDN ships lives in ansible/roles/ — the edge roles and the
; one that converges the controller's own host alike. collections_path is only
; for their third-party dependencies (ansible.posix, community.general), pinned
; in requirements.yml. Relative paths here resolve against this file.
collections_path = ../.state/collections:~/.ansible/collections:/usr/share/ansible/collections
roles_path = roles
retry_files_enabled = False
interpreter_python = auto_silent
timeout = 20
local_tmp = ../.state/ansible-local
; blitzecdn_result is how the control plane learns what a run did. It writes a
; JSON document to the path in BLITZE_RESULT_PATH; nothing reads the terminal
; output, which goes to a per-run log file for operators instead. With the
; variable unset the plugin is inert, so `ansible-playbook` by hand behaves
; exactly as it always did.
callback_plugins = plugins/callback
callbacks_enabled = blitzecdn_result

[privilege_escalation]
become = False
become_method = sudo
become_user = root

[ssh_connection]
pipelining = True
; PreferredAuthentications and PasswordAuthentication=no make the controller
; refuse to authenticate with anything but a key, matching what
; the blitzecdn_sshd role enforces on the host. Without them a
; misconfigured edge could be converged over a password and nobody would know.
; BatchMode=yes turns every remaining prompt — passphrase, password, host-key
; confirmation — into an immediate failure instead of a deploy that hangs
; waiting on a terminal that may not exist. Use an SSH agent for passphrases.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o PreferredAuthentications=publickey -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no -o BatchMode=yes
