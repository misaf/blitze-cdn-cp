[defaults]
; The fleet comes from the control-plane database through the `blitzecdn`
; inventory plugin; this file is its configuration, not a host list. See
; inventory/blitzecdn.yml and plugins/inventory/blitzecdn.py.
inventory = inventory/blitzecdn.yml
host_key_checking = True
forks = 20
; Core's roles — the edge roles and the one that converges the controller's own
; host alike. An optional capability's roles are NOT here: they ship inside that
; capability's wheel, and the control plane composes the real search path in
; ANSIBLE_ROLES_PATH (see blitzecdn/core/ansible/roles.py), which overrides this
; value on every run it makes. This entry is what a bare `ansible-playbook` in a
; checkout resolves against. collections_path is only for third-party
; dependencies (ansible.posix, community.general), pinned in requirements.yml.
; Relative paths here resolve against this file.
collections_path = ../.state/collections
roles_path = roles
retry_files_enabled = False
interpreter_python = auto_silent
timeout = 20
local_tmp = ../.state/ansible-local
inventory_plugins = plugins/inventory

[inventory]
; `blitzecdn` is listed first so it claims inventory/blitzecdn.yml before the
; generic `yaml` plugin can try to parse it as a host list and fail. `auto` and
; the file plugins stay enabled so `-i` still accepts an ordinary inventory
; file — useful for converging a host that is not yet a managed edge.
enable_plugins = blitzecdn, host_list, script, auto, yaml, ini, toml
; An inventory source that cannot be parsed must stop the run. The default
; warns and continues, which for a dynamic inventory means a deploy that
; reports success having converged nothing because the fleet came back empty.
unparsed_is_failed = True
any_unparsed_is_failed = True

[privilege_escalation]
become = False
become_method = sudo
become_user = root

[ssh_connection]
pipelining = True
; PreferredAuthentications and PasswordAuthentication=no make the controller
; refuse to authenticate with anything but a key, matching what
; the blitzecdn_sshd role enforces on the host. Without them a
; misconfigured edge could be converged over a password and nobody would know.
; BatchMode=yes turns every remaining prompt — passphrase, password, host-key
; confirmation — into an immediate failure instead of a deploy that hangs
; waiting on a terminal that may not exist. Use an SSH agent for passphrases.
ssh_args = -F /opt/blitzecdn/.state/.ssh/config -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o PreferredAuthentications=publickey -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no -o BatchMode=yes
