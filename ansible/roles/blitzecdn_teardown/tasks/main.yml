---
# Defensive validation only. Whether this host should be retired is a control
# plane decision; this role removes what the collection wrote and nothing more.

- name: Locate managed Nginx configurations
  ansible.builtin.find:
    paths:
      - /etc/nginx/sites-available
      - /etc/nginx/conf.d
    patterns: "*.conf"
    contains: "^{{ blitzecdn_teardown_marker | regex_escape }}$"
  register: blitzecdn_teardown_found

# Matching on the marker rather than on the managed-sites registry finds
# configurations the registry never learned about — anything written by a run
# that failed `nginx -t` and was rolled back, or that predates the registry.
# Those are exactly the files a registry-driven cleanup leaves behind forever.
- name: Select managed configurations and their enabled links
  ansible.builtin.set_fact:
    blitzecdn_teardown_configs: "{{ blitzecdn_teardown_found.files | map(attribute='path') | list }}"
    blitzecdn_teardown_links: >-
      {{ blitzecdn_teardown_found.files
         | map(attribute='path') | map('basename')
         | map('regex_replace', '^', '/etc/nginx/sites-enabled/') | list }}

# Links first: a dangling symlink in sites-enabled is a configuration error
# that fails `nginx -t` below, and the validation is the point of this order.
- name: Disable managed sites
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ blitzecdn_teardown_links }}"

- name: Remove managed Nginx configurations
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ blitzecdn_teardown_configs }}"

- name: Remove the managed-site registry
  ansible.builtin.file:
    path: "{{ blitzecdn_teardown_managed_sites_file }}"
    state: absent

- name: Check whether Nginx is installed
  ansible.builtin.stat:
    path: /usr/sbin/nginx
  register: blitzecdn_teardown_nginx_binary

# Reloaded here rather than through a handler, and before the certificates are
# deleted below. A running Nginx still holds the old configuration until it is
# told otherwise, and that configuration references key files this role is
# about to remove — reloading afterwards would be a reload onto missing files.
- name: Validate the remaining configuration
  ansible.builtin.command:
    argv: [nginx, -t]
  changed_when: false
  when:
    - blitzecdn_teardown_nginx_binary.stat.exists
    - not ansible_check_mode

- name: Reload Nginx without the managed sites
  ansible.builtin.systemd_service:
    name: nginx
    state: reloaded
  when:
    - blitzecdn_teardown_nginx_binary.stat.exists
    - not ansible_check_mode

- name: Remove the ACME webroot
  ansible.builtin.file:
    path: "{{ blitzecdn_teardown_acme_root }}"
    state: absent

- name: Remove cached responses
  ansible.builtin.file:
    path: "{{ blitzecdn_teardown_cache_path }}"
    state: absent

- name: Inspect the managed firewall rule registry
  ansible.builtin.stat:
    path: "{{ blitzecdn_teardown_firewall_registry }}"
  register: blitzecdn_teardown_firewall_registry_stat

- name: Read the managed firewall rule registry
  ansible.builtin.slurp:
    path: "{{ blitzecdn_teardown_firewall_registry }}"
  register: blitzecdn_teardown_firewall_registry_content
  when: blitzecdn_teardown_firewall_registry_stat.stat.exists

- name: Select managed firewall rules
  ansible.builtin.set_fact:
    blitzecdn_teardown_firewall_rules: >-
      {{
        (blitzecdn_teardown_firewall_registry_content.content | default('') | b64decode).splitlines()
        | select('match', '^(tcp|udp)\|[0-9]{1,5}\|[^|]+$') | list
      }}

- name: Withdraw managed firewall rules
  community.general.ufw:
    rule: allow
    direction: in
    delete: true
    proto: "{{ item.split('|')[0] }}"
    port: "{{ item.split('|')[1] }}"
    src: "{{ item.split('|')[2] }}"
  loop: "{{ blitzecdn_teardown_firewall_rules }}"
  when: not ansible_check_mode

# Only after the firewall registry has been consumed, and once no loaded Nginx
# configuration refers to its TLS files. This tree contains both artifacts.
- name: Remove controller-written edge state and TLS material
  ansible.builtin.file:
    path: "{{ blitzecdn_teardown_state_path }}"
    state: absent

- name: Stop and disable edge-owned timers and services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: "{{ blitzecdn_teardown_geoip_units }}"
  failed_when: false

- name: Remove edge-owned timers and service units
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}"
    state: absent
  loop: "{{ blitzecdn_teardown_geoip_units }}"
  notify: Reload systemd after edge teardown

- name: Remove edge security and GeoIP configuration
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ blitzecdn_teardown_sshd_file }}"
    - "{{ blitzecdn_teardown_fail2ban_file }}"
    - "{{ blitzecdn_teardown_sysctl_file }}"
    - "{{ blitzecdn_teardown_geoip_config_file }}"
  notify:
    - Reload SSH after edge teardown
    - Reload Fail2Ban after edge teardown
    - Reapply kernel settings after edge teardown

- name: Remove the access log
  ansible.builtin.file:
    path: "{{ blitzecdn_teardown_access_log_path }}"
    state: absent
  when: blitzecdn_teardown_remove_logs

# The report the control plane records against the decommission. Anything still
# listed here needs a human on the host, because after the inventory entry goes
# there is no way back to it.
# Restores whatever the link supplies, which is the state the host was in
# before blitzecdn_resolver ran. If that resolver was the reason this fleet
# needed the role, the host goes back to resolving badly -- correct for a
# decommission, and worth knowing before running one on a live host.
- name: Remove the managed resolver drop-in
  ansible.builtin.file:
    path: "{{ blitzecdn_teardown_resolver_file }}"
    state: absent
  register: blitzecdn_teardown_resolver_removed

- name: Restart systemd-resolved without the managed drop-in
  ansible.builtin.systemd_service:
    name: systemd-resolved
    state: restarted
  when:
    - blitzecdn_teardown_resolver_removed.changed
    - not ansible_check_mode

- name: Confirm the host is clean
  ansible.builtin.stat:
    path: "{{ item }}"
  register: blitzecdn_teardown_residue
  loop: >-
    {{
      [blitzecdn_teardown_state_path,
       blitzecdn_teardown_cache_path,
       blitzecdn_teardown_acme_root,
       blitzecdn_teardown_managed_sites_file,
       blitzecdn_teardown_resolver_file,
       blitzecdn_teardown_sshd_file,
       blitzecdn_teardown_fail2ban_file,
       blitzecdn_teardown_sysctl_file,
       blitzecdn_teardown_geoip_config_file]
      + ([blitzecdn_teardown_access_log_path] if blitzecdn_teardown_remove_logs else [])
      + (blitzecdn_teardown_geoip_units
         | map('regex_replace', '^', '/etc/systemd/system/') | list)
    }}

- name: Fail if anything survived
  ansible.builtin.assert:
    that: blitzecdn_teardown_residue.results | selectattr('stat.exists') | list | length == 0
    fail_msg: >-
      Teardown left files on {{ inventory_hostname }}:
      {{ blitzecdn_teardown_residue.results | selectattr('stat.exists')
         | map(attribute='item') | join(', ') }}.
      Remove them before the host leaves inventory.
    success_msg: No BlitzeCDN files remain on {{ inventory_hostname }}.
  when: not ansible_check_mode
