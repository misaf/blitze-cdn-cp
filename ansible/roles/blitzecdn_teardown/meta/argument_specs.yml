---
argument_specs:
  main:
    short_description: Remove BlitzeCDN configuration and TLS material from an edge.
    description:
      - >-
        Takes a host out of service by deleting everything blitzecdn_nginx
        wrote to it: managed virtual hosts, the catch-all default site, the
        cache and status configuration, the managed-sites registry, the cache
        contents, the ACME webroot, and /etc/blitzecdn including private keys.
      - >-
        Stops and removes the Compose project first: a running edge holds the
        configuration it loaded, including the key files this role deletes.
      - >-
        Leaves the container engine and shared packages installed, but withdraws the dedicated Nginx,
        firewall, resolver, SSH, Fail2Ban, kernel and GeoIP artifacts written by
        the edge roles. It does not alter unrelated administrator configuration.
      - >-
        Must run while the host is still in inventory. Once the control plane
        drops the inventory entry no playbook can reach the host again, and
        anything left here stays until someone logs in and removes it by hand.
    options:
      blitzecdn_teardown_cache_path:
        type: path
        required: true
        description: Must equal blitzecdn_nginx_cache_path on the same host.
      blitzecdn_teardown_managed_sites_file:
        type: path
        required: true
        description: Must equal blitzecdn_nginx_managed_sites_file on the same host.
      blitzecdn_teardown_acme_root:
        type: path
        required: true
        description: Must equal blitzecdn_nginx_acme_root on the same host.
      blitzecdn_teardown_state_path:
        type: path
        required: true
        description: >-
          Root of the controller-written state tree, holding managed TLS
          certificates and keys under tls/. Removed recursively.
      blitzecdn_teardown_firewall_registry:
        type: path
        required: true
      blitzecdn_teardown_sshd_file:
        type: path
        required: true
      blitzecdn_teardown_fail2ban_file:
        type: path
        required: true
      blitzecdn_teardown_sysctl_file:
        type: path
        required: true
      blitzecdn_teardown_geoip_config_file:
        type: path
        required: true
      blitzecdn_teardown_geoip_units:
        type: list
        elements: str
        required: true
      blitzecdn_teardown_marker:
        type: str
        required: true
        description: First line of every file this collection writes into /etc/nginx.
      blitzecdn_teardown_compose_file:
        type: path
        required: true
        description: Must equal blitzecdn_edge_stack_compose_file on the same host.
      blitzecdn_teardown_project: {type: str, required: true}
      blitzecdn_teardown_container: {type: str, required: true}
      blitzecdn_teardown_runtime_path: {type: path, required: true}
      blitzecdn_teardown_empty_root: {type: path, required: true}
      blitzecdn_teardown_resolver_file: {type: path, required: true}
      blitzecdn_teardown_remove_data:
        type: bool
        default: true
        description: >-
          Destroy the persistent state as well as the containers. The
          containers always go — they are disposable by construction. TLS
          material, the configuration tree, ACME state, the cache and the
          managed-site registry go only when this is true, so "take the runtime
          off this host" and "erase what this host was serving" cannot be
          confused for each other.
      blitzecdn_teardown_remove_logs:
        type: bool
        default: false
        description: Also delete the BlitzeCDN access log.
      blitzecdn_teardown_access_log_path:
        type: path
        required: true
        description: Must equal blitzecdn_nginx_access_log_path on the same host.
