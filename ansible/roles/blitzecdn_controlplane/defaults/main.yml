---
# The control-plane host is a Debian/Ubuntu host like any edge, so its state is
# converged the same way an edge's is. What the installer keeps is only what has
# to exist before Ansible can run at all: the packages Python needs, the
# virtualenv, and the pinned collections.
blitzecdn_controlplane_install_dir: /opt/blitzecdn
blitzecdn_controlplane_config_dir: /etc/blitzecdn
blitzecdn_controlplane_service_user: blitzecdn
blitzecdn_controlplane_service_home: /var/lib/blitzecdn
# Deliberately outside the installation directory: an uninstall removes
# /opt/blitzecdn and everything in it, and the one thing that must survive
# that is the backup taken before it.
blitzecdn_controlplane_backup_dir: /var/backups/blitzecdn
blitzecdn_controlplane_deploy_user: deploy
blitzecdn_controlplane_cli_wrapper: /usr/local/bin/blitzecdn
blitzecdn_controlplane_sudoers_file: /etc/sudoers.d/blitzecdn-deploy

# python3 and python3-venv are absent here on purpose: the installer has already
# had to install them to build the virtualenv this play is running from.
blitzecdn_controlplane_packages: [certbot, git, openssh-server, openssl, redis-server, sudo]

# Set on a first installation only. An existing environment file keeps its
# credentials; supplying an address repoints the ACME account, and omitting it
# leaves the file alone on a repair run.
blitzecdn_controlplane_acme_email: ""
blitzecdn_controlplane_certificate_reconcile_seconds: 600
blitzecdn_controlplane_ssl_automatic_scan_seconds: 2592000
blitzecdn_controlplane_certificate_renewal_seconds: 43200
blitzecdn_controlplane_drift_check_seconds: 3600
blitzecdn_controlplane_preflight_dns_servers: 1.1.1.1,1.0.0.1

# Kept in step with CONTROL_PLANE_SERVICES in install.sh, which needs the same
# list to stop the services an update replaces. tests/test_install.py compares
# the two, because a unit added here and missed there would survive an update
# still running the release it was supposed to replace.
blitzecdn_controlplane_units:
  - blitzecdn-api.service
  - blitzecdn-worker.service
blitzecdn_controlplane_services:
  - blitzecdn-api.service
  - blitzecdn-worker.service
