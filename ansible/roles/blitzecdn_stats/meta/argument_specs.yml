---
argument_specs:
  main:
    short_description: Report cache and connection counters from a BlitzeCDN edge.
    description:
      - >-
        Reads the access log and stub_status endpoint that blitzecdn_nginx
        configures and publishes the result as the C(blitzecdn_report) fact,
        which the control plane's callback plugin collects as part of the run's
        structured result.
      - >-
        Read-only. It changes nothing on the edge, so it is safe to schedule
        and safe to run during a deployment.
    options:
      blitzecdn_stats_access_log_path:
        type: path
        required: true
        description: Must equal blitzecdn_nginx_access_log_path on the same host.
      blitzecdn_stats_status_address: {type: str, required: true}
      blitzecdn_stats_status_port: {type: int, required: true}
      blitzecdn_stats_status_path: {type: str, required: true}
      blitzecdn_stats_max_lines:
        type: int
        required: true
        description: Newest access-log lines to read.
