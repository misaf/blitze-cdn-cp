---
argument_specs:
  main:
    short_description: Run the edge roles the installed capabilities contribute.
    description:
      - >-
        The slot an optional distribution's Ansible fills. It names no
        capability: the control plane resolves blitzecdn_capability_roles from
        the plugins it discovered and passes it on every run, and this role
        includes each one in turn.
      - >-
        A capability role reads the shared edge runtime contract and notifies
        the fleet's "Validate and reload Nginx" handler exactly as core's roles
        do. It must not read another role's variables, and nothing here reads
        its.
    options:
      blitzecdn_capability_roles:
        type: list
        elements: str
        default: []
        description: >-
          Role names, composed by the control plane from every installed
          plugin's Ansible contribution and ordered by plugin name. Empty on an
          installation with no capability that converges an edge.
