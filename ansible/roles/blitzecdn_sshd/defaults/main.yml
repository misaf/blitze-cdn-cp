---
blitzecdn_sshd_enabled: true

# Users permitted to log in at all. Empty means "do not emit AllowUsers", which
# leaves the distribution default (any account with a shell). Populate it and
# SSH becomes a closed list. Every listed user is key-checked before passwords
# are disabled, so an entry with no authorized_keys fails the play rather than
# locking the account out.
blitzecdn_sshd_allow_users: []

# 'no' matches the BlitzeCDN model: non-root SSH users with explicit sudo.
# 'prohibit-password' is the only other value worth setting, and only for
# break-glass automation that already holds a root key.
blitzecdn_sshd_permit_root_login: 'no'

blitzecdn_sshd_config_path: /etc/ssh/sshd_config.d/50-blitzecdn.conf
blitzecdn_sshd_service: ssh

blitzecdn_sshd_login_grace_time: 20
blitzecdn_sshd_max_auth_tries: 3
blitzecdn_sshd_max_sessions: 10
blitzecdn_sshd_client_alive_interval: 300
blitzecdn_sshd_client_alive_count_max: 2

# Ansible needs neither. Both are attacker-useful pivots from a compromised
# edge, so they are off unless an operator has a reason.
blitzecdn_sshd_allow_tcp_forwarding: false
blitzecdn_sshd_allow_agent_forwarding: false
