---
argument_specs:
  main:
    short_description: Run the BlitzeCDN edge as a Docker Compose project.
    description:
      - >-
        Owns the edge *runtime*: the Compose project, the image it runs, the
        persistent host directories the container mounts, the GeoLite2 updater
        and the health verification that decides whether a converge succeeded.
      - >-
        It renders no customer configuration. blitzecdn_nginx writes the whole
        configuration tree to the host filesystem and this role mounts it
        read-only, which is what keeps a site change a reload rather than a
        container replacement.
      - >-
        Everything it shares with blitzecdn_nginx and blitzecdn_firewall — the
        Compose project and container names, the image, every mounted host
        directory including the capability data directory, the status endpoint
        and the public listener sets — comes from the blitzecdn_edge role. It reads no variable
        belonging to another role; it used to derive fifteen of its defaults
        from blitzecdn_nginx_*.
      - >-
        prepare.yml is a separate entry point, run before the installed
        capabilities' roles, before the firewall and before any configuration is
        rendered. A capability role needs the runtime directories and the
        Compose project this creates, and the image has to exist before anything
        can be validated against it, but the container must not start until the
        configuration has passed nginx -t.
    options:
      blitzecdn_edge_runtime:
        type: dict
        required: true
        description: >-
          The shared edge runtime contract, owned and validated by the
          blitzecdn_edge role. This role reads the image it serves, the
          project and container it creates, the host directories it mounts,
          the status endpoint and listeners it verifies.
      blitzecdn_edge_stack_image_pull:
        type: bool
        required: true
        description: >-
          Fetch the image from its registry when absent. Off for an air-gapped
          or pre-seeded fleet; the converge then fails clearly on a missing
          image instead of reaching for a registry it cannot see.
      blitzecdn_edge_stack_image_reference: {type: str, required: true}
      blitzecdn_edge_stack_project: {type: str, required: true}
      blitzecdn_edge_stack_compose_file: {type: path, required: true}
      blitzecdn_edge_stack_runtime_path: {type: path, required: true}
      blitzecdn_edge_stack_deployed_image_file:
        type: path
        required: true
        description: >-
          What the last successful converge was asked for and what that
          resolved to. Reading it back is what tells a re-converge from an
          upgrade, and what gives a rollback an exact image to return to.
      blitzecdn_edge_stack_health_timeout:
        type: int
        required: true
        description: >-
          How long a recreated edge is given to report healthy and open every
          listener. Health is always required; only the deadline is tunable.
      blitzecdn_edge_stack_stop_grace_period: {type: str, required: true}
      blitzecdn_edge_stack_recreate:
        type: bool
        required: true
        description: >-
          Force a container replacement even when nothing about it changed. Off:
          a configuration deployment must not replace the process serving
          traffic.
