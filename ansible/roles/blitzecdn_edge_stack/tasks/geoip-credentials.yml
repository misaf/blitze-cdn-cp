---
# The GeoIP directory and the MaxMind credentials, written *before* the Compose
# file that names them.
#
# Ordering, not taste: the geoipupdate service declares this env_file, and
# `docker compose config` — which validates the rendered project before it
# replaces the file the running stack was created from — fails on an env_file
# that does not exist yet.
- name: Create the GeoIP database directory
  ansible.builtin.file:
    path: "{{ blitzecdn_edge_stack_geoip_path }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: blitzecdn_edge_stack_geoip_enabled | bool

# 0600 root: the license key authenticates to a MaxMind account, so it is a
# credential rather than a database identifier. It reaches the container as an
# env_file rather than an `environment:` entry, so it never appears in the
# Compose file or in `docker inspect`.
- name: Configure the MaxMind credentials
  ansible.builtin.template:
    src: geoipupdate.env.j2
    dest: "{{ blitzecdn_edge_stack_geoip_env_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when:
    - blitzecdn_edge_stack_geoip_enabled | bool
    - blitzecdn_edge_stack_geoip_license_key | length > 0

# Withdrawn as soon as GeoIP is off, so a fleet that stops using country rules
# stops holding a MaxMind credential on every edge. The Compose file rendered
# after this no longer declares the service that reads it.
- name: Withdraw the MaxMind credentials
  ansible.builtin.file:
    path: "{{ blitzecdn_edge_stack_geoip_env_file }}"
    state: absent
  when: not (blitzecdn_edge_stack_geoip_enabled | bool)
