---
# Everything the edge needs in place *before* its configuration is rendered.
#
# Split out of main.yml because the ordering is forced from two directions. The
# runtime image has to exist before anything can be validated against it, and
# the persistent directories before anything writes into them — but the
# container itself must not start until the configuration is written and has
# passed `nginx -t`. So: this file first, then the installed capabilities'
# roles, then the Nginx role, and main.yml last.
- name: Prepare the edge runtime
  block:
    - name: Validate the fresh edge host
      ansible.builtin.import_tasks: validate-host.yml

    - name: Create the persistent edge directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner | default('root') }}"
        group: "{{ item.group | default('root') }}"
        mode: "{{ item.mode }}"
      loop:
        - {path: "{{ blitzecdn_edge_runtime.paths.state }}", mode: "0755"}
        # Read-only in the container and root-only on the host: this is where
        # the njs implementation of Under Attack Mode lives, and it is signed
        # with a fleet secret.
        - {path: "{{ blitzecdn_edge_runtime.paths.modules }}", group: www-data, mode: "0750"}
        - {path: "{{ blitzecdn_edge_runtime.paths.tls }}", mode: "0700"}
        - {path: "{{ blitzecdn_edge_stack_runtime_path }}", mode: "0700"}
        # The three configuration directories the container mounts. Created
        # here rather than by a package, because there is no longer a package:
        # a bind mount of a path that does not exist makes Docker create it as
        # an empty root-owned directory, and an edge would start with no
        # configuration at all and answer 404 for every site.
        - {path: "{{ blitzecdn_edge_runtime.paths.nginx }}", mode: "0755"}
        - {path: "{{ blitzecdn_edge_runtime.paths.nginx }}/conf.d", mode: "0755"}
        - {path: "{{ blitzecdn_edge_runtime.paths.nginx }}/sites-available", mode: "0755"}
        - {path: "{{ blitzecdn_edge_runtime.paths.nginx }}/sites-enabled", mode: "0755"}
        # Nginx opens its logs as the root master process; adm is the group
        # Ubuntu gives log readers, and it is what a Phase 2 log shipper will
        # join rather than being given root.
        - {path: "{{ blitzecdn_edge_runtime.paths.logs }}", owner: www-data, group: adm, mode: "0755"}
        # A generic writable runtime volume. The cache capability decides
        # whether Nginx uses it; core creates it because Compose mounts it even
        # on a capability-free edge and must never let Docker invent ownership.
        - {path: "{{ blitzecdn_edge_runtime.paths.cache }}", owner: www-data, group: www-data, mode: "0750"}
        # Where an installed capability leaves data the edge reads — a lookup
        # database, a table. Created here because the container mounts it and
        # a bind mount of a missing path becomes an empty root-owned directory;
        # what goes in it is the contributing capability's role's business, and
        # an installation with no such capability simply mounts it empty.
        - {path: "{{ blitzecdn_edge_runtime.paths.data }}", mode: "0755"}
        # The empty document root a location can dispatch through without
        # serving a file. Created here for the same reason as the rest: the
        # container mounts it, and Docker turns a missing bind source into an
        # empty root-owned directory rather than failing.
        - {path: "{{ blitzecdn_edge_runtime.paths.empty }}", mode: "0755"}
      loop_control:
        label: "{{ item.path }}"

    - name: Resolve the edge runtime image
      ansible.builtin.import_tasks: image.yml

    - name: Render the Compose project
      ansible.builtin.import_tasks: compose.yml
