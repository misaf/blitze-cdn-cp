---
# A native Nginx and the edge container cannot both own :80.
#
# Left alone this is the worst kind of failure: the container fails to bind,
# Docker restarts it forever, and the host keeps serving whatever the native
# Nginx last loaded. Every deploy afterwards reports success against a fleet
# that is not running any of it. So the converge stops instead, and says how to
# proceed.
- name: Look for a native Nginx installation
  ansible.builtin.stat:
    path: /usr/sbin/nginx
  register: blitzecdn_edge_stack_native_binary

- name: Refuse to converge over a native Nginx edge
  ansible.builtin.assert:
    that:
      - not blitzecdn_edge_stack_native_binary.stat.exists
        or blitzecdn_edge_stack_migrate_from_native
    fail_msg: >-
      {{ inventory_hostname }} has a native Nginx at /usr/sbin/nginx. This
      release runs the edge as a container, and the two cannot share the public
      ports. Migrate this host once with
      `-e blitzecdn_edge_stack_migrate_from_native=true`, which stops and purges
      the native stack before the container starts, or rebuild the edge from a
      clean Ubuntu 26.04 image. Nothing was changed on this host.

- name: Migrate this edge off its native Nginx
  when:
    - blitzecdn_edge_stack_native_binary.stat.exists
    - blitzecdn_edge_stack_migrate_from_native
  block:
    # Stopped before the packages go, and before anything tries to start a
    # container: an apt removal leaves a running process behind long enough for
    # the port to still be taken.
    - name: Stop and disable the native Nginx service
      ansible.builtin.systemd_service:
        name: nginx
        state: stopped
        enabled: false
      failed_when: false
      when: not ansible_check_mode

    - name: Stop and disable the native GeoIP updater timer
      ansible.builtin.systemd_service:
        name: blitzecdn-geoipupdate.timer
        state: stopped
        enabled: false
      failed_when: false
      when: not ansible_check_mode

    # Purged rather than removed. The configuration tree stays — it is exactly
    # the tree the container mounts, and the sites in it are the ones this edge
    # is meant to keep serving — but the packages' own conffiles must not be
    # left behind to be resurrected by a later apt operation.
    - name: Remove the native Nginx stack
      ansible.builtin.apt:
        name: "{{ blitzecdn_edge_stack_native_packages }}"
        state: absent
        purge: true
        autoremove: true
      register: blitzecdn_edge_stack_native_removed
      until: blitzecdn_edge_stack_native_removed is success
      retries: 3
      delay: 5

    # apt purge takes the package's own directories with it, including the
    # sites-enabled links that point at the configurations this edge serves.
    # Recreating the tree is prepare.yml's job; noticing it went is this one's.
    - name: Confirm the native listeners are gone
      ansible.builtin.command:
        argv: [ss, -H, -lntp]
      register: blitzecdn_edge_stack_native_listeners
      changed_when: false
      when: not ansible_check_mode

    - name: Require the public ports to be free
      ansible.builtin.assert:
        that:
          - "'nginx' not in blitzecdn_edge_stack_native_listeners.stdout"
        fail_msg: >-
          A native Nginx is still listening on {{ inventory_hostname }} after
          the packages were purged. Something outside BlitzeCDN starts it.
          Stop it before converging, or the edge container will never bind.
      when: not ansible_check_mode
