---
argument_specs:
  main:
    short_description: Configure a fail-closed UFW edge firewall.
    description:
      - >-
        Converges the rule set rather than adding to it. ufw retains every rule
        it has ever been given, so the role records what it installed and
        withdraws anything missing from the next run's desired state — removing
        a CIDR from blitzecdn_firewall_ssh_sources revokes that network's access
        instead of leaving it admitted.
    options:
      blitzecdn_firewall_enabled: {type: bool, required: true}
      blitzecdn_firewall_ssh_port: {type: int, required: true}
      blitzecdn_firewall_ssh_sources: {type: list, elements: str, required: true}
      blitzecdn_edge_runtime:
        type: dict
        required: true
        description: >-
          The shared edge runtime contract, owned and validated by the
          blitzecdn_edge role. This role reads listeners.http and
          listeners.https — the TCP ports it admits — and listeners.http3,
          which adds visitor QUIC on UDP/443. Reading the same value the Nginx
          role binds is what makes an unreachable listener, or an open port
          nothing serves, impossible rather than merely tested for.
      blitzecdn_firewall_registry_file:
        type: path
        required: true
        description: >-
          Where the role records the rules it manages, so a later run can tell
          a rule it installed from one an operator added by hand and withdraw
          only its own.
