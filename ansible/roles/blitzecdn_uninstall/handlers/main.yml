---
- name: Reload systemd after removing units
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Reload Nginx without managed configurations
  ansible.builtin.systemd_service:
    name: nginx
    state: reloaded
  listen: Validate and reload Nginx after uninstall
  when: blitzecdn_uninstall_nginx_binary.stat.exists
