---
# This role deliberately leaves the checkout in place. It contains the
# ansible-playbook process executing these tasks; install.sh removes it after
# the play exits. Packages are shared host state and are not removed either.

- name: Inspect the control-plane Compose project
  ansible.builtin.stat:
    path: "{{ blitzecdn_uninstall_compose_file }}"
  register: blitzecdn_uninstall_compose

- name: Remove the control-plane containers and persistent Redis volume
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --file
      - "{{ blitzecdn_uninstall_compose_file }}"
      - down
      - --volumes
      - --remove-orphans
  when: blitzecdn_uninstall_compose.stat.exists
  changed_when: true

- name: Remove the local control-plane runtime image
  ansible.builtin.command:
    argv: [docker, image, rm, "{{ blitzecdn_uninstall_image }}"]
  register: blitzecdn_uninstall_image_removal
  changed_when: blitzecdn_uninstall_image_removal.rc == 0
  failed_when: false

- name: Stop and disable obsolete host application units
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: "{{ blitzecdn_uninstall_controlplane_units }}"
  failed_when: false

- name: Remove obsolete host application units
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}"
    state: absent
  loop: "{{ blitzecdn_uninstall_controlplane_units }}"
  notify: Reload systemd after removing units

- name: Remove edge-managed Linux state through its canonical role
  ansible.builtin.include_role:
    name: blitzecdn_teardown
  vars:
    blitzecdn_teardown_remove_logs: true

- name: Remove exact BlitzeCDN-owned host paths
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ blitzecdn_uninstall_cli_wrapper }}"
    - "{{ blitzecdn_uninstall_sudoers_file }}"

# Accounts come last: stopping the services first gives userdel a clean chance
# to remove them, and removing them through the user module also removes their
# dedicated homes and the local SSH trust stored there.
- name: Remove BlitzeCDN service accounts and homes
  ansible.builtin.user:
    name: "{{ item.name }}"
    state: absent
    remove: true
    force: true
  loop:
    - name: "{{ blitzecdn_uninstall_service_user }}"
      home: "{{ blitzecdn_uninstall_service_home }}"
    - name: "{{ blitzecdn_uninstall_deploy_user }}"
      home: "{{ blitzecdn_uninstall_deploy_home }}"
  loop_control:
    label: "{{ item.name }}"

- name: Ensure dedicated account homes are absent
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ blitzecdn_uninstall_service_home }}"
    - "{{ blitzecdn_uninstall_deploy_home }}"
