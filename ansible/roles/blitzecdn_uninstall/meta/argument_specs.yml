        type: path
      blitzecdn_uninstall_cli_wrapper:
        type: path
      blitzecdn_uninstall_sudoers_file:
        type: path
      blitzecdn_uninstall_service_user:
        type: str
      blitzecdn_uninstall_service_home:
        type: path
      blitzecdn_uninstall_deploy_user:
        type: str
      blitzecdn_uninstall_deploy_home:
        type: path
      blitzecdn_uninstall_controlplane_units:
        type: list
        elements: str
      blitzecdn_uninstall_edge_units:
        type: list
        elements: str
      blitzecdn_uninstall_managed_paths:
        type: list
        elements: path
      blitzecdn_uninstall_nginx_marker:
        type: str
