---
# Reachability and certificate validity, answered from this edge.
#
# `uri` rather than `wait_for` because a bare TCP connect cannot answer the
# question that actually breaks sites: whether the origin's certificate is
# valid for the SNI this edge will send.
#
# HEAD rather than GET: the point is to complete the exchange, not to transfer
# a body, and an origin that refuses HEAD still answers with a status — which
# is proof of reachability either way.
#
# `failed_when: false` throughout. A failing origin is the finding, not an
# error: a fleet-wide check that aborted on the first unreachable origin would
# stop before telling anyone about the rest.
- name: Probe each origin as this edge would reach it
  ansible.builtin.uri:
    url: "{{ item.origin_scheme }}://{{ item.origin_host }}:{{ item.origin_port }}/"
    method: HEAD
    # The name this edge puts in the TLS handshake and the Host header.
    # Probing with a different one would verify a certificate the edge never
    # asks for.
    headers:
      Host: "{{ item.origin_sni }}"
    validate_certs: "{{ item.origin_tls_verify | bool }}"
    follow_redirects: none
    # Any answer at all proves the origin is reachable. Which status it chose
    # for a HEAD at / is the origin's business, not this check's.
    status_code: -1
    timeout: "{{ blitzecdn_origins_timeout | int }}"
  loop: "{{ blitzecdn_origins_sites }}"
  loop_control:
    label: "{{ item.name }}"
  register: blitzecdn_origins_verified
  failed_when: false
  changed_when: false
  check_mode: false

# Only for the HTTPS origins the verified probe could not complete, and only to
# tell two very different failures apart: an origin nothing can reach, and one
# that is reachable but presenting a certificate this edge will not accept. The
# fixes are unrelated — a route or a firewall in the first case, the origin's
# certificate or the site's `origin_sni` in the second — and without this they
# arrive as the same "could not connect".
#
# It is never the basis for reporting an origin *healthy*; `tls_verified` is
# taken from the probe above, which validates.
- name: Re-probe unreachable HTTPS origins without verification
  ansible.builtin.uri:
    url: "https://{{ item.item.origin_host }}:{{ item.item.origin_port }}/"
    method: HEAD
    headers:
      Host: "{{ item.item.origin_sni }}"
    validate_certs: false
    follow_redirects: none
    status_code: -1
    timeout: "{{ blitzecdn_origins_timeout | int }}"
  loop: "{{ blitzecdn_origins_verified.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - item.item.origin_tls_verify | bool
    - (item.status | default(-1) | int) <= 0
  register: blitzecdn_origins_unverified
  failed_when: false
  changed_when: false
  check_mode: false

- name: Assemble one row per origin
  ansible.builtin.set_fact:
    blitzecdn_origins_rows: "{{ blitzecdn_origins_rows | default([]) + [row] }}"
  loop: "{{ blitzecdn_origins_verified.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  vars:
    # The matching entry from the pass above, if this origin needed one. A
    # skipped re-probe carries no `status`, so the default keeps it false.
    _retry: >-
      {{
        (blitzecdn_origins_unverified.results | default([]))
        | selectattr('item.item.name', 'defined')
        | selectattr('item.item.name', 'equalto', item.item.name)
        | list | first | default({})
      }}
    _verified: "{{ (item.status | default(-1) | int) > 0 }}"
    _unverified: "{{ (_retry.status | default(-1) | int) > 0 }}"
    _https: "{{ item.item.origin_scheme == 'https' }}"
    _verify: "{{ item.item.origin_tls_verify | bool }}"
    row:
      site: "{{ item.item.name }}"
      origin: "{{ item.item.origin_host }}:{{ item.item.origin_port }}"
      scheme: "{{ item.item.origin_scheme }}"
      ssl_mode: "{{ item.item.ssl_mode }}"
      sni: "{{ item.item.origin_sni if _https else None }}"
      # Reachable covers both passes: an origin that answered only without
      # verification is reachable, and its certificate is the problem.
      reachable: "{{ _verified or _unverified }}"
      tls_verified: "{{ _verified if (_https and _verify) else None }}"
      status: "{{ item.status | default(-1) | int }}"
      detail: "{{ item.msg | default('') | string }}"

# `blitzecdn_report` is the channel a role returns a payload on: the runner
# collects this fact from its event stream and delivers it in the run's
# structured result. Same mechanism the statistics role uses, and for the same reason —
# there is no controller-side file to write, collide over, or read a previous
# run's document out of.
- name: Publish this edge's origin report  # noqa: var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    blitzecdn_report:
      host: "{{ inventory_hostname }}"
      # Explicit Z: a timestamp that reads as local time on one edge and UTC on
      # another is worse than none when comparing edges.
      collected_at: "{{ now(utc=True).strftime('%Y-%m-%dT%H:%M:%SZ') }}"
      origins: "{{ blitzecdn_origins_rows | default([]) }}"
