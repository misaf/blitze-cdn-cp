---
# The one way anything on an edge asks for its configuration change to take
# effect — core's own tasks and an installed capability's role alike. A
# capability that writes a snippet into conf.d or an njs module under the
# modules path notifies "Validate and reload Nginx" by name; Ansible registers
# every role's handlers when the play starts, so the notification resolves even
# though blitzecdn_capabilities runs before this role does, and handlers flush
# at the end of the play, by which time the whole tree has been rendered.
#
# That last part is why the capability slot is a role in the play's `roles:`
# list and not a pre-task: handlers flush between pre-tasks and roles, so a
# capability notifying from there would run `nginx -t` against a tree
# blitzecdn_nginx had not written yet, and a first converge would fail with a
# configuration error that named nothing real.
#
# Validate, then reload — and reload by signalling the running container rather
# than replacing it. A site change is a configuration deployment, not a runtime
# upgrade: replacing the container would drop every connection in flight and
# empty the shared-memory cache zone for a change that Nginx applies without
# dropping a single request.
- name: Validate Nginx configuration
  ansible.builtin.include_tasks: config-test.yml
  listen: Validate and reload Nginx
  when: not ansible_check_mode

- name: Inspect the running edge container
  community.docker.docker_container_info:
    name: "{{ blitzecdn_edge_runtime.container }}"
  register: blitzecdn_nginx_running
  listen: Validate and reload Nginx
  when: not ansible_check_mode

# Skipped on a first converge, where there is nothing to reload: the container
# has not been started yet, and blitzecdn_edge_stack starts it — from the
# configuration this handler just validated — later in the same play.
- name: Reload Nginx after validation
  community.docker.docker_container_exec:
    container: "{{ blitzecdn_edge_runtime.container }}"
    argv: [nginx, -s, reload]
  listen: Validate and reload Nginx
  when:
    - not ansible_check_mode
    - blitzecdn_nginx_running.exists | default(false)
    - blitzecdn_nginx_running.container.State.Running | default(false)
