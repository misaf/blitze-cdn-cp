---
blitzecdn_nginx_sites: []
# Removing the final managed site is unusually destructive and often means a
# new controller was pointed at an existing edge before its state was imported.
# Require an explicit controller setting for that transition. A fresh edge has
# no registry and can still be hardened before its first site is added.
blitzecdn_nginx_allow_empty_sites: false
blitzecdn_nginx_cache_path: /var/cache/nginx/blitzecdn
blitzecdn_nginx_cache_zone: blitzecdn_cache
blitzecdn_nginx_cache_size: 100m
blitzecdn_nginx_cache_max_size: 10g
blitzecdn_nginx_cache_inactive: 60m
blitzecdn_nginx_proxy_connect_timeout: 5s
blitzecdn_nginx_proxy_read_timeout: 30s
blitzecdn_nginx_managed_sites_file: /etc/nginx/blitzecdn-managed-sites
# Cloudflare-compatible public proxy ports. Keeping HTTP and HTTPS separate is
# important: every HTTPS listener must carry Nginx's ssl parameter, while the
# HTTP listeners either proxy directly or redirect a TLS-enabled site.
blitzecdn_nginx_http_ports: [80, 8080, 8880, 2052, 2082, 2086, 2095]
blitzecdn_nginx_https_ports: [443, 2053, 2083, 2087, 2096, 8443]
# Derived by the control plane from enabled sites. HTTP/3 is intentionally
# fixed to UDP/443; the alternate HTTPS ports remain TCP-only.
blitzecdn_nginx_http3_enabled: false
blitzecdn_nginx_http3_listener_owner: ''
# The edge runtime image this role validates configuration against, and the
# container it reloads. Nginx no longer runs on the host: it runs in the
# container blitzecdn_edge_stack starts from this image, so `nginx -t` and
# `nginx -s reload` here mean "in that container".
#
# The fleet value is composed in inventory/group_vars/blitzecdn_edges from
# blitzecdn_edge_image_registry, _repository, _tag and _digest. The literal
# below is only the standalone fallback for a playbook that runs this role
# without that group, and it must equal blitzecdn_edge_stack's — validating a
# configuration against one image and then serving it from another is exactly
# the drift these two roles exist to prevent. tests/test_ansible_role_contracts
# asserts they agree.
blitzecdn_nginx_image_default: ghcr.io/misaf/blitzecdn-edge:2.7.0
blitzecdn_nginx_image: >-
  {{ blitzecdn_edge_image | default(blitzecdn_nginx_image_default, true) }}
blitzecdn_nginx_container: blitzecdn-edge
# Which image a configuration test runs under. Normally the image this edge
# runs; blitzecdn_edge_stack overrides it to validate the current configuration
# against a *new* image before replacing the container serving traffic.
blitzecdn_nginx_config_test_image: "{{ blitzecdn_nginx_image }}"
# The mounts a configuration test needs to see, in Compose's own
# host:container:mode form. The same set the running container gets, minus
# nothing: a test that cannot see a certificate or the GeoIP database passes
# against a tree the real edge would refuse. Cache and log are writable because
# `nginx -t` creates the proxy_cache_path levels and opens the error log.
# tests/test_ansible_role_contracts.py asserts this matches the Compose file.
blitzecdn_nginx_config_test_volumes:
  - /etc/nginx/conf.d:/etc/nginx/conf.d:ro
  - /etc/nginx/sites-available:/etc/nginx/sites-available:ro
  - /etc/nginx/sites-enabled:/etc/nginx/sites-enabled:ro
  - /etc/blitzecdn/nginx:/etc/blitzecdn/nginx:ro
  - /etc/blitzecdn/tls:/etc/blitzecdn/tls:ro
  - /var/lib/blitzecdn/acme:/var/lib/blitzecdn/acme:ro
  - /var/lib/blitzecdn/empty:/var/lib/blitzecdn/empty:ro
  - /usr/share/GeoIP:/usr/share/GeoIP:ro
  - /var/cache/nginx/blitzecdn:/var/cache/nginx/blitzecdn:rw
  - /var/log/nginx:/var/log/nginx:rw
# Certificate paths become copy destinations written as root, so confine them to
# directories that may legitimately hold certificates. Without this an operator
# could aim a deploy at /etc/cron.d or ~root/.ssh. Referenced as a variable, so
# the backslashes are literal rather than Jinja string escapes.
blitzecdn_nginx_certificate_path_pattern: '^/(?!.*(?:^|/)\.\.(?:/|$))etc/(?:blitzecdn/tls|ssl|letsencrypt)/[^;{}]+$'
blitzecdn_nginx_acme_root: /var/lib/blitzecdn/acme
# Defaults to Ubuntu 26.04's systemd-resolved stub listener. Set to [] to pin
# origin IPs at config-load time instead.
blitzecdn_nginx_resolvers: [127.0.0.53]
blitzecdn_nginx_resolver_valid: 30s
blitzecdn_nginx_resolver_timeout: 5s

# Emergency Layer-7 browser challenge support. The capability is deliberately
# separate from each site's policy: a site asking for protection while this is
# false fails validation instead of silently reaching its origin unchallenged.
# The signing secret is environment-only and is written into the njs module as
# root:www-data 0640 under no_log. Keep it stable across the fleet so clearance
# survives an edge change during its 30-minute lifetime.
blitzecdn_nginx_under_attack_enabled: false
blitzecdn_nginx_under_attack_passage_seconds: 1800
blitzecdn_nginx_under_attack_secret: "{{ lookup('env', 'BLITZE_UNDER_ATTACK_SECRET') }}"
blitzecdn_nginx_under_attack_js_file: /etc/blitzecdn/nginx/under-attack.js
blitzecdn_nginx_under_attack_conf_file: /etc/nginx/conf.d/blitzecdn-under-attack.conf
blitzecdn_nginx_under_attack_empty_root: /var/lib/blitzecdn/empty

# Claims the default_server position for a block that serves ACME challenges and
# answers everything else with 444. Without it, a request for a hostname no
# managed site declares is served by whichever site nginx loaded first, which on
# a shared edge is another customer's configuration. Turn off only on an edge
# that is genuinely single-tenant and fronted by something else.
blitzecdn_nginx_default_server: true
blitzecdn_nginx_default_site_file: /etc/nginx/sites-available/blitzecdn-default.conf

# Collapses client Accept-Encoding into "", "gzip" or "br" and makes it part of
# the cache key. Off, encodings share one cache entry per URI and a client can
# be served a body it cannot decode.
blitzecdn_nginx_normalize_accept_encoding: true

# Response compression (the `compression` setting on a site). gzip is built in;
# the ABI-matched Brotli filter is an invariant of the managed package stack.

# Compressing on the fly costs CPU on every response, including cache hits —
# the cache stores what the origin sent, and the compression filter runs on the
# way out. 5 is the knee of both curves: near the ratio of the maximum at a
# fraction of the cost. gzip's maximum is 9 and Brotli's is 11, and Brotli 11
# is a static-asset setting that has no business in a request path.
blitzecdn_nginx_gzip_comp_level: 5
blitzecdn_nginx_brotli_comp_level: 5
# Below this, framing and header overhead eat the saving and a small response
# can come out larger than it went in.
blitzecdn_nginx_compression_min_length: 256
# text/html is deliberately absent: both modules always compress it, and gzip
# warns about a duplicate MIME type on every config test if it is listed.
# Nothing already compressed belongs here either — recompressing a JPEG, a
# woff2 or a zip spends CPU to add bytes.
blitzecdn_nginx_compression_types:
  - text/plain
  - text/css
  - text/xml
  - text/javascript
  - text/markdown
  - application/javascript
  - application/json
  - application/ld+json
  - application/manifest+json
  - application/xml
  - application/rss+xml
  - application/atom+xml
  - application/vnd.api+json
  - application/wasm
  - image/svg+xml
  - font/ttf
  - font/otf

# Mozilla "intermediate" suites, TLS 1.2 only — TLS 1.3 picks its own and
# ignores this. All AEAD, all forward-secret.
blitzecdn_nginx_ssl_ciphers: >-
  ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305
# Off, because the CA this collection provisions from no longer publishes an
# OCSP responder URL in its certificates. Stapling against such a chain staples
# nothing and costs a warning on every `nginx -t` and reload, which trains
# operators to read a clean config test as noisy. Turn it back on only for a CA
# whose leaf carries an OCSP URL — the template also needs a resolver.
blitzecdn_nginx_ssl_stapling: false

# HSTS binds the customer's domain, not ours, and cannot be retracted faster
# than it expires in browsers that already saw it. Opt in per deployment.
blitzecdn_nginx_hsts_enabled: false
blitzecdn_nginx_hsts_max_age: 31536000

# Per-site request filtering (the `firewall` block on a site).
#
# Source, method and path rules need nothing beyond stock nginx and are always
# available. Country rules do not: they need ngx_http_geoip2 and a MaxMind
# country database on the host, neither of which this role can conjure, so they
# are opt-in per deployment. A site that asks for country rules on an edge
# where this is false fails the assertion in tasks/validate.yml rather than
# rendering a configuration that quietly admits every country.
#
# The same switch governs the BZ-IPCountry visitor header
# (`visitor_headers.ip_country` on a site), which reads the same
# $blitzecdn_country and fails the same assertion — an origin cannot tell a
# header that was never sent from a visitor whose country is unknown.
blitzecdn_nginx_geoip_enabled: false
blitzecdn_nginx_geoip_database: /usr/share/GeoIP/GeoLite2-Country.mmdb
blitzecdn_nginx_geoip_reload: 5m
blitzecdn_nginx_geoip_file: /etc/nginx/conf.d/blitzecdn-geoip.conf

# MaxMind GeoLite2 — free, but not anonymous. Downloads need an account and a
# license key, so the role can only fetch the database once you supply them.
# Leave them empty to manage the file yourself; the role then just checks it is
# there.
#
# The key is a secret. Do not commit it: set it from the controller's
# environment in group_vars, e.g.
#
#   blitzecdn_nginx_geoip_license_key: "{{ lookup('env', 'MAXMIND_LICENSE_KEY') }}"
#
# It is written to a 0600 root-owned file and every task that handles it sets
# no_log.
blitzecdn_nginx_geoip_account_id: ""
blitzecdn_nginx_geoip_license_key: ""
# Country is all the firewall rules need. GeoLite2-City is far larger and buys
# nothing here.
blitzecdn_nginx_geoip_edition: GeoLite2-Country
# MaxMind publishes GeoLite2 twice a week and rate-limits downloads, so the
# converge fetches only when the database is missing and leaves refreshes to
# the timer blitzecdn_edge_stack installs. nginx picks up a replaced file via
# `auto_reload`, with no reload. The updater itself is a container now — see
# blitzecdn_edge_stack — but the schedule stays here because it is fleet policy
# an operator sets, and both roles read the same value.
blitzecdn_nginx_geoip_update_enabled: true
blitzecdn_nginx_geoip_update_calendar: Wed,Sat 03:00
# Spreads a fleet's downloads across the morning instead of having every edge
# hit MaxMind on the same second.
blitzecdn_nginx_geoip_update_splay: 3h

# Observability.
#
# A CDN is judged on cache hit ratio, and without these it is invisible: the
# per-response X-Cache-Status header tells a client what happened to its own
# request and nobody else. The access log below puts the same value somewhere
# it can be counted, and the status endpoint exposes connection and request
# totals for the same purpose.
blitzecdn_nginx_access_log_enabled: true
blitzecdn_nginx_access_log_path: /var/log/nginx/blitzecdn-access.log
blitzecdn_nginx_log_format_name: blitzecdn

# ngx_http_stub_status_module, which Debian's and Ubuntu's nginx packages
# build in. Bound to loopback because it is unauthenticated and describes the
# edge's load; scrape it from an agent on the host, or over an SSH tunnel.
# `blitzecdn_nginx_status_allow` is the second, redundant control — do not
# widen the bind address without narrowing that, or the reverse.
blitzecdn_nginx_status_enabled: true
blitzecdn_nginx_status_address: 127.0.0.1
blitzecdn_nginx_status_port: 8090
blitzecdn_nginx_status_path: /stub_status
blitzecdn_nginx_status_allow: [127.0.0.1, "::1"]
blitzecdn_nginx_status_file: /etc/nginx/conf.d/blitzecdn-status.conf
