---
argument_specs:
  main:
    short_description: Converge Nginx CDN virtual hosts.
    options:
      blitzecdn_nginx_sites:
        type: list
        elements: dict
        required: true
        options:
          name: {type: str, required: true}
          server_names: {type: list, elements: str, required: true}
          origin_host: {type: str, required: true}
          ssl_mode: {type: str, choices: ['off', flexible, full, full_strict], required: true}
          ssl_automatic_mode: {type: str, choices: [auto, custom], default: auto}
          minimum_tls_version: {type: str, choices: ['1.2', '1.3'], default: '1.2'}
          http3_enabled:
            type: bool
            default: false
            description: Offer visitor HTTP/3 over QUIC on UDP/443.
          always_use_https:
            type: bool
            default: false
            description: Redirect visitor HTTP requests to HTTPS when TLS is active.
          under_attack_mode:
            type: bool
            default: false
            description: >-
              Require a signed BlitzeCDN browser clearance before cache or
              origin processing. Requires blitzecdn_nginx_under_attack_enabled.
          origin_request_host: {type: str}
          origin_sni: {type: str}
          enabled: {type: bool, default: true}
          certificate_mode: {type: str, choices: [disabled, existing, uploaded, requested], default: disabled}
          certificate_path: {type: path}
          certificate_key_path: {type: path}
          certificate_source_path: {type: path}
          certificate_key_source_path: {type: path}
          cache_enabled: {type: bool, default: true}
          cache_query_string_mode: {type: str, choices: [include, ignore], default: include}
          cache_valid_success: {type: str, default: 10m}
          cache_valid_not_found: {type: str, default: 1m}
          compression:
            type: str
            choices: ['off', gzip, brotli]
            default: brotli
            description: >-
              Encodings this edge produces itself. brotli offers Brotli to
              clients that accept it and gzip to the rest. The managed edge
              stack always supplies the Brotli filter. off stops the edge
              compressing; origin-encoded bodies pass through every mode.
          firewall:
            type: dict
            description: >-
              Per-hostname request filtering. Absent or empty means the site
              serves everyone, which is what every site did before schema
              version 2. Never applied to /.well-known/acme-challenge/, so a
              rule here cannot block certificate renewal.
            options:
              allow_sources:
                type: list
                elements: str
                default: []
                description: >-
                  CIDR networks exempted from deny_sources. Emitted before the
                  deny rules, and nginx takes the first match. Not a whitelist
                  on its own — without a deny entry covering everything else,
                  the site stays open.
              deny_sources:
                type: list
                elements: str
                default: []
                description: CIDR networks answered with 403.
              allowed_countries:
                type: list
                elements: str
                default: []
                description: >-
                  ISO 3166-1 alpha-2 codes; every other country gets a 403.
                  Requires blitzecdn_nginx_geoip_enabled.
              denied_countries:
                type: list
                elements: str
                default: []
                description: >-
                  ISO 3166-1 alpha-2 codes answered with 403. Requires
                  blitzecdn_nginx_geoip_enabled.
              denied_methods:
                type: list
                elements: str
                default: []
                description: HTTP methods answered with 405.
              denied_paths:
                type: list
                elements: str
                default: []
                description: URI prefixes answered with 403.
          visitor_headers:
            type: dict
            description: >-
              The BZ-* request headers this edge writes on the way to the
              origin. Every one of them is generated here and overwrites what
              the visitor sent under the same name; a header turned off is
              cleared rather than forwarded, so the BZ- namespace never
              carries client input. Absent means the defaults below.
            options:
              connecting_ip:
                type: bool
                default: true
                description: >-
                  Send BZ-Connecting-IP, the visitor address from $remote_addr
                  — the peer of the connection nginx accepted, IPv4 or IPv6.
                  Never derived from X-Forwarded-For or any other request
                  header.
              ip_country:
                type: bool
                default: false
                description: >-
                  Send BZ-IPCountry, the ISO 3166-1 alpha-2 code from
                  $blitzecdn_country. Requires blitzecdn_nginx_geoip_enabled;
                  a site asking for it without GeoIP fails validation rather
                  than omitting the header.
      blitzecdn_nginx_allow_empty_sites:
        type: bool
        required: true
      blitzecdn_nginx_cache_path: {type: path, required: true}
      blitzecdn_nginx_cache_zone: {type: str, required: true}
      blitzecdn_nginx_cache_size: {type: str, required: true}
      blitzecdn_nginx_cache_max_size: {type: str, required: true}
      blitzecdn_nginx_cache_inactive: {type: str, required: true}
      blitzecdn_nginx_proxy_connect_timeout: {type: str, required: true}
      blitzecdn_nginx_proxy_read_timeout: {type: str, required: true}
      blitzecdn_nginx_managed_sites_file: {type: path, required: true}
      blitzecdn_nginx_http_ports: {type: list, elements: int, required: true}
      blitzecdn_nginx_https_ports: {type: list, elements: int, required: true}
      blitzecdn_nginx_http3_enabled: {type: bool, required: true}
      blitzecdn_nginx_http3_listener_owner: {type: str, required: true}
      blitzecdn_nginx_image:
        type: str
        required: true
        description: >-
          The edge runtime image holding the ABI-matched official Nginx,
          GeoIP2, Brotli and njs stack. Must equal
          blitzecdn_edge_stack_image: this role validates configuration against
          it and that role serves from it.
      blitzecdn_nginx_image_default: {type: str, required: true}
      blitzecdn_nginx_container:
        type: str
        required: true
        description: The container this role signals to reload Nginx.
      blitzecdn_nginx_config_test_image:
        type: str
        required: true
        description: >-
          The image a configuration test runs under. Overridden by
          blitzecdn_edge_stack to validate the running configuration against a
          new image before the container serving traffic is replaced.
      blitzecdn_nginx_config_test_volumes:
        type: list
        elements: str
        required: true
        description: >-
          Compose-form mounts the configuration test container receives. The
          same set the running edge gets: a test that cannot see a certificate
          or the GeoIP database passes against a tree the real edge refuses.
      blitzecdn_nginx_acme_root: {type: path, required: true}
      blitzecdn_nginx_certificate_path_pattern: {type: str, required: true}
      blitzecdn_nginx_resolvers: {type: list, elements: str, required: true}
      blitzecdn_nginx_resolver_valid: {type: str, required: true}
      blitzecdn_nginx_resolver_timeout: {type: str, required: true}
      blitzecdn_nginx_under_attack_enabled:
        type: bool
        required: true
        description: Enable the njs challenge capability for the edge fleet.
      blitzecdn_nginx_under_attack_passage_seconds:
        type: int
        required: true
        description: Lifetime of a valid clearance cookie, in seconds.
      blitzecdn_nginx_under_attack_secret:
        type: str
        required: true
        no_log: true
        description: >-
          Environment-provisioned HMAC secret; at least 32 bytes and never
          stored in desired state or the fleet settings database.
      blitzecdn_nginx_under_attack_js_file: {type: path, required: true}
      blitzecdn_nginx_under_attack_conf_file: {type: path, required: true}
      blitzecdn_nginx_under_attack_empty_root: {type: path, required: true}
      blitzecdn_nginx_default_server: {type: bool, required: true}
      blitzecdn_nginx_default_site_file: {type: path, required: true}
      blitzecdn_nginx_normalize_accept_encoding: {type: bool, required: true}
      blitzecdn_nginx_gzip_comp_level: {type: int, required: true}
      blitzecdn_nginx_brotli_comp_level: {type: int, required: true}
      blitzecdn_nginx_compression_min_length: {type: int, required: true}
      blitzecdn_nginx_compression_types:
        type: list
        elements: str
        required: true
        description: >-
          MIME types compressed on the way out. text/html must not appear:
          both modules always compress it and gzip warns about the duplicate.
      blitzecdn_nginx_ssl_ciphers: {type: str, required: true}
      blitzecdn_nginx_ssl_stapling: {type: bool, required: true}
      blitzecdn_nginx_hsts_enabled: {type: bool, required: true}
      blitzecdn_nginx_hsts_max_age: {type: int, required: true}
      blitzecdn_nginx_geoip_enabled:
        type: bool
        required: true
        description: >-
          Define $blitzecdn_country from the managed GeoIP2 module and database,
          without which per-site country rules cannot be honoured.
      blitzecdn_nginx_geoip_database: {type: path, required: true}
      blitzecdn_nginx_geoip_reload: {type: str, required: true}
      blitzecdn_nginx_geoip_file: {type: path, required: true}
      blitzecdn_nginx_geoip_account_id:
        type: str
        required: true
        description: >-
          MaxMind account ID. Empty means the operator installs the database
          themselves and the role only checks it is present.
      blitzecdn_nginx_geoip_license_key:
        type: str
        required: true
        no_log: true
        description: >-
          MaxMind license key. A credential for the account, not a per-database
          token: supply it from the environment, never a committed file.
      blitzecdn_nginx_geoip_edition: {type: str, required: true}
      blitzecdn_nginx_geoip_update_enabled:
        type: bool
        required: true
        description: >-
          Schedule refreshes of the database. GeoLite2 is republished twice a
          week; without this the copy fetched at first converge ages
          indefinitely. Read by blitzecdn_edge_stack, which owns the updater
          container and the timer that runs it.
      blitzecdn_nginx_geoip_update_calendar: {type: str, required: true}
      blitzecdn_nginx_geoip_update_splay: {type: str, required: true}
      blitzecdn_nginx_access_log_enabled:
        type: bool
        required: true
        description: >-
          Write each request and its cache outcome to the persistent access log
          and the container stdout stream.
      blitzecdn_nginx_access_log_path: {type: path, required: true}
      blitzecdn_nginx_log_format_name:
        type: str
        required: true
        description: Name of the http-context log_format the managed sites use.
      blitzecdn_nginx_status_enabled:
        type: bool
        required: true
        description: Serve nginx stub_status on a loopback-bound port.
      blitzecdn_nginx_status_address: {type: str, required: true}
      blitzecdn_nginx_status_port: {type: int, required: true}
      blitzecdn_nginx_status_path: {type: str, required: true}
      blitzecdn_nginx_status_allow:
        type: list
        elements: str
        required: true
        description: >-
          Sources permitted to read the status endpoint. The second, redundant
          control alongside the loopback listen address.
      blitzecdn_nginx_status_file: {type: path, required: true}
