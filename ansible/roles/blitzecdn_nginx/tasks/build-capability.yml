---
# `nginx -V` writes its banner to stderr, so the container's combined output is
# what carries both the version and the configure line. One container start
# answers every question build-invariant.yml then asks of it.
- name: Read the edge runtime build
  community.docker.docker_container:
    name: blitzecdn-edge-build-probe
    image: "{{ blitzecdn_nginx_config_test_image }}"
    command: [nginx, -V]
    detach: false
    cleanup: true
    network_mode: none
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=8m", "/run:rw,noexec,nosuid,size=8m"]
    state: started
  register: blitzecdn_nginx_build_probe
  changed_when: false
  failed_when: false

- name: Describe the edge runtime build
  ansible.builtin.set_fact:
    blitzecdn_nginx_build_status: "{{ blitzecdn_nginx_build_probe.status | default(1) }}"
    blitzecdn_nginx_build_output: >-
      {{ blitzecdn_nginx_build_probe.container.Output | default('') }}

# Separated from the probe above so the invariant can be executed on its own.
# The assertions are the part that has to hold, and a test that can only reach
# them by starting a container is a test that does not run.
- name: Require a supported edge runtime build
  ansible.builtin.import_tasks: build-invariant.yml
