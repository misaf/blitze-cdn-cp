---
- name: Validate the desired state before changing anything
  ansible.builtin.import_tasks: validate.yml

- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: blitzecdn_nginx_apt
  until: blitzecdn_nginx_apt is success
  retries: 3
  delay: 5

- name: Install the GeoIP2 Nginx module
  ansible.builtin.apt:
    name: "{{ blitzecdn_nginx_geoip_package }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: blitzecdn_nginx_geoip_apt
  until: blitzecdn_nginx_geoip_apt is success
  retries: 3
  delay: 5
  when: blitzecdn_nginx_geoip_enabled
  notify: Validate and reload Nginx

# GeoLite2 is free but not anonymous: downloads are authenticated. With
# credentials the role fetches and schedules refreshes; without them it assumes
# the operator manages the file and only checks it is there.
- name: Manage the MaxMind GeoLite2 database
  when:
    - blitzecdn_nginx_geoip_enabled
    - blitzecdn_nginx_geoip_license_key | length > 0
  block:
    - name: Install the MaxMind database updater
      ansible.builtin.apt:
        name: "{{ blitzecdn_nginx_geoip_updater_package }}"
        state: present
        update_cache: true
        cache_valid_time: 3600
      register: blitzecdn_nginx_updater_apt
      until: blitzecdn_nginx_updater_apt is success
      retries: 3
      delay: 5

    # 0600 root: the license key authenticates to a MaxMind account, so it is
    # a credential rather than a database identifier.
    - name: Configure the MaxMind credentials
      ansible.builtin.template:
        src: maxmind.conf.j2
        dest: "{{ blitzecdn_nginx_geoip_config_file }}"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Create the GeoIP database directory
      ansible.builtin.file:
        path: "{{ blitzecdn_nginx_geoip_database | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Check whether the database has been downloaded
      ansible.builtin.stat:
        path: "{{ blitzecdn_nginx_geoip_database }}"
      register: blitzecdn_nginx_geoip_present

    # Only when absent. MaxMind publishes GeoLite2 twice a week and rate-limits
    # downloads, so fetching on every converge would spend a quota to re-fetch
    # a file that has not changed. Refreshes are the timer's job.
    - name: Download the GeoLite2 database
      ansible.builtin.command:
        argv: ["{{ blitzecdn_nginx_geoip_updater_binary }}"]
      register: blitzecdn_nginx_geoip_fetch
      changed_when: blitzecdn_nginx_geoip_fetch.rc == 0
      # Longer between attempts than the package tasks use. This one crosses
      # the public internet to a service that rate-limits, so a failure may
      # well be "not yet" rather than "not working", and retrying it hard
      # would be the wrong answer to the most likely cause.
      until: blitzecdn_nginx_geoip_fetch is success
      retries: 3
      delay: 15
      when:
        - not blitzecdn_nginx_geoip_present.stat.exists
        - not ansible_check_mode

    - name: Schedule database refreshes
      ansible.builtin.template:
        src: "geoipupdate.{{ item }}.j2"
        dest: "/etc/systemd/system/blitzecdn-geoipupdate.{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop: [service, timer]
      register: blitzecdn_nginx_geoip_units
      when: blitzecdn_nginx_geoip_update_enabled

    - name: Enable the refresh timer
      ansible.builtin.systemd_service:
        name: blitzecdn-geoipupdate.timer
        enabled: true
        state: started
        daemon_reload: "{{ blitzecdn_nginx_geoip_units is changed }}"
      when:
        - blitzecdn_nginx_geoip_update_enabled
        - not ansible_check_mode

    - name: Withdraw the refresh timer
      ansible.builtin.systemd_service:
        name: blitzecdn-geoipupdate.timer
        enabled: false
        state: stopped
      failed_when: false
      when:
        - not blitzecdn_nginx_geoip_update_enabled
        - not ansible_check_mode

# Without the file nginx fails to start — not merely to reload — so catching it
# here keeps the failure inside the deploy rather than at the next reboot.
- name: Inspect the GeoIP database
  ansible.builtin.stat:
    path: "{{ blitzecdn_nginx_geoip_database }}"
  register: blitzecdn_nginx_geoip_db
  when: blitzecdn_nginx_geoip_enabled

- name: Require the GeoIP database to be present
  ansible.builtin.assert:
    that:
      - blitzecdn_nginx_geoip_db.stat.exists or ansible_check_mode
    fail_msg: >-
      blitzecdn_nginx_geoip_enabled is true but there is no database at
      {{ blitzecdn_nginx_geoip_database }}.
      {% if blitzecdn_nginx_geoip_license_key | length > 0 %}
      The download ran and did not produce one — check the MaxMind account ID
      and license key, and that this edge can reach updates.maxmind.com.
      {% else %}
      Set blitzecdn_nginx_geoip_account_id and
      blitzecdn_nginx_geoip_license_key so this role can fetch GeoLite2, or
      install the database yourself and point the variable at it.
      {% endif %}
  when: blitzecdn_nginx_geoip_enabled

- name: Create cache directory
  ansible.builtin.file:
    path: "{{ blitzecdn_nginx_cache_path }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0750"

- name: Allow Nginx to traverse the ACME webroot parent
  ansible.builtin.file:
    path: "{{ blitzecdn_nginx_acme_root | dirname }}"
    state: directory
    mode: o+x

- name: Create ACME webroot directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ blitzecdn_nginx_acme_root }}"
      owner: root
      group: www-data
      mode: "0755"
    - path: "{{ blitzecdn_nginx_acme_root }}/.well-known"
      owner: root
      group: www-data
      mode: "0755"
    - path: "{{ blitzecdn_nginx_acme_root }}/.well-known/acme-challenge"
      owner: root
      group: www-data
      mode: "0750"
  loop_control:
    label: "{{ item.path }}"

- name: Create managed TLS directories
  ansible.builtin.file:
    path: "{{ item.certificate_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop: "{{ blitzecdn_nginx_sites }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.certificate_mode | default('disabled') in ['uploaded', 'requested']

- name: Install managed certificate chains
  ansible.builtin.copy:
    src: "{{ item.certificate_source_path }}"
    dest: "{{ item.certificate_path }}"
    owner: root
    group: root
    mode: "0644"
    backup: true
  loop: "{{ blitzecdn_nginx_sites }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.certificate_mode | default('disabled') in ['uploaded', 'requested']
  notify: Validate and reload Nginx

- name: Install managed private keys
  ansible.builtin.copy:
    src: "{{ item.certificate_key_source_path }}"
    dest: "{{ item.certificate_key_path }}"
    owner: root
    group: root
    mode: "0600"
    backup: true
  loop: "{{ blitzecdn_nginx_sites }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.certificate_mode | default('disabled') in ['uploaded', 'requested']
  no_log: true
  notify: Validate and reload Nginx

- name: Configure the shared cache
  ansible.builtin.template:
    src: cache.conf.j2
    dest: /etc/nginx/conf.d/blitzecdn-cache.conf
    owner: root
    group: root
    mode: "0644"
  notify: Validate and reload Nginx

# Defines $blitzecdn_country in the http context. Written before the sites that
# test it, and withdrawn only once no site needs it — the assertion above is
# what guarantees the two cannot be out of step in the dangerous direction.
- name: Configure the GeoIP country lookup
  ansible.builtin.template:
    src: geoip.conf.j2
    dest: "{{ blitzecdn_nginx_geoip_file }}"
    owner: root
    group: root
    mode: "0644"
  when: blitzecdn_nginx_geoip_enabled
  notify: Validate and reload Nginx

- name: Withdraw the GeoIP country lookup
  ansible.builtin.file:
    path: "{{ blitzecdn_nginx_geoip_file }}"
    state: absent
  when: not blitzecdn_nginx_geoip_enabled
  notify: Validate and reload Nginx

# Rendered outside the site block below because it is independent of any
# site: withdrawing it on a failed site render would take metrics away from an
# edge whose traffic configuration was never touched.
- name: Configure the status endpoint
  ansible.builtin.template:
    src: status.conf.j2
    dest: "{{ blitzecdn_nginx_status_file }}"
    owner: root
    group: root
    mode: "0644"
  when: blitzecdn_nginx_status_enabled
  notify: Validate and reload Nginx

- name: Withdraw the status endpoint
  ansible.builtin.file:
    path: "{{ blitzecdn_nginx_status_file }}"
    state: absent
  when: not blitzecdn_nginx_status_enabled
  notify: Validate and reload Nginx

- name: Inspect managed-site registry
  ansible.builtin.stat:
    path: "{{ blitzecdn_nginx_managed_sites_file }}"
  register: blitzecdn_nginx_registry

- name: Read managed-site registry
  ansible.builtin.slurp:
    path: "{{ blitzecdn_nginx_managed_sites_file }}"
  register: blitzecdn_nginx_registry_content
  when: blitzecdn_nginx_registry.stat.exists

- name: Calculate stale managed sites
  ansible.builtin.set_fact:
    blitzecdn_nginx_desired_names: "{{ blitzecdn_nginx_sites | map(attribute='name') | list }}"
    blitzecdn_nginx_stale_names: >-
      {{
        (
          (blitzecdn_nginx_registry_content.content | default('') | b64decode).splitlines()
          | reject('equalto', '')
          | list
        )
        | difference(blitzecdn_nginx_sites | map(attribute='name') | list)
      }}

- name: Refuse to erase the final managed sites without explicit approval
  ansible.builtin.assert:
    that:
      - >-
        blitzecdn_nginx_allow_empty_sites
        or blitzecdn_nginx_desired_names | length > 0
        or blitzecdn_nginx_stale_names | length == 0
    fail_msg: >-
      Desired state is empty but this edge has managed sites. Recreate them in
      the control plane, or explicitly set BLITZE_ALLOW_EMPTY_SITES=true to
      approve removing every managed site and its managed TLS material.

- name: Remove stale enabled links
  ansible.builtin.file:
    path: "/etc/nginx/sites-enabled/{{ item }}.conf"
    state: absent
  loop: "{{ blitzecdn_nginx_stale_names }}"
  notify: Validate and reload Nginx

- name: Remove stale configurations
  ansible.builtin.file:
    path: "/etc/nginx/sites-available/{{ item }}.conf"
    state: absent
  loop: "{{ blitzecdn_nginx_stale_names }}"
  notify: Validate and reload Nginx

# Only names shaped like a site name are allowed to select a directory for
# recursive removal as root. The registry is ours, but it is a plain file on a
# host an operator can edit, and a line containing '..' or '/' would otherwise
# aim this task anywhere on the filesystem.
- name: Select stale managed TLS directories
  ansible.builtin.set_fact:
    blitzecdn_nginx_stale_tls_names: >-
      {{ blitzecdn_nginx_stale_names | select('match', '^[a-z][a-z0-9-]{0,62}$') | list }}

# Runs after the configurations that reference them are gone, so no surviving
# vhost can point at a certificate this removes. Managed certificates always
# live at /etc/blitzecdn/tls/<site name>/ — the assertions above refuse to
# converge a site whose certificate_path is anywhere else — so a directory
# named for a site the controller no longer emits is ours and is dead. An
# unmanaged site's certificate is under /etc/ssl or /etc/letsencrypt and is
# never named for a site, so it cannot be selected here.
- name: Remove stale managed TLS material
  ansible.builtin.file:
    path: "/etc/blitzecdn/tls/{{ item }}"
    state: absent
  loop: "{{ blitzecdn_nginx_stale_tls_names }}"

# Everything that writes into the live config tree runs under one rescue.
#
# nginx keeps serving from the configuration it loaded at start, so a bad render
# is invisible until something reloads it — a reboot, a package upgrade, an
# unrelated deploy. Left in place, a config that fails `nginx -t` turns into an
# nginx that refuses to start, hours later, with nothing in the deploy log to
# connect it to. Validating here and putting the previous files back on failure
# means a bad render costs a failed run instead of an offline edge.
- name: Converge managed site configurations
  block:
    - name: Render managed sites
      ansible.builtin.template:
        src: site.conf.j2
        dest: "/etc/nginx/sites-available/{{ item.name }}.conf"
        owner: root
        group: root
        mode: "0644"
        backup: true
      loop: "{{ blitzecdn_nginx_sites }}"
      loop_control:
        label: "{{ item.name }}"
      register: blitzecdn_nginx_rendered
      notify: Validate and reload Nginx

    - name: Render the catch-all default site
      ansible.builtin.template:
        src: default.conf.j2
        dest: "{{ blitzecdn_nginx_default_site_file }}"
        owner: root
        group: root
        mode: "0644"
        backup: true
      register: blitzecdn_nginx_rendered_default
      when: blitzecdn_nginx_default_server
      notify: Validate and reload Nginx

    # `force: true` lets this pass in check mode, where the template above
    # reports changed without writing: the module skips the "src must exist"
    # gate and previews the link instead of failing on a file it could not
    # have created.
    - name: Enable the catch-all default site
      ansible.builtin.file:
        src: "{{ blitzecdn_nginx_default_site_file }}"
        dest: "/etc/nginx/sites-enabled/{{ blitzecdn_nginx_default_site_file | basename }}"
        state: link
        force: true
      when: blitzecdn_nginx_default_server
      notify: Validate and reload Nginx

    # Withdrawing the catch-all hands the default_server position back to
    # whichever managed site loads first, so the file goes too — leaving it
    # unlinked but present invites someone to re-link it by hand later.
    - name: Withdraw the catch-all default site
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "/etc/nginx/sites-enabled/{{ blitzecdn_nginx_default_site_file | basename }}"
        - "{{ blitzecdn_nginx_default_site_file }}"
      when: not blitzecdn_nginx_default_server
      notify: Validate and reload Nginx

    - name: Enable desired sites
      ansible.builtin.file:
        src: "/etc/nginx/sites-available/{{ item.name }}.conf"
        dest: "/etc/nginx/sites-enabled/{{ item.name }}.conf"
        state: link
        force: true
      loop: "{{ blitzecdn_nginx_sites }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.enabled | default(true)
      notify: Validate and reload Nginx

    - name: Disable explicitly disabled sites
      ansible.builtin.file:
        path: "/etc/nginx/sites-enabled/{{ item.name }}.conf"
        state: absent
      loop: "{{ blitzecdn_nginx_sites }}"
      loop_control:
        label: "{{ item.name }}"
      when: not item.enabled | default(true)
      notify: Validate and reload Nginx

    - name: Remove distribution default site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Validate and reload Nginx

    # The handler validates too, but only if something notified it and only
    # after every other role's tasks have run. This is the gate that decides
    # whether the tree we just wrote is allowed to survive the play.
    - name: Validate the assembled configuration
      ansible.builtin.command:
        argv: [nginx, -t]
      changed_when: false
      when: not ansible_check_mode

    # Written last, and only past validation: the registry drives stale-site
    # removal on the next run, so recording names for a configuration that was
    # rolled back would strand the real files as unmanaged.
    - name: Record managed site names
      ansible.builtin.copy:
        content: "{{ blitzecdn_nginx_desired_names | sort | join('\n') }}\n"
        dest: "{{ blitzecdn_nginx_managed_sites_file }}"
        owner: root
        group: root
        mode: "0644"

  rescue:
    - name: Restore sites that had a previous configuration
      ansible.builtin.copy:
        src: "{{ item.backup_file }}"
        dest: "{{ item.dest }}"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      loop: >-
        {{ (blitzecdn_nginx_rendered | default({}, true)).get('results', [])
           | selectattr('backup_file', 'defined') | list }}
      loop_control:
        label: "{{ item.dest }}"

    # A rendered file with no backup did not exist before this run, so there is
    # nothing to restore — it and its link have to go entirely.
    - name: Identify sites this run created
      ansible.builtin.set_fact:
        blitzecdn_nginx_created: >-
          {{ (blitzecdn_nginx_rendered | default({}, true)).get('results', [])
             | rejectattr('backup_file', 'defined')
             | selectattr('dest', 'defined')
             | map(attribute='dest') | list }}

    - name: Withdraw sites this run created
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: >-
        {{ blitzecdn_nginx_created
           | union(blitzecdn_nginx_created
                   | map('regex_replace', '/sites-available/', '/sites-enabled/')) }}

    - name: Restore the catch-all default site
      ansible.builtin.copy:
        src: "{{ blitzecdn_nginx_rendered_default.backup_file }}"
        dest: "{{ blitzecdn_nginx_rendered_default.dest }}"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      when: blitzecdn_nginx_rendered_default.backup_file is defined

    # Proves the rollback actually landed. If this fails the edge cannot reload
    # nginx and needs hands on it — far better to learn that now, inside a failed
    # deploy, than at the next reboot.
    - name: Confirm the restored configuration loads
      ansible.builtin.command:
        argv: [nginx, -t]
      changed_when: false
      when: not ansible_check_mode

    - name: Report the withdrawn configuration
      ansible.builtin.fail:
        msg: >-
          Nginx rejected the configuration rendered for {{ inventory_hostname }},
          so it was rolled back and nothing was reloaded. The edge is still
          serving its previous configuration. Re-run with -vv to see which site
          failed `nginx -t`.

# Skipped under --check for the same reason as `nginx -t`: on a host that does
# not have Nginx yet the package install was only simulated, so the unit does
# not exist and the module fails on a preview that should have succeeded.
- name: Enable and start Nginx
  ansible.builtin.systemd_service:
    name: nginx
    enabled: true
    state: started
  when: not ansible_check_mode
