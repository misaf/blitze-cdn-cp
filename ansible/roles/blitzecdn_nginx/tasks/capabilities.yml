---
- name: Verify the managed Nginx binary and HTTP/3 build
  ansible.builtin.import_tasks: build-capability.yml

# The image carries its own probe configuration, written and executed during
# the build so an ABI-mismatched image is never published. Running it again here
# is not redundant: it proves *this* host pulled the image it was told to, that
# the layers arrived intact, and that the engine can actually start a container
# from it — three things a registry digest cannot promise on its own.
#
# `--network none` and no mounts: this must not be able to touch the running
# edge, its ports, or a single byte of customer state.
- name: Validate the managed dynamic modules
  community.docker.docker_container:
    name: blitzecdn-edge-module-probe
    image: "{{ blitzecdn_nginx_config_test_image }}"
    command: [nginx, -t, -c, /usr/share/blitzecdn/module-probe.conf]
    detach: false
    cleanup: true
    network_mode: none
    read_only: true
    # nginx -t writes a pid file and may buffer to a temporary directory, and
    # the probe must not be the reason a read-only container fails.
    tmpfs: ["/tmp:rw,noexec,nosuid,size=8m", "/run:rw,noexec,nosuid,size=8m"]
    state: started
  register: blitzecdn_nginx_module_probe
  changed_when: false
  failed_when: blitzecdn_nginx_module_probe.status | default(1) != 0

- name: Fail for an incompatible managed Nginx module stack
  ansible.builtin.fail:
    msg: >-
      The edge runtime image {{ blitzecdn_nginx_config_test_image }} cannot load
      its GeoIP2, Brotli and njs modules, or does not provide their directives.
      It is not a usable BlitzeCDN edge image. No edge configuration was
      applied. The probe said:
      {{ blitzecdn_nginx_module_probe.container.Output | default('nothing') }}
  when: blitzecdn_nginx_module_probe.status | default(1) != 0
