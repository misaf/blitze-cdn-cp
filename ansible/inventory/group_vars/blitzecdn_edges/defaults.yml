---
# Shipped defaults for every edge. Do not edit them: store fleet values with
# `blitzecdn config set` so they are validated, audited, and backed up. The
# inventory plugin publishes database overrides at host precedence.
# Keys without a database override fall through to the values here.
#
# The ACME webroot, the cache and log directories, the public listener sets,
# the status endpoint and the container names are no longer set here. They are
# the blitzecdn_edge role's, in ansible/roles/blitzecdn_edge/defaults —
# one contract read by blitzecdn_nginx, blitzecdn_edge_stack and
# blitzecdn_firewall alike, rather than values composed here for roles that
# then reached into each other for the rest.

blitzecdn_base_timezone: Asia/Tehran

# The edge runtime image, and the one place the fleet's version of it is set.
#
# This is software policy, not desired state: the sites an edge serves come from
# the control-plane database, while which build of Nginx serves them is set here
# and rolled out on purpose.
#
#   blitzecdn config set blitzecdn_edge_image_tag 2.8.0
#   blitzecdn config set blitzecdn_edge_image_digest sha256:...
#   blitzecdn deploy --limit edge-01     # canary first
#
# Never `latest`. A floating tag makes "which build is this fleet running"
# unanswerable and makes rollback a guess. Set the digest as well and the tag
# becomes documentation: the pull, the configuration test and the running
# container are then all provably the same bytes.
blitzecdn_edge_image_registry: ghcr.io
blitzecdn_edge_image_repository: misaf/blitzecdn-edge
blitzecdn_edge_image_tag: "2.7.0"
blitzecdn_edge_image_digest: ""
# Composed here and consumed as blitzecdn_edge_runtime.image, so the role that
# validates a configuration against the image and the role that serves from it
# read one value.
blitzecdn_edge_image: >-
  {{ blitzecdn_edge_image_registry }}/{{ blitzecdn_edge_image_repository }}{{
    '@' ~ blitzecdn_edge_image_digest
    if blitzecdn_edge_image_digest
    else ':' ~ blitzecdn_edge_image_tag
  }}
blitzecdn_firewall_enabled: false
# blitzecdn_firewall_ssh_port and blitzecdn_firewall_ssh_sources are NOT set
# here any more. Both describe an edge, so both are recorded on the edge and
# published by the `blitzecdn` inventory plugin as host variables:
#
#   blitzecdn edge add edge-01 --host 192.0.2.10 --port 7845 \
#       --ssh-source 94.183.119.90/32
#
# The port is published from the same field as ansible_port, so the firewall
# can no longer close the port Ansible connects on — which is exactly what
# maintaining them as two separate settings in two files invited.
#
# Host variables outrank this file, so re-adding either key here would have no
# effect. Use `blitzecdn edge update` instead.
blitzecdn_nginx_sites: []

# Edges accept public keys only. The role refuses to disable passwords unless
# the connecting account already has a working key on the host, so this cannot
# strand an edge — but it will fail a deploy against a host reached by
# password. Install the operator key first.
blitzecdn_sshd_enabled: true
blitzecdn_sshd_permit_root_login: 'no'
# Empty means "the account this control plane connects as". Set an explicit
# list to close SSH to a named set of operators.
blitzecdn_sshd_allow_users: []

# Per-hostname country filtering (the `firewall` block's allowed_countries and
# denied_countries). Off by default; a site that asks for country rules while
# this is false fails the deploy rather than serving the traffic it was told to
# block.
#
# GeoLite2 is free but authenticated. Create a MaxMind account, generate a
# license key, and put both in the control plane's `.env`:
#
#   BLITZE_MAXMIND_ACCOUNT_ID=123456
#   BLITZE_MAXMIND_LICENSE_KEY=your-key
#
# The control plane forwards them into the Ansible environment, so they are
# read here rather than written here — this file is committed, `.env` is 0600
# and is not. blitzecdn_edge_stack owns the updater, so it owns the credential:
# it writes the key to the root-owned 0600 /etc/blitzecdn/geoipupdate.env file
# and supplies it only to the updater container, and every task that handles it
# sets no_log. Whether country filtering is on at all is the runtime
# contract's, because blitzecdn_nginx renders the lookup that reads the same
# database this role provisions.
blitzecdn_edge_geoip_enabled: false
blitzecdn_edge_stack_geoip_account_id: "{{ lookup('env', 'BLITZE_MAXMIND_ACCOUNT_ID') }}"
blitzecdn_edge_stack_geoip_license_key: "{{ lookup('env', 'BLITZE_MAXMIND_LICENSE_KEY') }}"
