---
repos:
  # Use the lockfile's Ruff for hooks, just recipes, and CI alike.
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check (locked)
        entry: uv run --frozen ruff check
        language: system
        types_or: [python, pyi]
        args: [--fix]
      - id: ruff-format
        name: Ruff format (locked)
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, pyi]
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        args: [--unsafe]
