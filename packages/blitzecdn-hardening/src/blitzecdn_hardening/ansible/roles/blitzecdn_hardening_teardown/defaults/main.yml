---
# The two files this capability's roles write, named here a second time.
#
# Copies rather than reads of blitzecdn_hardening_sshd's and blitzecdn_hardening_fail2ban's own
# defaults, and deliberately: this role runs in the decommission play, on a
# host that is no longer being converged and whose inventory entry is about to
# be deleted. Reading the converging roles' variables would make the removal
# depend on those roles still resolving — the same coupling core's
# blitzecdn_teardown carries its own copies to avoid. The pairs must agree, and
# this package's tests assert that they do.
blitzecdn_hardening_teardown_sshd_file: /etc/ssh/sshd_config.d/50-blitzecdn.conf
blitzecdn_hardening_teardown_fail2ban_file: /etc/fail2ban/jail.d/blitzecdn-sshd.local

# The units to settle after each file goes. Named rather than assumed because
# the SSH service is `ssh` on Debian and Ubuntu and `sshd` elsewhere, and
# blitzecdn_hardening_sshd already carries the same knob for the same reason.
blitzecdn_hardening_teardown_sshd_service: ssh
blitzecdn_hardening_teardown_fail2ban_service: fail2ban
