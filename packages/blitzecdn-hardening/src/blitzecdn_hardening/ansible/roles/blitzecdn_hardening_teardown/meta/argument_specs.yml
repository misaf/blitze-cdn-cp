---
argument_specs:
  main:
    short_description: Give a decommissioned host its own access policy back.
    description:
      - >-
        Removes the two files blitzecdn_sshd and blitzecdn_fail2ban wrote and
        settles both services, so the host returns to whatever SSH policy its
        distribution ships. Runs in the decommission play's capability slot,
        before blitzecdn_teardown, and only while this distribution is
        installed.
      - >-
        The removals go in the reverse of the order the host slot converged
        them — the jail before the policy — so there is no window in which
        Fail2Ban is gone while password authentication is back.
      - >-
        The host stops being public-key-only. That is correct for a machine
        leaving inventory and worth knowing before running a decommission
        against a live one: from here on, the distribution's own sshd_config
        is the whole of its access policy.
    options:
      blitzecdn_hardening_teardown_sshd_file:
        type: path
        required: true
        description: >-
          Must equal the drop-in blitzecdn_sshd writes on the same host.
      blitzecdn_hardening_teardown_fail2ban_file:
        type: path
        required: true
        description: >-
          Must equal the jail blitzecdn_fail2ban writes on the same host.
      blitzecdn_hardening_teardown_sshd_service:
        type: str
        required: true
        description: >-
          The SSH unit to reload once the policy is gone. Must equal
          blitzecdn_sshd_service on the same host.
      blitzecdn_hardening_teardown_fail2ban_service:
        type: str
        required: true
        description: The Fail2Ban unit to restart once the jail is gone.
