---
# Disabling password authentication is the one change in this collection that
# can permanently lock an operator out of an edge. Everything before the
# template task exists to prove, on the host itself, that key authentication
# will still work afterwards.
#
# The whole role is one guarded block rather than an early `meta: end_host`,
# because end_host ends the *play* for the host — it would skip every role
# scheduled after this one, and the run would still report success.
- name: Enforce SSH policy
  when: blitzecdn_hardening_sshd_enabled
  block:
    - name: Determine which accounts must hold a usable public key
      ansible.builtin.set_fact:
        blitzecdn_hardening_sshd_login_users: >-
          {{
            blitzecdn_hardening_sshd_allow_users
            if (blitzecdn_hardening_sshd_allow_users | length > 0)
            else ([
              ansible_user | default(
                (ansible_facts.env | default({}, true)).get('SUDO_USER', ''), true
              )
            ] | select | list)
          }}

    - name: Require at least one identifiable login account
      ansible.builtin.assert:
        that:
          - blitzecdn_hardening_sshd_login_users | length > 0
        fail_msg: >-
          Cannot determine which account will log in after passwords are disabled.
          Set blitzecdn_hardening_sshd_allow_users, or run with an explicit ansible_user.

    - name: Read the account database
      ansible.builtin.getent:
        database: passwd

    - name: Require every login account to exist
      ansible.builtin.assert:
        that:
          - item in ansible_facts.getent_passwd
        fail_msg: >-
          No account {{ item }} on this host. Create it before hardening SSH, or
          correct blitzecdn_hardening_sshd_allow_users.
      loop: "{{ blitzecdn_hardening_sshd_login_users }}"

    - name: Inspect authorized_keys for every login account
      ansible.builtin.stat:
        path: "{{ ansible_facts.getent_passwd[item][4] }}/.ssh/authorized_keys"
      loop: "{{ blitzecdn_hardening_sshd_login_users }}"
      register: blitzecdn_hardening_sshd_authorized_keys

    # A missing or empty authorized_keys means the account can only reach this host
    # with a password. Writing the drop-in anyway would lock it out on the next
    # connection, and the reload that does it would report success.
    - name: Refuse to disable passwords without a working key
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.size > 0
        fail_msg: >-
          {{ item.item }} has no authorized_keys at
          {{ ansible_facts.getent_passwd[item.item][4] }}/.ssh/authorized_keys.
          Install the operator public key first; disabling password authentication
          now would lock this account out of {{ inventory_hostname }}.
      loop: "{{ blitzecdn_hardening_sshd_authorized_keys.results }}"
      loop_control:
        label: "{{ item.item }}"

    # A non-empty authorized_keys is necessary but not sufficient. Under
    # StrictModes — on by default — sshd silently ignores the file if the home
    # directory, ~/.ssh, or the file itself is writable by anyone but the owner,
    # or is owned by neither the account nor root. That host authenticates by
    # password today and by nothing at all once this role runs, so the existence
    # check above would pass while still stranding the account.
    - name: Inspect every path sshd validates under StrictModes
      ansible.builtin.stat:
        path: "{{ ansible_facts.getent_passwd[item.0][4] }}{{ item.1 }}"
      loop: "{{ blitzecdn_hardening_sshd_login_users | product(['', '/.ssh', '/.ssh/authorized_keys']) | list }}"
      loop_control:
        label: "{{ item.0 }}{{ item.1 }}"
      register: blitzecdn_hardening_sshd_strictmodes

    - name: Require key paths to satisfy StrictModes
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.pw_name in [item.item.0, 'root']
          - not item.stat.wgrp
          - not item.stat.woth
        fail_msg: >-
          {{ ansible_facts.getent_passwd[item.item.0][4] }}{{ item.item.1 }} is owned by
          {{ item.stat.pw_name | default('nobody') }} with mode
          {{ item.stat.mode | default('missing') }}. sshd applies StrictModes and
          will ignore {{ item.item.0 }}'s authorized_keys until this path is owned
          by {{ item.item.0 }} or root and is not group- or world-writable.
          Disabling password authentication now would lock this account out of
          {{ inventory_hostname }}.
      loop: "{{ blitzecdn_hardening_sshd_strictmodes.results }}"
      loop_control:
        label: "{{ item.item.0 }}{{ item.item.1 }}"

    - name: Enforce public-key-only authentication
      ansible.builtin.template:
        src: sshd.conf.j2
        dest: "{{ blitzecdn_hardening_sshd_config_path }}"
        owner: root
        group: root
        mode: "0600"
        backup: true
        validate: /usr/sbin/sshd -t -f %s
      notify: Validate and reload SSH

    # Proves the policy is live rather than merely written: sshd -T reports the
    # configuration the daemon will actually apply, drop-ins and Match blocks and
    # all. It is also what catches a host whose /etc/ssh/sshd_config has lost its
    # `Include /etc/ssh/sshd_config.d/*.conf` line, where the file above would be
    # written, reported changed, and ignored.
    - name: Flush SSH changes before verifying them
      ansible.builtin.meta: flush_handlers

    - name: Read back the effective SSH policy
      ansible.builtin.command:
        argv:
          - /usr/sbin/sshd
          - -T
          - -C
          - "user={{ blitzecdn_hardening_sshd_login_users[0] }},host=localhost,addr=127.0.0.1"
      changed_when: false
      check_mode: false
      register: blitzecdn_hardening_sshd_verified
      when: not ansible_check_mode

    # Only meaningful once the drop-in is actually on disk. Under --check it was
    # merely simulated, so sshd -T would report the pre-change policy and fail a
    # preview that is doing nothing wrong. A real run still asserts this.
    - name: Require the effective policy to be public-key only
      when: not ansible_check_mode
      vars:
        blitzecdn_hardening_sshd_effective: "{{ blitzecdn_hardening_sshd_verified.stdout | lower }}"
      ansible.builtin.assert:
        that:
          - "'pubkeyauthentication yes' in blitzecdn_hardening_sshd_effective"
          - "'authenticationmethods publickey' in blitzecdn_hardening_sshd_effective"
          - "'passwordauthentication no' in blitzecdn_hardening_sshd_effective"
          - "'kbdinteractiveauthentication no' in blitzecdn_hardening_sshd_effective"
          - "'permitemptypasswords no' in blitzecdn_hardening_sshd_effective"
          - "'hostbasedauthentication no' in blitzecdn_hardening_sshd_effective"
          - "'strictmodes yes' in blitzecdn_hardening_sshd_effective"
        fail_msg: >-
          {{ inventory_hostname }} still accepts something other than public keys
          for {{ blitzecdn_hardening_sshd_login_users[0] }}. Either
          {{ blitzecdn_hardening_sshd_config_path }} is not being read — check that
          /etc/ssh/sshd_config still includes /etc/ssh/sshd_config.d/*.conf — or a
          Match block later in the configuration overrides it.

    - name: Enable and start SSH
      ansible.builtin.systemd_service:
        name: "{{ blitzecdn_hardening_sshd_service }}"
        enabled: true
        state: started
