---
- name: Probe site origins from the BlitzeCDN edges
  hosts: blitzecdn_edges
  become: false
  gather_facts: false
  # Read-only, and one silent edge must not hide the rest of the fleet's
  # answers — a partial answer is the useful one here. Same policy as the
  # statistics play, and for the same reason.
  max_fail_percentage: 100
  serial: "100%"
  roles:
    - role: blitzecdn_origins
      tags: [origins]
