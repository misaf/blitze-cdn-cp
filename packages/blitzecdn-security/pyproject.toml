[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "blitzecdn-security"
version = "3.0.0"
description = "Site-level security capability for BlitzeCDN"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = ["blitzecdn>=3.0.0,<4"]

[project.entry-points."blitzecdn.plugins"]
security = "blitzecdn_security.plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/blitzecdn_security"]

[tool.uv.sources]
blitzecdn = { workspace = true }
