---
argument_specs:
  main:
    short_description: Provision the edge's Layer-7 browser challenge.
    description:
      - >-
        The `security` capability's edge implementation, shipped inside the
        blitzecdn-security wheel: the njs module that serves and verifies the
        Under Attack Mode challenge, the fleet secret it signs clearances with,
        and the conf.d snippet that imports it.
      - >-
        Run from the edge play's capability slot, which the control plane fills
        from the installed plugins. Detaching the distribution removes this role
        from Ansible's search path and from the play, with no line of the
        control plane edited.
      - >-
        Package-owned Nginx fragments render the per-site rules and challenge
        locations into the stable server skeleton.
    options:
      blitzecdn_edge_runtime:
        type: dict
        required: true
        description: >-
          The shared edge runtime contract, owned and validated by the
          blitzecdn_edge role. This role reads the njs module directory, the
          empty document root and the nginx configuration tree.
      blitzecdn_nginx_sites: {type: list, elements: dict, required: true}
      blitzecdn_security_under_attack_enabled:
        type: bool
        required: true
        description: Enable the njs challenge capability for the edge fleet.
      blitzecdn_security_under_attack_passage_seconds:
        type: int
        required: true
        description: Lifetime of a valid clearance cookie, in seconds.
      blitzecdn_security_under_attack_secret:
        type: str
        required: true
        no_log: true
        description: >-
          Environment-provisioned HMAC secret; at least 32 bytes and never
          stored in desired state or the fleet settings database.
      blitzecdn_security_under_attack_js_file: {type: path, required: true}
