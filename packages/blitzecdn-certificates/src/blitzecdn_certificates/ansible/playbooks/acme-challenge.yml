---
- name: Synchronize an ACME HTTP-01 challenge
  hosts: blitzecdn_edges
  become: true
  gather_facts: false
  any_errors_fatal: true
  max_fail_percentage: 0
  serial: "100%"
  # The webroot this writes into is blitzecdn_edge_runtime.paths.acme — the
  # same value blitzecdn_nginx serves challenges from. If the writer and the
  # server ever disagreed, HTTP-01 validation would fail with no useful error,
  # so they read one value and the role's argument spec proves it is set.
  roles:
    - role: blitzecdn_edge
  pre_tasks:
    # Kept separate and silent: the token and validation value are secrets, and
    # a failing assert echoes every value it was given.
    - name: Validate ACME challenge inputs
      ansible.builtin.assert:
        that:
          - blitzecdn_acme_action in ['present', 'absent']
          - blitzecdn_acme_domain is match('^[A-Za-z0-9.-]{1,253}$')
          - blitzecdn_acme_token is match('^[A-Za-z0-9_-]{1,512}$')
          - >-
            blitzecdn_acme_action == 'absent' or
            blitzecdn_acme_validation is match('^[A-Za-z0-9_.-]{1,2048}$')
      no_log: true
  tasks:
    # Exactly what blitzecdn_nginx creates, down to the mode. The worker reads
    # this from inside the container as the image's uid, so it owns it; and if
    # these two writers disagreed by a bit, each converge would set it back and
    # no edge would ever report itself settled.
    - name: Create ACME challenge directory
      ansible.builtin.file:
        path: "{{ blitzecdn_edge_runtime.paths.acme }}/.well-known/acme-challenge"
        state: directory
        owner: "{{ blitzecdn_edge_runtime.worker_uid }}"
        group: root
        mode: "0500"
      when: blitzecdn_acme_action == 'present'

    - name: Publish ACME challenge
      ansible.builtin.copy:
        content: "{{ blitzecdn_acme_validation }}"
        dest: >-
          {{ blitzecdn_edge_runtime.paths.acme }}/.well-known/acme-challenge/{{
            blitzecdn_acme_token }}
        owner: "{{ blitzecdn_edge_runtime.worker_uid }}"
        group: root
        mode: "0400"
      when: blitzecdn_acme_action == 'present'
      no_log: true

    - name: Remove ACME challenge
      ansible.builtin.file:
        path: >-
          {{ blitzecdn_edge_runtime.paths.acme }}/.well-known/acme-challenge/{{
            blitzecdn_acme_token }}
        state: absent
      when: blitzecdn_acme_action == 'absent'
