[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "blitzecdn-certificates"
version = "3.0.0"
description = "Certificate management and Automatic SSL capability for BlitzeCDN"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = ["blitzecdn>=3.0.0,<4"]

[project.entry-points."blitzecdn.plugins"]
certificates = "blitzecdn_certificates.plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/blitzecdn_certificates"]

[tool.uv.sources]
blitzecdn = { workspace = true }
