[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "blitzecdn-resolver"
version = "3.0.0"
description = "Edge host DNS resolution capability for BlitzeCDN"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = ["blitzecdn>=3.0.0,<4"]

[project.entry-points."blitzecdn.plugins"]
resolver = "blitzecdn_resolver.plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/blitzecdn_resolver"]

[tool.uv.sources]
blitzecdn = { workspace = true }
