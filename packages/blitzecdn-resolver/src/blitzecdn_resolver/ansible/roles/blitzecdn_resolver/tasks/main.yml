---
# Replacing a host's resolver is one of the few changes here that can make a
# working edge look broken in ways unrelated to the CDN: package installs,
# origin name lookups and certificate issuance all go through it. So the role
# refuses ambiguous input, and proves the result on the host rather than
# trusting that writing the file was enough.
#
# A drop-in is used rather than editing netplan or NetworkManager. Those files
# are written by the installer or cloud-init, differ per image and per
# renderer, and also carry the addresses and routes — a bad edit there costs
# the host, not just its DNS. A drop-in only ever adds resolution config, and
# blitzecdn_resolver_teardown — this package's other role, in the decommission
# play's capability slot — removes it again.
- name: Manage host resolution
  when: blitzecdn_resolver_enabled
  block:
    # Fails closed, like an empty firewall source list: an enabled role with
    # nothing to point at would write a drop-in claiming every domain and
    # naming no server, which resolves nothing at all.
    - name: Require at least one resolver address
      ansible.builtin.assert:
        that:
          - blitzecdn_resolver_addresses | length > 0
        fail_msg: >-
          blitzecdn_resolver_enabled is true but blitzecdn_resolver_addresses
          is empty. Set the resolvers this host should use, or disable the
          role; it will not claim every domain and then answer none of them.

    # A dotted quad or anything containing a colon. Deliberately not a full
    # address parser -- ansible.utils is not a pinned dependency of this
    # collection, and the job here is to catch a hostname, which this does.
    - name: Require resolver entries to be addresses
      ansible.builtin.assert:
        that:
          - item is match('^[0-9]{1,3}(\\.[0-9]{1,3}){3}$') or ':' in item
        fail_msg: >-
          '{{ item }}' is not an IP address. A hostname here would have to be
          resolved by the resolver it is replacing.
      loop: >-
        {{ blitzecdn_resolver_addresses + blitzecdn_resolver_fallback_addresses }}

    - name: Require systemd-resolved to be the resolver in use
      ansible.builtin.stat:
        path: /run/systemd/resolve/stub-resolv.conf
      register: blitzecdn_resolver_stub

    - name: Fail when the host does not resolve through systemd-resolved
      ansible.builtin.assert:
        that:
          - blitzecdn_resolver_stub.stat.exists
        fail_msg: >-
          systemd-resolved is not running on this host, so a drop-in would be
          written and ignored. Configure DNS where this image actually reads
          it, or disable blitzecdn_resolver.

    - name: Create the resolved drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/resolved.conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configure resolution
      ansible.builtin.template:
        src: resolved.conf.j2
        dest: /etc/systemd/resolved.conf.d/blitzecdn.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart systemd-resolved

    - name: Apply resolution changes before verifying them
      ansible.builtin.meta: flush_handlers

    # Everything above only proves a file was written. This proves the running
    # resolver answers, and answers honestly: '.invalid' is reserved by
    # RFC 2606 and can never be delegated, so anything that returns an address
    # for a random name under it is inventing answers -- exactly the failure
    # this role exists to remove.
    - name: Probe the resolver for invented answers
      ansible.builtin.command:
        argv:
          - resolvectl
          - query
          - --type=A
          - blitzecdn-probe-{{ 99999999 | random }}.invalid
      register: blitzecdn_resolver_probe
      changed_when: false
      failed_when: false
      when: not ansible_check_mode

    - name: Require the resolver to reject names that cannot exist
      ansible.builtin.assert:
        that:
          - blitzecdn_resolver_probe.rc != 0
        fail_msg: >-
          The resolver answered a reserved .invalid name, so it invents
          addresses rather than resolving them. Every name-based check on this
          host compares against fiction. Output: {{
          blitzecdn_resolver_probe.stdout | default('') | trim }}
      when: not ansible_check_mode
