---
extends: default
ignore: |
  .state/
  .venv/
  api/.venv/
  ansible/.venv/
  ansible/.ansible/
  ansible/.cache/
rules:
  braces:
    max-spaces-inside: 1
  comments:
    min-spaces-from-content: 1
  comments-indentation: false
  line-length:
    max: 120
  octal-values:
    forbid-explicit-octal: true
    forbid-implicit-octal: true
  truthy:
    allowed-values: ["true", "false"]
