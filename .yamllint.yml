---
extends: default
ignore: |
  .state/
  .venv/
  ansible/.venv/
  ansible/.ansible/
  ansible/.cache/
  # Operator state written by `blitzecdn setup` and `blitzecdn edge add`, not
  # source. It is gitignored, so CI never sees it, but every installed
  # controller has one and `yamllint .` would fail there on formatting no
  # human chose. Lint ansible/inventory/hosts.example.yml instead.
  ansible/inventory/hosts.yml
rules:
  braces:
    max-spaces-inside: 1
  comments:
    min-spaces-from-content: 1
  comments-indentation: false
  line-length:
    max: 120
  octal-values:
    forbid-explicit-octal: true
    forbid-implicit-octal: true
  truthy:
    allowed-values: ["true", "false"]
