[blitzecdn]
state_dir = ".state"
ansible_dir = "ansible"
inventory_path = "ansible/inventory/blitzecdn.yml"
playbook_path = "ansible/playbooks/edge.yml"
generated_vars_path = ".state/desired-state.yml"
deployment_lock_path = ".state/deployment.lock"
certificate_dir = ".state/certificates"
acme_challenge_playbook_path = "ansible/playbooks/acme-challenge.yml"
ansible_playbook = "ansible-playbook"
certbot = "certbot"
acme_default_email = "admin@example.com"
deployment_timeout_seconds = 900
# How much of a run log to quote back when a run fails. The log itself is
# never truncated.
output_limit_bytes = 1048576
# How many per-run Ansible logs to keep under .state/logs. One is written per
# invocation — every deploy, every scheduled drift check, every purge — so
# something has to bound them. The structured result a deployment reasons from
# lives in the database and is not affected.
run_log_retention = 500
# Refuse to remove the final managed sites unless explicitly changed to true.
allow_empty_sites = false
# Resolvers for certificate preflight, as IP addresses. Unset uses the host
# resolver, which is the wrong view wherever this host resolves differently from
# the public internet (split-horizon zone, internal forwarder, transparent proxy).
# preflight_dns_servers = ["1.1.1.1", "1.0.0.1"]
