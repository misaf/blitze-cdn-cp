# The challenge playbook targets `blitzecdn_edges`, because in production the
# fleet comes from the control plane's inventory plugin. This host is the whole
# fleet here, and naming the group is what lets the harness run the shipped
# playbook rather than a copy of it — a copy would pass while the real one
# wrote the file somewhere Nginx cannot read.
[blitzecdn_edges]
localhost ansible_connection=local
