---
- name: Provision a clean BlitzeCDN HTTP/3 edge
  hosts: localhost
  connection: local
  become: true
  gather_facts: true
  vars:
    # Built from docker/edge/ by the integration script and loaded into this
    # host's engine, so the test proves the image this repository produces
    # rather than whatever the registry currently publishes.
    blitzecdn_edge_image: blitzecdn-edge:integration
    blitzecdn_edge_stack_image_pull: false
    # The runner has no MaxMind credentials, and the test installs a MaxMind
    # sample database by hand. Without this the role would try to fetch one.
    blitzecdn_nginx_geoip_account_id: ''
    blitzecdn_nginx_geoip_license_key: ''
    blitzecdn_firewall_enabled: true
    blitzecdn_firewall_ssh_sources: [172.16.0.0/12]
    blitzecdn_firewall_http3_enabled: true
    blitzecdn_nginx_allow_empty_sites: false
    blitzecdn_nginx_http3_enabled: true
    blitzecdn_nginx_http3_listener_owner: site-one-test
    blitzecdn_nginx_geoip_enabled: true
    blitzecdn_nginx_geoip_update_enabled: false
    blitzecdn_nginx_geoip_database: /usr/share/GeoIP/GeoIP2-Country-Test.mmdb
    blitzecdn_nginx_under_attack_enabled: true
    blitzecdn_nginx_under_attack_secret: >-
      {{ lookup('file', '/run/blitzecdn-under-attack-secret') }}
    blitzecdn_nginx_resolvers: []
    blitzecdn_nginx_sites:
      - name: site-one-test
        server_names: [site-one.test]
        origin_host: blitzecdn-http3-origin
        origin_request_host: site-one.test
        origin_sni: site-one.test
        ssl_mode: flexible
        ssl_automatic_mode: auto
        minimum_tls_version: '1.2'
        http3_enabled: true
        always_use_https: false
        enabled: true
        certificate_mode: existing
        certificate_path: /etc/ssl/certs/blitzecdn-http3-test.pem
        certificate_key_path: /etc/ssl/private/blitzecdn-http3-test.key
        cache_enabled: false
        cache_query_string_mode: include
        cache_valid_success: 10m
        cache_valid_not_found: 1m
        compression: brotli
        firewall:
          allow_sources: []
          deny_sources: []
          allowed_countries: []
          denied_countries: []
          denied_methods: []
          denied_paths: []
        visitor_headers:
          connecting_ip: true
          ip_country: true
      - name: site-two-test
        server_names: [site-two.test]
        origin_host: blitzecdn-http3-origin
        origin_request_host: site-two.test
        origin_sni: site-two.test
        ssl_mode: flexible
        ssl_automatic_mode: auto
        minimum_tls_version: '1.2'
        http3_enabled: true
        always_use_https: false
        under_attack_mode: true
        enabled: true
        certificate_mode: existing
        certificate_path: /etc/ssl/certs/blitzecdn-http3-test.pem
        certificate_key_path: /etc/ssl/private/blitzecdn-http3-test.key
        cache_enabled: false
        cache_query_string_mode: include
        cache_valid_success: 10m
        cache_valid_not_found: 1m
        compression: brotli
        firewall:
          allow_sources: []
          deny_sources: []
          allowed_countries: []
          denied_countries: []
          denied_methods: []
          denied_paths: []
        visitor_headers:
          connecting_ip: true
          ip_country: true
  pre_tasks:
    - name: Install and verify the host container engine
      ansible.builtin.import_role:
        name: blitzecdn_docker
    - name: Prepare the persistent edge state and runtime image
      ansible.builtin.import_role:
        name: blitzecdn_edge_stack
        tasks_from: prepare.yml
    - name: Verify the edge runtime image before opening firewall ports
      ansible.builtin.import_role:
        name: blitzecdn_nginx
        tasks_from: verify-runtime.yml
      vars:
        blitzecdn_nginx_config_test_image: >-
          {{ blitzecdn_edge_stack_resolved_image | default(blitzecdn_nginx_image) }}
  roles:
    - role: blitzecdn_firewall
    - role: blitzecdn_nginx
    - role: blitzecdn_edge_stack
