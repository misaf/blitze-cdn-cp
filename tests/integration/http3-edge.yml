---
- name: Provision a clean BlitzeCDN HTTP/3 edge
  hosts: localhost
  connection: local
  become: true
  gather_facts: true
  vars:
    # Built from src/blitzecdn/docker/edge/ by the integration script and loaded into this
    # host's engine, so the test proves the image this repository produces
    # rather than whatever the registry currently publishes.
    blitzecdn_edge_image: blitzecdn-edge:integration
    blitzecdn_edge_stack_image_pull: false
    # The runner has no MaxMind credentials, and the test installs a MaxMind
    # sample database by hand. Without this the role would try to fetch one.
    blitzecdn_geoip_account_id: ''
    blitzecdn_geoip_license_key: ''
    blitzecdn_firewall_enabled: true
    blitzecdn_firewall_ssh_sources: [172.16.0.0/12]
    blitzecdn_nginx_allow_empty_sites: false
    # One switch for the QUIC listener, the UDP/443 firewall rule and the
    # deploy's own listener check. The play used to set it three times.
    blitzecdn_edge_http3_enabled: true
    blitzecdn_nginx_http3_listener_owner: site-one-test
    # Two optional capabilities, converged from the roles their own wheels
    # ship. This play names them the way the control plane does — a list core's
    # capability slot loops over — rather than importing them, so the ordering
    # and the variable are the ones a real deploy uses.
    blitzecdn_capability_roles:
      - blitzecdn_cache_config
      - blitzecdn_compression
      - blitzecdn_geoip
      - blitzecdn_http3
      - blitzecdn_security
    # And the dynamic modules those capabilities load, stated the same way the
    # control plane composes them. Without this the rendered module list is
    # empty and every contributed `brotli`, `geoip2` or `js_import` directive
    # in the tree below is an unknown directive.
    blitzecdn_nginx_modules:
      - plugin: compression
        name: brotli
        objects: [ngx_http_brotli_filter_module.so]
      - plugin: geoip
        name: geoip2
        objects: [ngx_http_geoip2_module.so]
      - plugin: security
        name: njs
        objects: [ngx_http_js_module.so]
    # A direct Ansible harness has no Python composition root, so state the
    # resources that installed plugins would normally resolve automatically.
    blitzecdn_nginx_resources:
      http:
        - plugin: cache
          name: cache-http.conf.j2
          template: /workspace/packages/blitzecdn-cache/src/blitzecdn_cache/nginx/cache-http.conf.j2
        - plugin: geoip
          name: geoip-http.conf.j2
          template: /workspace/packages/blitzecdn-geoip/src/blitzecdn_geoip/nginx/geoip-http.conf.j2
        - plugin: security
          name: security-http.conf.j2
          template: /workspace/packages/blitzecdn-security/src/blitzecdn_security/nginx/security-http.conf.j2
      server:
        - plugin: compression
          name: compression-server.conf.j2
          template: /workspace/packages/blitzecdn-compression/src/blitzecdn_compression/nginx/compression-server.conf.j2
        - plugin: http3
          name: http3-server.conf.j2
          template: /workspace/packages/blitzecdn-http3/src/blitzecdn_http3/nginx/http3-server.conf.j2
        - plugin: security
          name: security-server.conf.j2
          template: /workspace/packages/blitzecdn-security/src/blitzecdn_security/nginx/security-server.conf.j2
      access:
        - plugin: security
          name: security-access.conf.j2
          template: /workspace/packages/blitzecdn-security/src/blitzecdn_security/nginx/security-access.conf.j2
      upstream:
        - plugin: cache
          name: cache-upstream.conf.j2
          template: /workspace/packages/blitzecdn-cache/src/blitzecdn_cache/nginx/cache-upstream.conf.j2
        - plugin: geoip
          name: geoip-upstream.conf.j2
          template: /workspace/packages/blitzecdn-geoip/src/blitzecdn_geoip/nginx/geoip-upstream.conf.j2
        - plugin: http3
          name: http3-upstream.conf.j2
          template: /workspace/packages/blitzecdn-http3/src/blitzecdn_http3/nginx/http3-upstream.conf.j2
        - plugin: security
          name: security-upstream.conf.j2
          template: /workspace/packages/blitzecdn-security/src/blitzecdn_security/nginx/security-upstream.conf.j2
    blitzecdn_geoip_enabled: true
    blitzecdn_geoip_update_enabled: false
    blitzecdn_geoip_edition: GeoIP2-Country-Test
    blitzecdn_security_under_attack_enabled: true
    blitzecdn_security_under_attack_secret: >-
      {{ lookup('file', '/run/blitzecdn-under-attack-secret') }}
    # The config-test container has no network, so keep origin lookup deferred
    # until request time. The running edge shares this host's network namespace,
    # where Docker's embedded DNS resolves the sibling origin container.
    blitzecdn_nginx_resolvers: [127.0.0.11]
    blitzecdn_nginx_sites:
      - name: site-one-test
        server_names: [site-one.test]
        origin_host: blitzecdn-http3-origin
        origin_request_host: site-one.test
        origin_sni: site-one.test
        ssl_mode: flexible
        ssl_automatic_mode: auto
        minimum_tls_version: '1.2'
        http3_enabled: true
        always_use_https: false
        enabled: true
        certificate_mode: existing
        certificate_path: /etc/ssl/certs/blitzecdn-http3-test.pem
        certificate_key_path: /etc/ssl/private/blitzecdn-http3-test.key
        cache_enabled: false
        cache_query_string_mode: include
        cache_valid_success: 10m
        cache_valid_not_found: 1m
        compression: brotli
        firewall:
          allow_sources: []
          deny_sources: []
          allowed_countries: []
          denied_countries: []
          denied_methods: []
          denied_paths: []
        visitor_headers:
          connecting_ip: true
          ip_country: true
      - name: site-two-test
        server_names: [site-two.test]
        origin_host: blitzecdn-http3-origin
        origin_request_host: site-two.test
        origin_sni: site-two.test
        ssl_mode: flexible
        ssl_automatic_mode: auto
        minimum_tls_version: '1.2'
        http3_enabled: true
        always_use_https: false
        under_attack_mode: true
        enabled: true
        certificate_mode: existing
        certificate_path: /etc/ssl/certs/blitzecdn-http3-test.pem
        certificate_key_path: /etc/ssl/private/blitzecdn-http3-test.key
        cache_enabled: false
        cache_query_string_mode: include
        cache_valid_success: 10m
        cache_valid_not_found: 1m
        compression: brotli
        firewall:
          allow_sources: []
          deny_sources: []
          allowed_countries: []
          denied_countries: []
          denied_methods: []
          denied_paths: []
        visitor_headers:
          connecting_ip: true
          ip_country: true
  pre_tasks:
    - name: Establish the shared edge runtime contract
      ansible.builtin.import_role:
        name: blitzecdn_edge
    - name: Install and verify the host container engine
      ansible.builtin.import_role:
        name: blitzecdn_docker
    - name: Prepare the persistent edge state and runtime image
      ansible.builtin.import_role:
        name: blitzecdn_edge_stack
        tasks_from: prepare.yml
    - name: Verify the edge runtime image before opening firewall ports
      ansible.builtin.import_role:
        name: blitzecdn_nginx
        tasks_from: verify-runtime.yml
      vars:
        blitzecdn_nginx_config_test_image: >-
          {{ blitzecdn_edge_stack_resolved_image
             | default(blitzecdn_edge_runtime.image) }}
  roles:
    # Exactly the order ansible/playbooks/edge.yml uses: the installed
    # capabilities converge what the configuration will depend on, then the
    # firewall opens the ports, then blitzecdn_nginx renders and proves the
    # whole tree loads, then the stack starts the container.
    - role: blitzecdn_capabilities
    - role: blitzecdn_firewall
    - role: blitzecdn_nginx
    - role: blitzecdn_edge_stack
