[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "blitzecdn"
version = "6.1.0"
description = "Secure control plane and Ansible automation for BlitzeCDN edge servers"
# Deliberate floor: the control plane runs from its image, and uv fetches the
# interpreter for development. See "Local development" in README.md.
requires-python = ">=3.15.2"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "cryptography>=45,<51",
  # CAA lookups for certificate preflight. The stdlib resolver only answers
  # A/AAAA, and a CAA record that forbids our CA is otherwise invisible until
  # the CA refuses the order.
  "dnspython>=2.7,<3",
  "fastapi[opentelemetry]>=0.162,<1",
  "fastapi-pagination>=0.16,<0.17",
  "pydantic>=2.13.4,<3",
  "PyYAML>=6.0.2,<7",
  "python-multipart>=0.0.20,<1",
  # Persistence. The ORM owns storage and schema; pydantic remains the
  # validation authority, so nothing in a capability's domain/ or service/
  # imports these (enforced by the capability-values and capability-services
  # contracts in .importlinter).
  "alembic>=1.16,<2",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.52.3,<1",
  # Runtime dependencies, not development tools. Ansible exclusively owns
  # remote Linux state. Ansible Runner provides the stable Python execution
  # boundary, while ansible-core supplies the playbook engine and plugins.
  #
  # Declared here rather than installed separately by install.sh: `uv sync`
  # builds the environment the lockfile describes and removes anything else,
  # so a dependency that is really required has to say so here.
  "ansible-core>=2.22,<2.23",
  "pydantic-settings>=2.12,<3",
  "sqlalchemy>=2.0.52,<2.1",
  "ansible-runner>=2.4,<3",
  "dishka>=1.10.1,<2",
  # Renders /metrics: escaping, number formatting and the exposition content
  # type belong to the reference client, not to string formatting here.
  "prometheus-client>=0.22,<1",
  # Backs pydantic's EmailStr for ACME account addresses.
  "email-validator>=2.2,<3",
  # Our log events carry context as keyword fields, rendered through stdlib
  # handlers so third-party loggers share one JSON stream.
  "structlog>=25.4,<27",
  # ACME issuance in-process: no certbot subprocess, no hook re-entering the
  # CLI, nothing inheriting the controller's environment.
  "acme>=5.10,<6",
]

# PEP 735. Not an extra: these are never part of an install of this package,
# only of a checkout of it, and `uv sync` installs them by default while
# `uv sync --no-dev` — what a server runs — leaves them out entirely.
[dependency-groups]
dev = [
  "ansible-lint>=26.6,<27",
  "bandit[toml]>=1.9.4,<2",
  # Starlette's TestClient uses HTTPX2. Plain httpx is only a deprecated
  # compatibility fallback and emits a warning on every test run.
  "httpx2>=2.9,<3",
  # Used directly by tests/contract/edge/ to render the role templates.
  "Jinja2>=3.1,<4",
  # Exercise validation and serialization invariants over generated inputs.
  "hypothesis>=6.165.6,<7",
  "mypy>=2.3,<3",
  "pip-audit>=2.9,<3",
  "pre-commit>=4.2,<5",
  "pytest>=9.0.3,<10",
  "pytest-cov>=7.1,<8",
  # Runs the suite across cores. `-n auto --dist=worksteal` is the everyday
  # command; the gates keep the sequential-equivalent semantics because every
  # fixture is per-test and process-local.
  #
  # The `psutil` extra is what makes `-n auto` mean *physical* cores: without
  # it xdist falls back to `os.cpu_count()` and starts one worker per hardware
  # thread, which oversubscribes the cores and measured slower than half as
  # many workers. Each machine then picks its own number — no hardcoded count.
  "pytest-xdist[psutil]>=3.8,<4",
  "ruff>=0.16.3,<1",
  # install.sh runs as root and can stop services, so it is linted like the
  # Python. The wheel bundles the real ShellCheck binary, which keeps it a venv
  # tool alongside ruff and mypy instead of a machine-level install.
  "shellcheck-py>=0.10,<0.12",
  "types-PyYAML>=6.0.12,<7",
  "yamllint>=1.37,<2",
  # Checks the import-direction contracts in `.importlinter` (`just lint`).
  "import-linter>=2.3,<3",
]

[project.scripts]
blitzecdn = "blitzecdn.entrypoints.cli.main:run"
# The worker is its own console script as well as `python -m blitzecdn.entrypoints.worker`.
# Defining it here means the process the control plane runs is one this
# project owns and can give a signal handler to.
blitzecdn-worker = "blitzecdn.entrypoints.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/blitzecdn"]

[tool.pytest.ini_options]
markers = [
  # Builds real wheels and installs them into throwaway virtualenvs. Minutes,
  # not milliseconds, so it is deselectable: `just test-fast` skips it and
  # `just check` does not.
  "packaging: exercises real distribution build, install and uninstall",
]
addopts = "--strict-config --strict-markers --cov --cov-report=term-missing --cov-fail-under=85"
filterwarnings = [
  "error",
  # `ansible_runner.run()` always drives a playbook through pexpect, which
  # forks a pty. Python 3.15's `pty.fork()` warns when the parent has other
  # threads, and an xdist worker always does. The child execs ansible-playbook
  # immediately; raising here instead aborted the run after Runner had opened
  # its artifact files, which then leaked as ResourceWarnings on unrelated tests.
  'ignore:This process \(pid=\d+\) is multi-threaded, use of forkpty\(\) may lead to deadlocks in the child\.:DeprecationWarning:pty',
]
# All capability and provider tests live in the application suite.
testpaths = ["tests"]
# Shared helpers are the `support` package under it; `scripts` holds the
# developer tooling a few tests import (`installer_sync`).
pythonpath = ["tests", "scripts"]

[tool.coverage.run]
branch = true
source = ["src"]
# Python children of the test run (the recovery journey's worker, installer
# helpers run with `sys.executable`) record their own data files, which
# pytest-cov combines; without this, code reached only through a subprocess
# reads as untested. Interpreters in the packaging suite's throwaway
# virtualenvs have no coverage installed and stay unmeasured.
patch = ["subprocess"]

[tool.coverage.report]
include_namespace_packages = true
include = ["src/*"]

[tool.ruff]
target-version = "py315"
line-length = 88

# Ansible copies these standalone standard-library scripts to an edge and runs
# them with the edge host's own `python3`, not the control-plane image's
# interpreter. They keep the edge Python floor (src/blitzecdn/assets/ansible/README.md), so
# pyupgrade rules never rewrite them into syntax an edge cannot run.
# tests/contract/test_edge_python.py runs them under that interpreter.
[tool.ruff.per-file-target-version]
"src/blitzecdn/**/ansible/roles/*/files/*.py" = "py312"

[tool.ruff.lint]
select = ["A", "ASYNC", "B", "BLE", "C4", "C90", "E", "F", "I", "N", "PERF", "PLR0912", "PLR0915", "RUF", "S", "SIM", "UP"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-branches = 15
max-statements = 60

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# The packaging lifecycle suite exists to run `uv` and the installed
# `blitzecdn` console script: it builds wheels, makes virtualenvs, installs and
# uninstalls into them, and asks the result what it can do. Every call is a
# fixed argument array with no shell, and the paths come from `tmp_path` and
# the repository — there is no untrusted input for S603 to be about, and
# asserting on a real install is the whole point of the file.
"tests/architecture/test_application_installation.py" = ["S101", "S603"]
# The Ansible contract suites run `ansible-playbook` for the same reason: a
# role's assertions are only ever *evaluated* by executing them, and every
# argument is a fixed array over `tmp_path` and paths inside this workspace.
#
# The helpers module was the only entry here while the suites reached
# `subprocess` through `from support.contracts import *`, which left ruff unable
# to tell the name was the standard library and quietly firing S603 nowhere.
# The imports are explicit now, so the rule reaches the eight call sites it
# always should have, and the exemption is stated where they are rather than
# being an accident of how the name arrived.
"tests/support/contracts.py" = ["S603"]

[tool.mypy]
python_version = "3.15"
strict = true
# Check application source, developer scripts and shared test helpers.
files = ["src", "scripts", "tests/*.py", "tests/support"]

# The dynamic inventory plugin is Ansible's code, not the control plane's. It
# ships inside the package because Ansible loads inventory plugins by directory
# and it therefore has to travel in the wheel — but it is imported by
# `ansible-playbook`, under whatever interpreter that is, and deliberately
# cannot import `blitzecdn` to check what it reads (see
# tests/contract/test_inventory.py). It subclasses an untyped Ansible base, so
# under `strict` every method it overrides is an error about someone else's
# missing `py.typed`. What it publishes is checked where it matters: the
# contract test runs the real `ansible-inventory` against a real database and
# compares it to what the model renders.
[[tool.mypy.overrides]]
module = "blitzecdn.assets.ansible.plugins.inventory.*"
ignore_errors = true

# ansible-core publishes no type information. The edge renderer drives its
# templar in-process so controller-rendered configuration follows the edge
# play's exact templating semantics; what it renders is held by the parity
# test in tests/contract/test_configuration_rendering.py.
[[tool.mypy.overrides]]
module = ["ansible", "ansible.*"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]
# Process helpers and the SSH host-key scan launch fixed argument arrays, never
# a shell, with stdin closed and a timeout.
skips = ["B404", "B603"]
