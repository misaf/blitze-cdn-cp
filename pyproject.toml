[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "blitzecdn"
version = "2.7.0"
description = "Secure control plane and Ansible automation for BlitzeCDN edge servers"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "cryptography>=45,<51",
  # CAA lookups for certificate preflight. The stdlib resolver only answers
  # A/AAAA, and a CAA record that forbids our CA is otherwise invisible until
  # the CA refuses the order.
  "dnspython>=2.7,<3",
  "fastapi>=0.116,<1",
  "pydantic>=2.13.4,<3",
  "PyYAML>=6.0.2,<7",
  "python-multipart>=0.0.20,<1",
  # Persistence. The ORM owns storage and schema; pydantic remains the
  # validation authority, so nothing in domain/ or application/ imports these.
  "alembic>=1.16,<2",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.52.3,<1",
  # Runtime dependencies, not development tools. Ansible exclusively owns
  # remote Linux state. Ansible Runner provides the stable Python execution
  # boundary, while ansible-core supplies the playbook engine and plugins.
  #
  # It was previously installed as a separate step by install.sh, which worked
  # only because pip leaves alone whatever it did not install. `uv sync` builds
  # the environment the lockfile describes and removes anything else, so a
  # dependency that is really required has to say so here.
  "ansible-core>=2.21,<2.22",
  "pydantic-settings>=2.12,<3",
  "apscheduler>=3.11,<4",
  "sqlmodel>=0.0.31,<0.1",
  "dramatiq[redis]>=2.2.0,<3",
  "ansible-runner>=2.4,<3",
]

# PEP 735. Not an extra: these are never part of an install of this package,
# only of a checkout of it, and `uv sync` installs them by default while
# `uv sync --no-dev` — what a server runs — leaves them out entirely.
[dependency-groups]
dev = [
  "ansible-lint>=26.6,<27",
  "bandit[toml]>=1.9.4,<2",
  # Starlette's TestClient uses HTTPX2. Plain httpx is only a deprecated
  # compatibility fallback and emits a warning on every test run.
  "httpx2>=2.9,<3",
  # Used directly by tests/test_contract.py to render the role templates.
  "Jinja2>=3.1,<4",
  # Exercise validation and serialization invariants over generated inputs.
  "hypothesis>=6.165.6,<7",
  "mypy>=2.3,<3",
  "pip-audit>=2.9,<3",
  "pre-commit>=4.2,<5",
  "pytest>=9.0.3,<10",
  "pytest-cov>=7.1,<8",
  "ruff>=0.16.3,<1",
  # install.sh runs as root and can stop services, so it is linted like the
  # Python. The wheel bundles the real ShellCheck binary, which keeps it a venv
  # tool alongside ruff and mypy instead of a machine-level install.
  "shellcheck-py>=0.10,<0.12",
  "types-PyYAML>=6.0.12,<7",
  "yamllint>=1.37,<2",
]

[project.scripts]
blitzecdn = "blitzecdn.cli.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/blitzecdn"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=blitzecdn --cov-report=term-missing --cov-fail-under=85"
filterwarnings = ["error"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["A", "ASYNC", "B", "BLE", "C4", "C90", "E", "F", "I", "N", "PERF", "PLR0912", "PLR0915", "RUF", "S", "SIM", "UP"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-branches = 15
max-statements = 60

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["blitzecdn"]

[tool.bandit]
exclude_dirs = ["tests"]
# The certificate adapter must launch Certbot. It uses a fixed argument array,
# never a shell, closes stdin, and enforces a timeout.
skips = ["B404", "B603"]
