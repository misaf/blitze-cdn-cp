[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "blitzecdn"
version = "3.0.0"
description = "Secure control plane and Ansible automation for BlitzeCDN edge servers"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "cryptography>=45,<51",
  # CAA lookups for certificate preflight. The stdlib resolver only answers
  # A/AAAA, and a CAA record that forbids our CA is otherwise invisible until
  # the CA refuses the order.
  "dnspython>=2.7,<3",
  "fastapi>=0.116,<1",
  "pydantic>=2.13.4,<3",
  "PyYAML>=6.0.2,<7",
  "python-multipart>=0.0.20,<1",
  # Persistence. The ORM owns storage and schema; pydantic remains the
  # validation authority, so nothing in domain/ or application/ imports these.
  "alembic>=1.16,<2",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.52.3,<1",
  # Runtime dependencies, not development tools. Ansible exclusively owns
  # remote Linux state. Ansible Runner provides the stable Python execution
  # boundary, while ansible-core supplies the playbook engine and plugins.
  #
  # It was previously installed as a separate step by install.sh, which worked
  # only because pip leaves alone whatever it did not install. `uv sync` builds
  # the environment the lockfile describes and removes anything else, so a
  # dependency that is really required has to say so here.
  "ansible-core>=2.21,<2.22",
  "pydantic-settings>=2.12,<3",
  # The extension mechanism. Features register through it; business calls never
  # go through it. See src/blitzecdn/core/plugins/__init__.py.
  "pluggy>=1.6,<2",
  "apscheduler>=3.11,<4",
  "sqlmodel>=0.0.31,<0.1",
  "dramatiq[redis]>=2.2.0,<3",
  "ansible-runner>=2.4,<3",
]

# Optional capabilities: real distributions in `packages/`, attached by name.
#
# An extra, not a dependency. `pip install blitzecdn` installs the control
# plane and neither of these; `pip install 'blitzecdn[all]'` installs both.
# That is the packaging half of "installed is not enabled": the extra decides
# whether the capability is *present*, and configuration decides whether a site
# uses it. Naming them here creates no import and no code path — core has no
# `if backup_installed:` anywhere, and `tests/architecture/test_packages.py`
# asserts it.
[project.optional-dependencies]
backup = ["blitzecdn-backup"]
cache = ["blitzecdn-cache"]
compression = ["blitzecdn-compression"]
certificates = ["blitzecdn-certificates"]
security = ["blitzecdn-security"]
http3 = ["blitzecdn-http3"]
geoip = ["blitzecdn-geoip"]
all = ["blitzecdn-backup", "blitzecdn-cache", "blitzecdn-compression", "blitzecdn-certificates", "blitzecdn-security", "blitzecdn-http3", "blitzecdn-geoip"]


# PEP 735. Not an extra: these are never part of an install of this package,
# only of a checkout of it, and `uv sync` installs them by default while
# `uv sync --no-dev` — what a server runs — leaves them out entirely.
[dependency-groups]
dev = [
  "ansible-lint>=26.6,<27",
  "bandit[toml]>=1.9.4,<2",
  # Starlette's TestClient uses HTTPX2. Plain httpx is only a deprecated
  # compatibility fallback and emits a warning on every test run.
  "httpx2>=2.9,<3",
  # Used directly by tests/test_contract.py to render the role templates.
  "Jinja2>=3.1,<4",
  # Exercise validation and serialization invariants over generated inputs.
  "hypothesis>=6.165.6,<7",
  "mypy>=2.3,<3",
  "pip-audit>=2.9,<3",
  "pre-commit>=4.2,<5",
  "pytest>=9.0.3,<10",
  "pytest-cov>=7.1,<8",
  # Runs the suite across cores. `-n auto --dist=worksteal` is the everyday
  # command; the gates keep the sequential-equivalent semantics because every
  # fixture is per-test and process-local.
  #
  # The `psutil` extra is what makes `-n auto` mean *physical* cores: without
  # it xdist falls back to `os.cpu_count()` and starts one worker per hardware
  # thread, which oversubscribes the cores and measured slower than half as
  # many workers. Each machine then picks its own number — no hardcoded count.
  "pytest-xdist[psutil]>=3.8,<4",
  "ruff>=0.16.3,<1",
  # install.sh runs as root and can stop services, so it is linted like the
  # Python. The wheel bundles the real ShellCheck binary, which keeps it a venv
  # tool alongside ruff and mypy instead of a machine-level install.
  "shellcheck-py>=0.10,<0.12",
  "types-PyYAML>=6.0.12,<7",
  "yamllint>=1.37,<2",
]

# One repository, several distributions. The root project is `blitzecdn`; every
# optional capability under `packages/` is a workspace member resolved from the
# same `uv.lock`, so a checkout develops and tests all of them together while
# each still builds and installs as an independent wheel.
[tool.uv.workspace]
members = ["packages/*"]

# Inside this checkout the extras above resolve to the local members rather than
# to a registry. A published wheel carries optional-package requirements only
# through `[project.optional-dependencies]`; this
# table is checkout-local and never travels in package metadata.
[tool.uv.sources]
blitzecdn-backup = { workspace = true }
blitzecdn-cache = { workspace = true }
blitzecdn-compression = { workspace = true }
blitzecdn-certificates = { workspace = true }
blitzecdn-security = { workspace = true }
blitzecdn-http3 = { workspace = true }
blitzecdn-geoip = { workspace = true }


[project.scripts]
blitzecdn = "blitzecdn.cli.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/blitzecdn"]

[tool.pytest.ini_options]
markers = [
  # Builds real wheels and installs them into throwaway virtualenvs. Minutes,
  # not milliseconds, so it is deselectable: `just test-fast` skips it and
  # `just check` does not.
  "packaging: exercises real distribution build, install and uninstall",
  "requires_certificates: cross-capability integration needing blitzecdn-certificates",
]
addopts = "--strict-config --strict-markers --cov=blitzecdn --cov=blitzecdn_backup --cov=blitzecdn_cache --cov=blitzecdn_compression --cov=blitzecdn_certificates --cov=blitzecdn_security --cov=blitzecdn_http3 --cov=blitzecdn_geoip --cov-report=term-missing --cov-fail-under=85"
filterwarnings = ["error"]
# The workspace's whole suite: the control plane's own tests, plus each
# optional distribution's tests, which live with the distribution. A package
# is the unit of modularity, so removing `packages/blitzecdn-cache` removes its
# implementation *and* its tests in one move and this list needs no edit — a
# missing directory contributes nothing rather than failing collection.
testpaths = ["tests", "packages/blitzecdn-backup/tests", "packages/blitzecdn-cache/tests", "packages/blitzecdn-compression/tests", "packages/blitzecdn-certificates/tests", "packages/blitzecdn-security/tests", "packages/blitzecdn-http3/tests", "packages/blitzecdn-geoip/tests"]
# Tests live in per-capability directories now, so the shared helpers beside
# `conftest.py` are no longer guaranteed onto `sys.path` by a top-level test
# module. Name the directory rather than relying on where the first collected
# file happens to sit.
# Shared test helpers, imported by name rather than found by adjacency:
# `tests/` holds the control plane's, and each optional package holds its
# own beside its tests.
pythonpath = ["tests", "packages/blitzecdn-cache/tests", "packages/blitzecdn-certificates/tests"]

[tool.coverage.run]
branch = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["A", "ASYNC", "B", "BLE", "C4", "C90", "E", "F", "I", "N", "PERF", "PLR0912", "PLR0915", "RUF", "S", "SIM", "UP"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-branches = 15
max-statements = 60

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"packages/*/tests/**" = ["S101"]
# The packaging lifecycle suite exists to run `uv` and the installed
# `blitzecdn` console script: it builds wheels, makes virtualenvs, installs and
# uninstalls into them, and asks the result what it can do. Every call is a
# fixed argument array with no shell, and the paths come from `tmp_path` and
# the repository — there is no untrusted input for S603 to be about, and
# asserting on a real install is the whole point of the file.
"tests/architecture/test_lifecycle.py" = ["S101", "S603"]
# The shared Ansible contract helpers run `ansible-playbook` for the same
# reason: a role's assertions are only ever *evaluated* by executing them, and
# every argument is a fixed array over `tmp_path` and paths inside this
# workspace.
"tests/contract_support.py" = ["S603"]

[tool.mypy]
python_version = "3.12"
strict = true
# Every distribution in the workspace, checked together. A package that only
# type-checks against a stale installed core is a package whose boundary is not
# really being held.
packages = ["blitzecdn", "blitzecdn_backup", "blitzecdn_cache", "blitzecdn_compression", "blitzecdn_certificates", "blitzecdn_security", "blitzecdn_geoip"]

# Hook specifications are declarations, not implementations: pluggy never calls
# the spec, only the implementations registered against it. A body would be
# unreachable code that looked like a default.
[[tool.mypy.overrides]]
module = "blitzecdn.core.plugins.hooks"
disable_error_code = ["empty-body"]

[tool.bandit]
exclude_dirs = ["tests"]
# The certificate adapter must launch Certbot. It uses a fixed argument array,
# never a shell, closes stdin, and enforces a timeout.
skips = ["B404", "B603"]
