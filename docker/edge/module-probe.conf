# Build-time capability probe for the BlitzeCDN edge image. Not shipped as
# runtime configuration: `nginx -t -c` this file during the build, so an image
# whose dynamic modules do not match the binary is never published.
#
# Use the same module list as the runtime configuration so the build probe
# cannot drift from what the published edge actually loads.
include /etc/nginx/modules.conf;
pid /tmp/blitzecdn-module-probe.pid;
events {}
http {
    # One directive from each module. A module that loads but registers nothing
    # is indistinguishable from a working one until an edge configuration uses
    # it, which is far too late.
    brotli off;
    js_path /etc/nginx;
    server {
        listen 127.0.0.1:65535;
        location / {
            return 204;
        }
    }
}
