# Build-time capability probe for the BlitzeCDN edge image. Not shipped as
# runtime configuration: `nginx -t -c` this file during the build, so an image
# whose dynamic modules do not match the binary is never published.
#
# The modules-enabled drop-ins the packages install already load these; loading
# them explicitly here is what makes the failure a build failure with a path in
# it rather than a missing directive three layers later.
load_module /usr/lib/nginx/modules/ngx_http_geoip2_module.so;
load_module /usr/lib/nginx/modules/ngx_http_brotli_filter_module.so;
load_module /usr/lib/nginx/modules/ngx_http_js_module.so;
pid /tmp/blitzecdn-module-probe.pid;
events {}
http {
    # One directive from each module. A module that loads but registers nothing
    # is indistinguishable from a working one until an edge configuration uses
    # it, which is far too late.
    brotli off;
    js_path /etc/nginx;
    server {
        listen 127.0.0.1:65535;
        location / {
            return 204;
        }
    }
}
