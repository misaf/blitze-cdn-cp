---
# Everything the security capability needs on an edge, owned by the
# capability.
#
# The role lives beside the security feature; the control plane finds it
# through the feature's Ansible contribution, so the njs implementation, its
# secret and its `conf.d` snippet are named by no line of core.

# Whether this fleet can serve the Layer-7 browser challenge.
#
# Fleet Ansible policy — `blitzecdn config set
# blitzecdn_security_under_attack_enabled true` — and separate from the site
# setting that asks for it.
# A site asking for Under Attack Mode while this is false fails the assertion
# in tasks/main.yml rather than silently reaching its origin unchallenged.
blitzecdn_security_under_attack_enabled: false

# Lifetime of a valid clearance cookie. Keep the secret below stable across the
# fleet so a clearance survives an edge change inside this window.
blitzecdn_security_under_attack_passage_seconds: 1800

# Fleet-wide HMAC key for stateless challenges and clearance cookies.
#
# Read from the controller's environment, never written down here: the control
# plane forwards this key because this package explicitly claims it in its
# Ansible contribution, so the operator sets one line in the controller's 0600
# `.env` and nothing else:
#
#   BLITZE_UNDER_ATTACK_SECRET=<at least 32 bytes>
#
# It never enters TOML, desired state, the fleet settings database or an
# Ansible command line. The njs module it is written into is root:www-data
# 0640 and every task that touches it sets no_log.
blitzecdn_security_under_attack_secret: "{{ lookup('env', 'BLITZE_UNDER_ATTACK_SECRET') }}"

# Under the runtime contract's njs module directory, which core creates
# root-owned and 0750 and mounts read-only into the edge container.
blitzecdn_security_under_attack_js_file: >-
  {{ blitzecdn_edge_runtime.paths.modules }}/under-attack.js
# The signing key, as an Nginx include outside every configuration release.
blitzecdn_security_under_attack_key_file: >-
  {{ blitzecdn_edge_runtime.paths.secrets }}/under-attack.conf
