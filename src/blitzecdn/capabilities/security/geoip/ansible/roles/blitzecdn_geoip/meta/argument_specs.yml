---
argument_specs:
  main:
    short_description: Provision visitor IP-to-country lookup on an edge.
    description:
      - >-
        The `geoip` capability's whole edge implementation, contributed by the
        geoip feature. It installs the GeoLite2 database the release pins from
        the controller, verified by digest, for this feature's Nginx
        contribution to read.
      - >-
        Run from the edge play's capability slot, which the control plane fills
        from its features.
      - >-
        It reads the shared edge runtime contract for one thing only — the
        capability data directory its database lives under. It reads no
        variable belonging to blitzecdn_nginx, blitzecdn_edge_stack or another
        capability's role.
    options:
      blitzecdn_edge_runtime:
        type: dict
        required: true
        description: >-
          The shared edge runtime contract, owned and validated by the
          blitzecdn_edge role.
      blitzecdn_geoip_enabled:
        type: bool
        required: true
        description: >-
          Whether this fleet resolves visitor addresses to countries. Every
          controller ships the capability; this switches it on.
      blitzecdn_geoip_database_source:
        type: path
        required: false
        description: >-
          The controller's copy of the database this release pins. Derived by
          the release; absent until the controller holds a database.
      blitzecdn_geoip_database_sha256:
        type: str
        required: false
        description: >-
          The SHA-256 of blitzecdn_geoip_database_source, checked on the
          controller before the copy and on the edge after it.
      blitzecdn_geoip_edition: {type: str, required: true}
      blitzecdn_geoip_directory: {type: path, required: true}
      blitzecdn_geoip_database: {type: path, required: true}
      blitzecdn_geoip_reload: {type: str, required: true}
