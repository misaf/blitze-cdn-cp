---
# The GeoIP capability's whole edge implementation.
#
# Runs from the edge play's capability slot: after the container engine, the
# runtime image and the persistent directories exist, and before the firewall
# opens a port or the release's configuration is staged and validated.
# That order is what makes this role's two outputs usable — the database has to
# be on disk and the `conf.d` snippet has to define $blitzecdn_country before
# `nginx -t` sees a site that reads it.

# First, and before anything on this host changes. blitzecdn_nginx does not
# ask this question — asking it there would mean core's role naming a
# capability that may not be installed — so it is asked here, by the capability
# that answers it, against the same desired state.
#
# The control plane refuses these sites earlier still, by name, in
# SitePolicy.capability_requirements. Both controls stay: that one tells an
# operator at `blitzecdn validate` that the capability is missing, while
# this one catches the fleet where the capability was never switched on.
- name: Refuse country-dependent settings on an edge without GeoIP
  ansible.builtin.assert:
    that:
      - >-
        blitzecdn_geoip_enabled
        or blitzecdn_nginx_sites | default([])
        | selectattr('firewall', 'defined')
        | map(attribute='firewall')
        | selectattr('allowed_countries', 'defined')
        | selectattr('allowed_countries')
        | list | length == 0
      - >-
        blitzecdn_geoip_enabled
        or blitzecdn_nginx_sites | default([])
        | selectattr('firewall', 'defined')
        | map(attribute='firewall')
        | selectattr('denied_countries', 'defined')
        | selectattr('denied_countries')
        | list | length == 0
      - >-
        blitzecdn_geoip_enabled
        or blitzecdn_nginx_sites | default([])
        | selectattr('visitor_headers', 'defined')
        | map(attribute='visitor_headers')
        | selectattr('ip_country', 'defined')
        | selectattr('ip_country')
        | list | length == 0
      # A path rule's location can turn the header on where its host does not.
      - >-
        blitzecdn_geoip_enabled
        or blitzecdn_nginx_sites | default([])
        | selectattr('locations', 'defined')
        | map(attribute='locations') | flatten
        | selectattr('settings.visitor_headers', 'defined')
        | map(attribute='settings.visitor_headers')
        | selectattr('ip_country', 'defined')
        | selectattr('ip_country')
        | list | length == 0
    fail_msg: >-
      A site asks for country-based filtering or the BZ-IPCountry visitor
      header, but GeoIP is off on {{ inventory_hostname }}. Run
      `blitzecdn config set blitzecdn_geoip_enabled true`, provide MaxMind
      credentials on the controller and run `blitzecdn geoip update`, then
      deploy again — or turn the country
      rules and visitor_headers.ip_country off. Nothing was changed on this
      host. Rendering either setting against an undefined $blitzecdn_country
      would fail `nginx -t` and roll the whole edge back; converging them
      silently would report a site that admits every country it was told to
      block.

- name: Provision the GeoIP capability
  when: blitzecdn_geoip_enabled | bool
  block:
    # Read by the edge container through core's read-only mount of the
    # capability data directory, so it is world-readable.
    - name: Create the GeoIP directory
      ansible.builtin.file:
        path: "{{ blitzecdn_geoip_directory }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    # The controller downloads GeoLite2 once for the whole fleet and the
    # release pins its file by digest, so an edge needs no MaxMind credential,
    # no schedule of its own, and no route to MaxMind.
    - name: Install the database the release pins
      when: blitzecdn_geoip_database_sha256 is defined
      vars:
        blitzecdn_geoip_database_source: >-
          {{ blitzecdn_geoip_controller_directory }}/GeoLite2-Country-{{
          blitzecdn_geoip_database_sha256 }}.mmdb
      block:
        - name: Read the pinned database's digest on the controller
          ansible.builtin.stat:
            path: "{{ blitzecdn_geoip_database_source }}"
            checksum_algorithm: sha256
          delegate_to: localhost
          become: false
          register: blitzecdn_geoip_source

        - name: Require the exact database captured by the release
          ansible.builtin.assert:
            that:
              - blitzecdn_geoip_source.stat.isreg | default(false)
              - >-
                blitzecdn_geoip_source.stat.checksum | default('')
                == blitzecdn_geoip_database_sha256
            fail_msg: >-
              The GeoIP database this release pins,
              {{ blitzecdn_geoip_database_source }}, is missing from the
              controller or has changed; refusing to ship it.

        # Renamed into place by the copy module, so Nginx's auto_reload sees
        # the old file or the whole new one, never a partial write.
        - name: Copy the GeoIP database
          ansible.builtin.copy:
            src: "{{ blitzecdn_geoip_database_source }}"
            dest: "{{ blitzecdn_geoip_database }}"
            owner: root
            group: root
            mode: "0644"

    # Without the file Nginx fails to *start*, not merely to reload, so a
    # missing or wrong database has to stop the deploy here rather than surface
    # at the next reboot. With no database on the controller, the operator
    # places one on the edge by hand and this is what says so.
    - name: Inspect the GeoIP database
      ansible.builtin.stat:
        path: "{{ blitzecdn_geoip_database }}"
        checksum_algorithm: sha256
        get_checksum: "{{ blitzecdn_geoip_database_sha256 is defined }}"
      register: blitzecdn_geoip_db

    - name: Require the GeoIP database to be present
      ansible.builtin.assert:
        that:
          - blitzecdn_geoip_db.stat.exists or ansible_check_mode
        fail_msg: >-
          GeoIP is enabled but there is no database at
          {{ blitzecdn_geoip_database }}, and the controller has none to ship.
          Set BLITZE_MAXMIND_ACCOUNT_ID and BLITZE_MAXMIND_LICENSE_KEY on the
          controller and run `blitzecdn geoip update`, or place a database
          there by hand. Country rules and the BZ-IPCountry header cannot be
          served without it.

    - name: Require the installed database to match the release
      ansible.builtin.assert:
        that:
          - >-
            blitzecdn_geoip_db.stat.checksum | default('')
            == blitzecdn_geoip_database_sha256
        fail_msg: >-
          {{ blitzecdn_geoip_database }} on {{ inventory_hostname }} does not
          match the database the release pins.
      when:
        - blitzecdn_geoip_database_sha256 is defined
        - not ansible_check_mode

# Turning the capability off leaves the database where it is: it is not a
# credential, Nginx stops reading it as soon as the snippet is gone, and an
# operator's hand-placed file is not this role's to delete. Edges hold nothing
# of MaxMind's but the data.
