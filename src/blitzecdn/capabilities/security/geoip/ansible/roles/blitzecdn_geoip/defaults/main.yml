---
# Everything the GeoIP capability needs on an edge, owned by the capability.
#
# None of this is in core's Ansible. The role lives beside the geoip feature,
# and the control plane finds it through the feature's Ansible contribution, so
# these defaults and the Nginx snippet are named by no line of core.

# Whether this fleet resolves visitor addresses to countries.
#
# Fleet Ansible policy, so it is set with `blitzecdn config set
# blitzecdn_geoip_enabled true` and published to every edge by the inventory
# plugin. Every controller ships the capability; this turns it on for the
# fleet, so a controller may use it on one fleet and not on another.
#
# Off by default. A site that asks for a country rule or the BZ-IPCountry
# header while this is false fails the assertion below rather than converging a
# configuration that quietly admits every country.
blitzecdn_geoip_enabled: false

# The database an edge receives, pinned by the release.
#
# The controller downloads GeoLite2 from MaxMind once for the whole fleet —
# edges hold no MaxMind credential and never talk to MaxMind — and every release
# carries the SHA-256 of the controller's current file as
# `blitzecdn_geoip_database_sha256`. It is derived, so it has no default here:
# without it the controller has no database yet, and the role requires one
# placed on the edge by hand.
#
# The file itself is found by digest under the controller's state directory,
# which the control plane hands every run as BLITZE_STATE_DIR. Only the digest
# is in the release, so a controller restored to another directory renders the
# same release and can still roll back to it.
#
# The file name is derived inside the task block that runs only when a digest
# is pinned: argument validation renders every default, and one naming the
# digest would fail on a controller that has no database yet.
blitzecdn_geoip_controller_directory: >-
  {{ lookup('env', 'BLITZE_STATE_DIR') }}/geoip-databases

# Country is all the firewall rules and the BZ-IPCountry header need.
# GeoLite2-City is far larger and buys nothing here.
blitzecdn_geoip_edition: GeoLite2-Country

# Under the runtime contract's capability data directory, which core creates
# and mounts read-only into the edge container and into the configuration test.
# That directory is the whole of core's knowledge of this capability: it does
# not know a database goes in it, only that something might.
blitzecdn_geoip_directory: "{{ blitzecdn_edge_runtime.paths.data }}/geoip"
blitzecdn_geoip_database: >-
  {{ blitzecdn_geoip_directory }}/{{ blitzecdn_geoip_edition }}.mmdb

# How often Nginx's geoip2 module checks the file for a replacement. A shipped
# database is renamed into place, so a deployment's new file is picked up with
# no reload of Nginx's own.
blitzecdn_geoip_reload: 5m
