---
argument_specs:
  main:
    short_description: Report live nginx connection counters from a BlitzeCDN edge.
    description:
      - >-
        Reads the stub_status endpoint that blitzecdn_nginx configures and
        publishes the result as the C(blitzecdn_report) fact, which the control
        plane collects from Ansible Runner's event stream as part of the run's
        structured result.
      - >-
        Read-only. It changes nothing on the edge, so it is safe to schedule
        and safe to run during a deployment.
    options:
      blitzecdn_cache_stats_status_address: {type: str, required: true}
      blitzecdn_cache_stats_status_port: {type: int, required: true}
      blitzecdn_cache_stats_status_path: {type: str, required: true}
