---
argument_specs:
  main:
    short_description: Report cache and connection counters from a BlitzeCDN edge.
    description:
      - >-
        Reads the hostname access logs and stub_status endpoint that blitzecdn_nginx
        configures and publishes the result as the C(blitzecdn_report) fact,
        which the control plane collects from Ansible Runner's event stream as
        part of the run's structured result.
      - >-
        Read-only. It changes nothing on the edge, so it is safe to schedule
        and safe to run during a deployment.
    options:
      blitzecdn_cache_stats_log_directory:
        type: path
        required: true
        description: Must equal blitzecdn_edge_runtime.paths.logs with /domains appended on the same host.
      blitzecdn_cache_stats_status_address: {type: str, required: true}
      blitzecdn_cache_stats_status_port: {type: int, required: true}
      blitzecdn_cache_stats_status_path: {type: str, required: true}
      blitzecdn_cache_stats_max_lines:
        type: int
        required: true
        description: Newest lines to read from each hostname access log.
