---
# The hostname log directory blitzecdn_nginx writes and the status endpoint the
# edge runtime contract fixes. This role runs in its own read-only playbook and
# is told them rather than reading the contract; the control plane's
# tests/contract/roles/ asserts they agree, because pointed at the wrong
# directory this role reports a hit ratio of zero, which looks like a broken
# cache rather than a misconfigured reader.
blitzecdn_cache_stats_log_directory: /var/log/nginx/domains
blitzecdn_cache_stats_status_address: 127.0.0.1
blitzecdn_cache_stats_status_port: 8090
blitzecdn_cache_stats_status_path: /stub_status

# Cap on how much of each hostname's live access log is read. A busy edge
# rotates gigabytes a day and the whole file is neither affordable to scan on
# every run nor interesting — the recent window is what "is the cache working
# now" means. The window is per hostname, so a quiet site is not crowded out by
# a busy one. Raise it for a longer view, at linear cost.
blitzecdn_cache_stats_max_lines: 50000
