---
# Defensive validation only. Which hostnames may be purged, and whether the
# caller is allowed to empty a whole edge, are control-plane decisions; this
# role refuses input it cannot act on safely and nothing more.
- name: Refuse an ambiguous purge request
  ansible.builtin.assert:
    that:
      - >-
        not (blitzecdn_cache_purge_all
             and (blitzecdn_cache_purge_entries | length > 0
                  or blitzecdn_cache_purge_prefixes | length > 0
                  or blitzecdn_cache_purge_tags | length > 0))
    fail_msg: >-
      blitzecdn_cache_purge_all was given with named entries, prefixes or tags.
      Emptying the cache and removing some of it are different operations and
      combining them hides which one actually ran.

- name: Require something to purge
  ansible.builtin.assert:
    that:
      - >-
        blitzecdn_cache_purge_all
        or blitzecdn_cache_purge_entries | length > 0
        or blitzecdn_cache_purge_prefixes | length > 0
        or blitzecdn_cache_purge_tags | length > 0
    fail_msg: >-
      Nothing to purge. An empty request is refused rather than reported as a
      successful purge of nothing, which is indistinguishable from a filter
      that matched no sites.

- name: Validate the entries to purge
  ansible.builtin.assert:
    that:
      - item.host is match('^[A-Za-z0-9._-]{1,253}$')
      - item.uri is match('^/[^\s]{0,2048}$')
    fail_msg: >-
      A purge entry must have a hostname and an absolute URI beginning with
      '/'. Got host={{ item.host | default('') }} uri={{ item.uri | default('') }}
  loop: "{{ blitzecdn_cache_purge_entries }}"
  loop_control:
    label: "{{ item.host | default('?') }}{{ item.uri | default('') }}"

- name: Validate the prefixes to purge
  ansible.builtin.assert:
    that:
      - item.host is match('^[A-Za-z0-9._-]{1,253}$')
      - item.prefix | default('/') is match('^/[^\s]{0,2048}$')
    fail_msg: >-
      A purge prefix must have a hostname and an absolute path beginning with
      '/'. Got host={{ item.host | default('') }} prefix={{ item.prefix | default('') }}
  loop: "{{ blitzecdn_cache_purge_prefixes }}"
  loop_control:
    label: "{{ item.host | default('?') }}{{ item.prefix | default('/') }}"

- name: Validate the tags to purge
  ansible.builtin.assert:
    that:
      - item is string
      - item is match('^[^\s,]{1,1024}$')
    fail_msg: >-
      A purge tag is 1 to 1024 characters with no whitespace or commas, as it
      appears in one Cache-Tag value. Got {{ item }}
  loop: "{{ blitzecdn_cache_purge_tags }}"

# The encoding is only part of the key when blitzecdn_nginx normalizes it. With
# normalization off there is one entry per URL and method, so purging the three
# encoding variants would delete two paths that never existed.
- name: Resolve the cache-key encodings in play
  ansible.builtin.set_fact:
    blitzecdn_cache_purge_key_encodings: >-
      {{ blitzecdn_cache_purge_encodings
         if blitzecdn_cache_purge_normalize_accept_encoding | bool
         else [''] }}

# A named entry is its exact keys, one per scheme, listener port, method and
# encoding, built as cache-upstream.conf.j2's proxy_cache_key builds them.
#
# They are matched against the KEY line of every cached file rather than hashed
# into the one path nginx files the key under. A response carrying Vary is
# stored once at the MD5 of the key and once per other variant under a hash of
# the key plus the varied request headers, which nothing here can recompute,
# and nginx goes on serving those secondary files after the primary one is
# deleted. Every variant carries the same KEY line.
#
# One template render rather than one task per key. A purge of 500 HTTP URLs is
# 500 x 2 methods x 7 ports x 3 encodings = 21000 keys, and accumulating them
# with a looped set_fact rebuilt the whole list on every iteration — quadratic,
# in Ansible task dispatch, per edge. The loops below run inside Jinja instead,
# so the cost is one render regardless of how many entries were asked for.
- name: Compute the cache keys of the requested entries
  ansible.builtin.set_fact:
    blitzecdn_cache_purge_keys: >-
      {% set keys = [] %}
      {%- for entry in blitzecdn_cache_purge_entries -%}
        {%- set ports = blitzecdn_cache_purge_http_ports
              if (entry.scheme | default('https')) == 'http'
              else blitzecdn_cache_purge_https_ports -%}
        {%- for method in blitzecdn_cache_purge_methods -%}
          {%- for port in ports -%}
            {%- for encoding in blitzecdn_cache_purge_key_encodings -%}
        {%- set _ = keys.append(
              (entry.scheme | default('https')) ~ port ~ method
              ~ entry.host ~ entry.uri ~ encoding
            ) -%}
            {%- endfor -%}
          {%- endfor -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ keys | unique(case_sensitive=true) | list }}

# Keys, prefixes and tags name keys and headers, not files: no hash of a prefix
# or tag leads to the entries under it, and the hash of a key leads to only one
# of its Vary variants. purge_scan.py resolves all of them together through an
# index on the edge of what each cached file holds (its KEY line and the tags
# in its stored response header). The index is brought up to date at the start
# of the run by reading only the files stored since the last one: directories
# nginx has not stored into or evicted from are not even listed. A rebuilt or
# lost index costs one read of every file, which is what every purge used to
# cost.
#
# Emptying the cache runs the same script, so it reports how many files it
# removed like every other purge, and empties the index with the cache.
- name: Purge cached responses
  block:
    - name: Create a private temporary cache scanner
      ansible.builtin.tempfile:
        state: file
        prefix: blitzecdn-purge-scan-
      register: blitzecdn_cache_purge_scanner
      changed_when: false

    - name: Copy the standalone cache scanner
      ansible.builtin.copy:
        src: purge_scan.py
        dest: "{{ blitzecdn_cache_purge_scanner.path }}"
        owner: root
        group: root
        mode: "0600"
      changed_when: false

    - name: Remove the requested cached responses
      ansible.builtin.command:
        argv:
          - "{{ ansible_python_interpreter | default('/usr/bin/python3') }}"
          - "{{ blitzecdn_cache_purge_scanner.path }}"
        stdin: >-
          {{ {'path': blitzecdn_cache_purge_path,
              'index': blitzecdn_cache_purge_index_path,
              'all': blitzecdn_cache_purge_all | bool,
              'keys': blitzecdn_cache_purge_keys,
              'prefixes': blitzecdn_cache_purge_prefixes,
              'tags': blitzecdn_cache_purge_tags} | to_json }}
      register: blitzecdn_cache_purge_scanned
      # A named purge or an emptied cache reports changed even when nothing
      # was there, as it always has: what the control plane documents a
      # successful purge to mean is that the object is not being served from
      # cache any more, not that it was there.
      changed_when: >-
        blitzecdn_cache_purge_all | bool
        or blitzecdn_cache_purge_entries | length > 0
        or (blitzecdn_cache_purge_scanned.stdout | from_json).removed > 0

    # How many files matched, and how many had to be read to bring the index
    # up to date, goes back to the control plane per edge.
    - name: Report what the purge removed  # noqa: var-naming[no-role-prefix]
      ansible.builtin.set_fact:
        blitzecdn_report: "{{ blitzecdn_cache_purge_scanned.stdout | from_json }}"

    # A file the scan could not decide, or could not delete, may hold an entry
    # it should have removed. Failing the edge marks the purge incomplete and
    # names it, rather than reporting success while that entry is still served.
    - name: Fail if any cached file could not be checked
      ansible.builtin.assert:
        that:
          - blitzecdn_report.unchecked | int == 0
        fail_msg: >-
          {{ blitzecdn_report.unchecked }} cached file(s) could not be read far
          enough to match them (no KEY line, or a key or response header longer
          than the scanner reads), or could not be deleted. They were left in
          place; rerun the purge, or empty the cache if they persist.
  always:
    - name: Remove the temporary cache scanner
      ansible.builtin.file:
        path: "{{ blitzecdn_cache_purge_scanner.path }}"
        state: absent
      changed_when: false
      when: blitzecdn_cache_purge_scanner.path is defined
