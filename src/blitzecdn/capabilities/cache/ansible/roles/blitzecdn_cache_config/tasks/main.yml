---
- name: Validate per-site cache policy
  ansible.builtin.assert:
    that:
      - >-
        item.cache_valid_success | default('10m')
        is match('^(?:0|[1-9][0-9]*)(?:ms|[smhdw])$')
      - >-
        item.cache_valid_not_found | default('1m')
        is match('^(?:0|[1-9][0-9]*)(?:ms|[smhdw])$')
      - item.cache_level | default('standard') in ['standard', 'everything']
      - >-
        item.cache_bypass_cookies | default([], true)
        | reject('match', '^[A-Za-z0-9_.*-]{1,128}$') | list | length == 0
    fail_msg: "Site {{ item.name }} has an invalid cache duration, level or bypass cookie."
  loop: "{{ blitzecdn_nginx_sites }}"
  loop_control:
    label: "{{ item.name }}"

# Core creates this too, because Compose mounts it on an edge with no cache
# capability at all. Declared identically here so the two never disagree: this
# role runs in the capability slot, before blitzecdn_edge_stack, and a
# different owner in either place is a chown on every converge rather than a
# converged fleet.
#
# The owner is the runtime image's worker uid, not a host account name. Nginx
# chowns its cache root to the user its workers run as, and that user is the
# image's, whose uid the host's passwd file knows nothing about.
- name: Create the response cache directory
  ansible.builtin.file:
    path: "{{ blitzecdn_edge_runtime.paths.cache }}"
    state: directory
    owner: "{{ blitzecdn_edge_runtime.worker_uid }}"
    group: www-data
    mode: "0750"
