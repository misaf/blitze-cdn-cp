---
# Runs before install.sh removes /opt/blitzecdn and therefore before it removes
# the Ansible executable running this play. Edge cleanup is delegated by the
# uninstall role to blitzecdn_teardown, the same role normal decommission uses.
- name: Remove BlitzeCDN-managed state from a standalone host
  hosts: localhost
  connection: local
  become: true
  gather_facts: false
  any_errors_fatal: true
  roles:
    - role: blitzecdn_uninstall
      tags: [uninstall]
