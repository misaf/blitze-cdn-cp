---
# Docker publishes amd64 and arm64 for Ubuntu; ansible_facts.architecture is the
# kernel's name for the same thing and matches neither. Anything unrecognised is
# passed through unchanged, so the apt failure names the architecture rather
# than this lookup.
blitzecdn_docker_architecture: >-
  {{ {'x86_64': 'amd64', 'aarch64': 'arm64'}
     .get(ansible_facts.architecture, ansible_facts.architecture) }}
