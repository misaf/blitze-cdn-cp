---
# `nginx -t` for a containerised edge.
#
# Deliberately a *fresh* container rather than an exec into the running one.
# Three reasons, each of which has to hold:
#
#   * on a first converge there is no running container yet, and the whole point
#     of validating is to decide whether one may be started;
#   * an upgrade has to test the configuration against the image it is about to
#     move to, which is by definition not the one running;
#   * a probe that cannot reach the live container cannot disturb it. This runs
#     with no network and the same mounts, so it sees exactly what the edge
#     would see and can affect nothing that is serving.
- name: Test the rendered configuration against the edge runtime image
  community.docker.docker_container:
    name: blitzecdn-edge-config-test
    image: "{{ blitzecdn_nginx_config_test_image }}"
    command: [nginx, -t]
    detach: false
    cleanup: true
    network_mode: none
    read_only: true
    security_opts: [no-new-privileges:true]
    # /var/lib/nginx alongside the two obvious ones because `nginx -t` is not
    # purely a read: loading a configuration that registers the client-body and
    # proxy temp paths makes nginx create them and chown them to the configured
    # worker, and an image whose temp tree ships owned by someone else fails
    # that chown against a read-only rootfs — with a message about
    # `/var/lib/nginx/body` that says nothing about the configuration under
    # test. The serving container never hits it, because its rootfs is
    # writable. A syntax check has no business depending on the image's
    # internal ownership, so give it somewhere to write and throw it away.
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
      - /run:rw,noexec,nosuid,size=8m
      - /var/lib/nginx:rw,nosuid,size=8m
    volumes: "{{ blitzecdn_nginx_config_test_volumes }}"
    state: started
  register: blitzecdn_nginx_config_test
  changed_when: false
  failed_when: blitzecdn_nginx_config_test.status | default(1) != 0
