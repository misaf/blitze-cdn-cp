---
- name: Validate the desired state before changing anything
  ansible.builtin.import_tasks: validate.yml

- name: Verify the edge runtime
  ansible.builtin.import_tasks: verify-runtime.yml
  when: not (blitzecdn_nginx_stack_ready | default(false) | bool)

- name: Allow Nginx to traverse the ACME webroot parent
  ansible.builtin.file:
    path: "{{ blitzecdn_edge_runtime.paths.acme | dirname }}"
    state: directory
    mode: o+x

- name: Create ACME webroot directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ blitzecdn_edge_runtime.paths.acme }}"
      owner: root
      group: www-data
      mode: "0755"
    - path: "{{ blitzecdn_edge_runtime.paths.acme }}/.well-known"
      owner: root
      group: www-data
      mode: "0755"
    - path: "{{ blitzecdn_edge_runtime.paths.acme }}/.well-known/acme-challenge"
      owner: root
      group: www-data
      mode: "0750"
  loop_control:
    label: "{{ item.path }}"

- name: Create managed TLS directories
  ansible.builtin.file:
    path: "{{ item.certificate_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop: "{{ blitzecdn_nginx_sites }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.certificate_mode | default('disabled') in ['uploaded', 'requested']

- name: Install managed certificate chains
  ansible.builtin.copy:
    src: "{{ item.certificate_source_path }}"
    dest: "{{ item.certificate_path }}"
    owner: root
    group: root
    mode: "0644"
    backup: true
  loop: "{{ blitzecdn_nginx_sites }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.certificate_mode | default('disabled') in ['uploaded', 'requested']
  notify: Validate and reload Nginx

- name: Install managed private keys
  ansible.builtin.copy:
    src: "{{ item.certificate_key_source_path }}"
    dest: "{{ item.certificate_key_path }}"
    owner: root
    group: root
    mode: "0600"
    backup: true
  loop: "{{ blitzecdn_nginx_sites }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.certificate_mode | default('disabled') in ['uploaded', 'requested']
  no_log: true
  notify: Validate and reload Nginx

- name: Configure generic HTTP support
  ansible.builtin.template:
    src: http.conf.j2
    dest: "{{ blitzecdn_edge_runtime.paths.nginx }}/conf.d/blitzecdn-http.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Validate and reload Nginx

- name: Render installed capability HTTP resources
  ansible.builtin.template:
    src: "{{ item.template }}"
    dest: >-
      {{ blitzecdn_edge_runtime.paths.nginx }}/conf.d/blitzecdn-plugin-{{
        item.name | regex_replace('\.j2$', '') }}
    owner: root
    group: root
    mode: "0644"
  loop: "{{ blitzecdn_nginx_resources.http | default([]) }}"
  loop_control:
    label: "{{ item.plugin }}:{{ item.name }}"
  notify: Validate and reload Nginx

- name: Find previously rendered capability HTTP resources
  ansible.builtin.find:
    paths: "{{ blitzecdn_edge_runtime.paths.nginx }}/conf.d"
    patterns: blitzecdn-plugin-*.conf
    file_type: file
  register: blitzecdn_nginx_installed_http_resources

- name: Remove detached capability HTTP resources
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  vars:
    blitzecdn_nginx_desired_http_resource_paths: >-
      {{
        blitzecdn_nginx_resources.http | default([])
        | map(attribute='name')
        | map('regex_replace', '\.j2$', '')
        | map('regex_replace', '^(.*)$', blitzecdn_edge_runtime.paths.nginx ~ '/conf.d/blitzecdn-plugin-\\1')
        | list
      }}
  loop: >-
    {{
      blitzecdn_nginx_installed_http_resources.files
      | rejectattr('path', 'in', blitzecdn_nginx_desired_http_resource_paths)
      | list
    }}
  loop_control:
    label: "{{ item.path }}"
  notify: Validate and reload Nginx

# Part of the edge runtime contract, so it is always rendered, and rendered
# outside the site block below: a failed site render must not take the
# endpoint the container healthcheck reads away with it.
- name: Configure the status endpoint
  ansible.builtin.template:
    src: status.conf.j2
    dest: "{{ blitzecdn_nginx_status_file }}"
    owner: root
    group: root
    mode: "0644"
  notify: Validate and reload Nginx

- name: Inspect managed-site registry
  ansible.builtin.stat:
    path: "{{ blitzecdn_nginx_managed_sites_file }}"
  register: blitzecdn_nginx_registry

- name: Read managed-site registry
  ansible.builtin.slurp:
    path: "{{ blitzecdn_nginx_managed_sites_file }}"
  register: blitzecdn_nginx_registry_content
  when: blitzecdn_nginx_registry.stat.exists

- name: Calculate stale managed sites
  ansible.builtin.set_fact:
    blitzecdn_nginx_desired_names: "{{ blitzecdn_nginx_sites | map(attribute='name') | list }}"
    blitzecdn_nginx_stale_names: >-
      {{
        (
          (blitzecdn_nginx_registry_content.content | default('') | b64decode).splitlines()
          | reject('equalto', '')
          | list
        )
        | difference(blitzecdn_nginx_sites | map(attribute='name') | list)
      }}

- name: Refuse to erase the final managed sites without explicit approval
  ansible.builtin.assert:
    that:
      - >-
        blitzecdn_nginx_allow_empty_sites
        or blitzecdn_nginx_desired_names | length > 0
        or blitzecdn_nginx_stale_names | length == 0
    fail_msg: >-
      Desired state is empty but this edge has managed sites. Recreate them in
      the control plane, or explicitly set BLITZE_ALLOW_EMPTY_SITES=true to
      approve removing every managed site and its managed TLS material.

# Only names shaped like a site name are allowed to select a directory for
# recursive removal as root. The registry is ours, but it is a plain file on a
# host an operator can edit, and a line containing '..' or '/' would otherwise
# aim this task anywhere on the filesystem.
- name: Select stale managed TLS directories
  ansible.builtin.set_fact:
    blitzecdn_nginx_stale_tls_names: >-
      {{ blitzecdn_nginx_stale_names | select('match', '^[a-z][a-z0-9-]{0,62}$') | list }}

# Everything that writes into the live config tree runs under one rescue.
#
# nginx keeps serving from the configuration it loaded at start, so a bad render
# is invisible until something reloads it — a reboot, a package upgrade, an
# unrelated deploy. Left in place, a config that fails `nginx -t` turns into an
# nginx that refuses to start, hours later, with nothing in the deploy log to
# connect it to. Validating here and putting the previous files back on failure
# means a bad render costs a failed run instead of an offline edge.
- name: Converge managed site configurations
  block:
    # First inside the block, because everything rendered after it is written
    # against the directives these modules register: a contributed `brotli` or
    # `js_import` line is an unknown directive until the module that owns it is
    # loaded, so the config test at the end of this block is only meaningful
    # once this file matches what the fragments assume.
    - name: Render the loaded module set
      ansible.builtin.template:
        src: modules.conf.j2
        dest: "{{ blitzecdn_edge_runtime.paths.modules_conf }}"
        owner: root
        group: root
        mode: "0644"
        backup: true
      register: blitzecdn_nginx_rendered_modules
      notify: Validate and reload Nginx

    - name: Render managed sites
      ansible.builtin.template:
        src: site.conf.j2
        dest: "{{ blitzecdn_edge_runtime.paths.nginx }}/sites-available/{{ item.name }}.conf"
        owner: root
        group: root
        mode: "0644"
        backup: true
      loop: "{{ blitzecdn_nginx_sites }}"
      loop_control:
        label: "{{ item.name }}"
      register: blitzecdn_nginx_rendered
      notify: Validate and reload Nginx

    - name: Render the catch-all default site
      ansible.builtin.template:
        src: default.conf.j2
        dest: "{{ blitzecdn_nginx_default_site_file }}"
        owner: root
        group: root
        mode: "0644"
        backup: true
      register: blitzecdn_nginx_rendered_default
      when: blitzecdn_nginx_default_server
      notify: Validate and reload Nginx

    # `force: true` lets this pass in check mode, where the template above
    # reports changed without writing: the module skips the "src must exist"
    # gate and previews the link instead of failing on a file it could not
    # have created.
    - name: Enable the catch-all default site
      ansible.builtin.file:
        src: "{{ blitzecdn_nginx_default_site_file }}"
        dest: >-
          {{ blitzecdn_edge_runtime.paths.nginx }}/sites-enabled/{{
            blitzecdn_nginx_default_site_file | basename }}
        state: link
        force: true
      when: blitzecdn_nginx_default_server
      notify: Validate and reload Nginx

    # Withdrawing the catch-all hands the default_server position back to
    # whichever managed site loads first, so the file goes too — leaving it
    # unlinked but present invites someone to re-link it by hand later.
    - name: Withdraw the catch-all default site
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ blitzecdn_edge_runtime.paths.nginx }}/sites-enabled/{{ blitzecdn_nginx_default_site_file | basename }}"
        - "{{ blitzecdn_nginx_default_site_file }}"
      when: not blitzecdn_nginx_default_server
      notify: Validate and reload Nginx

    - name: Enable desired sites
      ansible.builtin.file:
        src: "{{ blitzecdn_edge_runtime.paths.nginx }}/sites-available/{{ item.name }}.conf"
        dest: "{{ blitzecdn_edge_runtime.paths.nginx }}/sites-enabled/{{ item.name }}.conf"
        state: link
        force: true
      loop: "{{ blitzecdn_nginx_sites }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.enabled | default(true)
      notify: Validate and reload Nginx

    - name: Disable explicitly disabled sites
      ansible.builtin.file:
        path: "{{ blitzecdn_edge_runtime.paths.nginx }}/sites-enabled/{{ item.name }}.conf"
        state: absent
      loop: "{{ blitzecdn_nginx_sites }}"
      loop_control:
        label: "{{ item.name }}"
      when: not item.enabled | default(true)
      notify: Validate and reload Nginx

    - name: Remove distribution default site
      ansible.builtin.file:
        path: "{{ blitzecdn_edge_runtime.paths.nginx }}/sites-enabled/default"
        state: absent
      notify: Validate and reload Nginx

    # The handler validates too, but only if something notified it and only
    # after every other role's tasks have run. This is the gate that decides
    # whether the tree we just wrote is allowed to survive the play.
    - name: Validate the assembled configuration
      ansible.builtin.include_tasks: config-test.yml
      when: not ansible_check_mode

  rescue:
    # Before the sites, because a module list the running edge cannot load
    # takes every one of them down with it: nginx refuses to start on a
    # `load_module` it cannot resolve, so this is the one file in the tree
    # whose rollback the others depend on.
    - name: Restore the previous module set
      ansible.builtin.copy:
        src: "{{ blitzecdn_nginx_rendered_modules.backup_file }}"
        dest: "{{ blitzecdn_nginx_rendered_modules.dest }}"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      when: blitzecdn_nginx_rendered_modules.backup_file is defined

    - name: Restore sites that had a previous configuration
      ansible.builtin.copy:
        src: "{{ item.backup_file }}"
        dest: "{{ item.dest }}"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      loop: >-
        {{ (blitzecdn_nginx_rendered | default({}, true)).get('results', [])
           | selectattr('backup_file', 'defined') | list }}
      loop_control:
        label: "{{ item.dest }}"

    # A rendered file with no backup did not exist before this run, so there is
    # nothing to restore — it and its link have to go entirely.
    - name: Identify sites this run created
      ansible.builtin.set_fact:
        blitzecdn_nginx_created: >-
          {{ (blitzecdn_nginx_rendered | default({}, true)).get('results', [])
             | rejectattr('backup_file', 'defined')
             | selectattr('dest', 'defined')
             | map(attribute='dest') | list }}

    - name: Withdraw sites this run created
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: >-
        {{ blitzecdn_nginx_created
           | union(blitzecdn_nginx_created
                   | map('regex_replace', '/sites-available/', '/sites-enabled/')) }}

    - name: Restore the catch-all default site
      ansible.builtin.copy:
        src: "{{ blitzecdn_nginx_rendered_default.backup_file }}"
        dest: "{{ blitzecdn_nginx_rendered_default.dest }}"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      when: blitzecdn_nginx_rendered_default.backup_file is defined

    # Proves the rollback actually landed. If this fails the edge cannot reload
    # nginx and needs hands on it — far better to learn that now, inside a failed
    # deploy, than at the next restart of the container.
    - name: Confirm the restored configuration loads
      ansible.builtin.include_tasks: config-test.yml
      when: not ansible_check_mode

    - name: Report the withdrawn configuration
      ansible.builtin.fail:
        msg: >-
          Nginx rejected the configuration rendered for {{ inventory_hostname }},
          so it was rolled back and nothing was reloaded. The edge is still
          serving its previous configuration. Re-run with -vv to see which site
          failed `nginx -t`.

# Stale files stay in place until the replacement tree has passed `nginx -t`.
# Removing an enabled link before its target means an interruption can only
# leave an extra disabled file, never a dangling include that stops Nginx from
# starting. A failed deletion is safe and retryable: the registry is committed
# only after every owned artifact has been withdrawn.
- name: Remove stale enabled links
  ansible.builtin.file:
    path: "{{ blitzecdn_edge_runtime.paths.nginx }}/sites-enabled/{{ item }}.conf"
    state: absent
  loop: "{{ blitzecdn_nginx_stale_names }}"
  notify: Validate and reload Nginx

- name: Remove stale configurations
  ansible.builtin.file:
    path: "{{ blitzecdn_edge_runtime.paths.nginx }}/sites-available/{{ item }}.conf"
    state: absent
  loop: "{{ blitzecdn_nginx_stale_names }}"
  notify: Validate and reload Nginx

# Runs after the configurations that reference them are gone, so no surviving
# vhost can point at a certificate this removes. Managed certificates always
# live at /etc/blitzecdn/tls/<site name>/ — the assertions above refuse to
# converge a site whose certificate_path is anywhere else — so a directory
# named for a site the controller no longer emits is ours and is dead. An
# unmanaged site's certificate is under /etc/ssl or /etc/letsencrypt and is
# never named for a site, so it cannot be selected here.
- name: Remove stale managed TLS material
  ansible.builtin.file:
    path: "{{ blitzecdn_edge_runtime.paths.tls }}/{{ item }}"
    state: absent
  loop: "{{ blitzecdn_nginx_stale_tls_names }}"

# Consumed by blitzecdn_edge_stack's health verification, which waits for every
# public TCP listener to accept a connection. Whether any listener is claimed at
# all is this role's decision — the catch-all default server, or an enabled site
# — so this role states it rather than leaving the stack role to re-derive it
# from these variables. Disabled sites do not count: their configuration is
# rendered but never linked into sites-enabled, so they bind nothing.
- name: Publish whether this edge claims the public listeners
  ansible.builtin.set_fact:
    blitzecdn_nginx_listeners_claimed: >-
      {{
        blitzecdn_nginx_default_server | bool
        or (blitzecdn_nginx_sites | rejectattr('enabled', 'defined') | list
            + blitzecdn_nginx_sites | selectattr('enabled', 'defined')
              | selectattr('enabled') | list) | length > 0
      }}

- name: Record managed site names
  ansible.builtin.copy:
    content: "{{ blitzecdn_nginx_desired_names | sort | join('\n') }}\n"
    dest: "{{ blitzecdn_nginx_managed_sites_file }}"
    owner: root
    group: root
    mode: "0644"

# A managed certificate is copied under its fingerprint, then the validated
# site configuration atomically starts referring to that complete pair. Only
# after that commit can older files be removed. An interrupted copy therefore
# leaves an unused file, never a live chain paired with the wrong private key.
- name: Find managed TLS bundle files
  ansible.builtin.find:
    paths: "{{ item.certificate_path | dirname }}"
    patterns: "*.pem"
    file_type: file
    recurse: false
  loop: "{{ blitzecdn_nginx_sites }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.certificate_mode | default('disabled') in ['uploaded', 'requested']
  register: blitzecdn_nginx_tls_files

- name: Remove superseded managed TLS bundle files
  ansible.builtin.file:
    path: "{{ item.1.path }}"
    state: absent
  loop: "{{ blitzecdn_nginx_tls_files.results | subelements('files', skip_missing=True) }}"
  loop_control:
    label: "{{ item.1.path }}"
  when:
    - item.1.path != item.0.item.certificate_path
    - item.1.path != item.0.item.certificate_key_path

# Nothing here starts Nginx. The configuration tree is now complete and proven
# loadable; blitzecdn_edge_stack decides whether that means starting a container
# for the first time, leaving a running one alone, or replacing it for a runtime
# upgrade. Keeping the two apart is what makes a site change a reload.
