---
# This role deliberately leaves the checkout in place. It contains the
# ansible-playbook process executing these tasks; install.sh removes it after
# the play exits. Packages are shared host state and are not removed either.

- name: Inspect the control-plane Compose project
  ansible.builtin.stat:
    path: "{{ blitzecdn_uninstall_compose_file }}"
  register: blitzecdn_uninstall_compose

- name: Remove the control-plane containers and persistent Redis volume
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --file
      - "{{ blitzecdn_uninstall_compose_file }}"
      - down
      - --volumes
      - --remove-orphans
  when: blitzecdn_uninstall_compose.stat.exists
  changed_when: true

- name: Remove the local control-plane runtime image
  ansible.builtin.command:
    argv: [docker, image, rm, "{{ blitzecdn_uninstall_image }}"]
  register: blitzecdn_uninstall_image_removal
  changed_when: blitzecdn_uninstall_image_removal.rc == 0
  failed_when: false

- name: Remove edge-managed Linux state through its canonical role
  ansible.builtin.include_role:
    name: blitzecdn_edge_teardown
  vars:
    blitzecdn_edge_teardown_remove_logs: true

# Before the state directory goes, because the registry lives in it. Deleting
# the record first would leave the host admitting port 8000 for addresses whose
# API no longer exists, with nothing left on disk able to name them -- an open
# rule no later run could ever withdraw. Same three steps and the same ordering
# as the edge teardown above, for the same reason: ufw keeps every rule it has
# been given, so a removal is only a removal if the previous set can be read
# back. Rules an operator added by hand carry no registry line and stay.
- name: Inspect the managed API firewall rule registry
  ansible.builtin.stat:
    path: "{{ blitzecdn_uninstall_firewall_registry_file }}"
  register: blitzecdn_uninstall_firewall_registry_stat

- name: Read the managed API firewall rule registry
  ansible.builtin.slurp:
    path: "{{ blitzecdn_uninstall_firewall_registry_file }}"
  register: blitzecdn_uninstall_firewall_registry_content
  when: blitzecdn_uninstall_firewall_registry_stat.stat.exists

- name: Select the API firewall rules this installation added
  ansible.builtin.set_fact:
    blitzecdn_uninstall_firewall_rules: >-
      {{
        (blitzecdn_uninstall_firewall_registry_content.content | default('') | b64decode).splitlines()
        | select('match', '^tcp\|[0-9]{1,5}\|[^|]+$') | list
      }}

- name: Withdraw the API firewall rules this installation added
  community.general.ufw:
    rule: allow
    direction: in
    delete: true
    proto: "{{ item.split('|')[0] }}"
    port: "{{ item.split('|')[1] }}"
    src: "{{ item.split('|')[2] }}"
  loop: "{{ blitzecdn_uninstall_firewall_rules }}"
  when: not ansible_check_mode

- name: Remove exact BlitzeCDN-owned host paths
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ blitzecdn_uninstall_cli_wrapper }}"
    - "{{ blitzecdn_uninstall_sudoers_file }}"
    - "{{ blitzecdn_uninstall_state_dir }}"

# The deployment identity genuinely logs in over SSH while installed. It is
# removed after the controller and edge containers have stopped using it.
- name: Remove the deployment account and home
  ansible.builtin.user:
    name: "{{ blitzecdn_uninstall_deploy_user }}"
    state: absent
    remove: true
    force: true

- name: Ensure the deployment account home is absent
  ansible.builtin.file:
    path: "{{ blitzecdn_uninstall_deploy_home }}"
    state: absent
