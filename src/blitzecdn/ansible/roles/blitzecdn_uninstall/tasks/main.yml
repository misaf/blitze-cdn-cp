---
# This role deliberately leaves the checkout in place. It contains the
# ansible-playbook process executing these tasks; install.sh removes it after
# the play exits. Packages are shared host state and are not removed either.

- name: Inspect the control-plane Compose project
  ansible.builtin.stat:
    path: "{{ blitzecdn_uninstall_compose_file }}"
  register: blitzecdn_uninstall_compose

- name: Remove the control-plane containers and persistent Redis volume
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --file
      - "{{ blitzecdn_uninstall_compose_file }}"
      - down
      - --volumes
      - --remove-orphans
  when: blitzecdn_uninstall_compose.stat.exists
  changed_when: true

- name: Remove the local control-plane runtime image
  ansible.builtin.command:
    argv: [docker, image, rm, "{{ blitzecdn_uninstall_image }}"]
  register: blitzecdn_uninstall_image_removal
  changed_when: blitzecdn_uninstall_image_removal.rc == 0
  failed_when: false

- name: Remove edge-managed Linux state through its canonical role
  ansible.builtin.include_role:
    name: blitzecdn_teardown
  vars:
    blitzecdn_teardown_remove_logs: true

- name: Remove exact BlitzeCDN-owned host paths
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ blitzecdn_uninstall_cli_wrapper }}"
    - "{{ blitzecdn_uninstall_sudoers_file }}"
    - "{{ blitzecdn_uninstall_state_dir }}"

# The deployment identity genuinely logs in over SSH while installed. It is
# removed after the controller and edge containers have stopped using it.
- name: Remove the deployment account and home
  ansible.builtin.user:
    name: "{{ blitzecdn_uninstall_deploy_user }}"
    state: absent
    remove: true
    force: true

- name: Ensure the deployment account home is absent
  ansible.builtin.file:
    path: "{{ blitzecdn_uninstall_deploy_home }}"
    state: absent
