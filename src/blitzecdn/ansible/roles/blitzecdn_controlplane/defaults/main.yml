---
# The control-plane host is a Debian/Ubuntu host like any edge, so its state is
# converged the same way an edge's is. What the installer keeps is only what has
# to exist before Ansible can run at all: the packages Python needs, the
# host tooling virtualenv and pinned collections. Application processes run
# only in the Compose project.
blitzecdn_controlplane_install_dir: /opt/blitzecdn
blitzecdn_controlplane_config_dir: /etc/blitzecdn
blitzecdn_controlplane_state_dir: /var/lib/blitzecdn
# Deliberately outside the installation directory: an uninstall removes
# /opt/blitzecdn and everything in it, and the one thing that must survive
# that is the backup taken before it.
blitzecdn_controlplane_backup_dir: /var/backups/blitzecdn
blitzecdn_controlplane_deploy_user: deploy
blitzecdn_controlplane_cli_wrapper: /usr/local/bin/blitzecdn
blitzecdn_controlplane_sudoers_file: /etc/sudoers.d/blitzecdn-deploy
blitzecdn_controlplane_compose_file: /etc/blitzecdn/control-plane.compose.yml
blitzecdn_controlplane_compose_project: blitzecdn-control-plane
blitzecdn_controlplane_image: blitzecdn-control-plane:local
blitzecdn_controlplane_redis_image: redis:8.2-alpine
# Where the control plane's own Dockerfile sits, relative to the installation
# directory that is the build context. It ships inside the wheel, beside the
# Ansible this role is part of, and `blitzecdn.docker.CONTROL_PLANE_DOCKERFILE`
# is the authority on the location — a contract test fails if this default and
# that constant disagree, which is the whole reason the path is a variable
# rather than a literal in the template.
#
# Relative because it is resolved against the context by Docker, not by
# Ansible. The context is a source checkout, which is why this is the last
# place the controller still needs one.
blitzecdn_controlplane_dockerfile: src/blitzecdn/docker/control-plane/Dockerfile

# python3 and python3-venv are absent here on purpose: the installer has already
# had to install them to build the virtualenv this play is running from.
blitzecdn_controlplane_packages: [git, openssh-server, openssl, sudo]

# Which optional distributions this controller is being installed with.
#
# The role needs it because this file's capability-owned keys are only valid on
# an installation that has the owning distribution attached: the control plane
# refuses to start on a `BLITZE_*` name or a `[blitzecdn]` key that no
# installed capability claims. Writing an ACME email onto a controller with no
# `blitzecdn-certificates` would be configuring something that is not there.
#
# The default matches `install.sh`'s, and `install.sh` passes the list it is
# actually installing with, so the two cannot disagree on a real run.
blitzecdn_controlplane_capabilities:
  [backup, cache, certificates, hardening, origins, resolver]

# Set on a first installation only. An existing environment file keeps its
# credentials; supplying an address repoints the ACME account, and omitting it
# leaves the file alone on a repair run.
blitzecdn_controlplane_acme_email: ""
blitzecdn_controlplane_certificate_reconcile_seconds: 600
blitzecdn_controlplane_ssl_automatic_scan_seconds: 2592000
blitzecdn_controlplane_certificate_renewal_seconds: 43200
blitzecdn_controlplane_drift_check_seconds: 3600
blitzecdn_controlplane_preflight_dns_servers: 1.1.1.1,1.0.0.1

# The API listener, and the host firewall rules that admit it.
#
# The port is `blitzecdn.api.__main__.API_PORT`, and a contract test fails if
# the two disagree: the role would otherwise be admitting a port nothing
# serves while the listener sat behind a closed one, and neither half says so.
#
# Which sources are admitted is not set here. It is BLITZE_ALLOWED_IPS in the
# managed environment file — the same value the API itself reads — because an
# operator edits that file and recreates the container, and a second copy in
# the inventory would be a list that silently disagreed with the one enforcing
# access. Empty, the API stays on loopback and this role manages no rule.
blitzecdn_controlplane_api_port: 8000
# The rules this role installed on its last successful run, one per line as
# `proto|port|source`. Same mechanism and the same reason as the edge
# firewall's registry: ufw keeps every rule it has ever been given, so an
# address removed from the allowlist has to be read back from somewhere before
# it can be withdrawn. Without it the role could only ever open ports.
blitzecdn_controlplane_firewall_registry_file: >-
  {{ blitzecdn_controlplane_state_dir }}/api-firewall-rules
# The API access list this run was given, comma-separated, as `--allowed-ips`
# supplied it. Empty means the command line said nothing about access, and the
# environment file's line is left exactly as the operator left it — so the flag
# seeds a first installation without taking the file over from anyone who has
# since edited it by hand.
blitzecdn_controlplane_allowed_ips: ""
