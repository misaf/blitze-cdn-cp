---
# The BlitzeCDN runtime, as a Docker Compose project.
#
# This role owns *running* the edge. It does not render a single line of
# customer configuration: blitzecdn_nginx writes the whole configuration tree to
# the host filesystem and this mounts it. The split is deliberate and is what
# keeps a site change a reload rather than a container replacement — see
# blitzecdn_edge_stack_recreate below.
#
# There is no switch to skip it. An edge in the fleet has its public ports open
# and its configuration rendered; not running the container that serves them
# advertises an edge that is not there.

# --- image ---------------------------------------------------------------
#
# Software version, not desired state. The image an edge runs is fleet policy —
# set it with `blitzecdn config set blitzecdn_edge_image_tag 2.8.0` — while the
# sites it serves come from the control-plane database through desired state.
# Conflating them would make a customer adding a hostname a candidate for an
# Nginx upgrade.
#
# The reference itself is blitzecdn_edge_runtime.image, which blitzecdn_nginx
# also validates configuration against. It used to be composed twice, once in
# each role, with a test asserting the two literals agreed; validating a
# configuration against one image and serving it from another is exactly the
# drift a single value cannot produce.
#
# Fetch the image from its registry when this host does not already have it.
# Off for an air-gapped fleet, or one whose images are pre-seeded with
# `docker load` — the converge then requires the image to be present and fails
# clearly if it is not, rather than reaching for a registry it cannot see.
blitzecdn_edge_stack_image_pull: true
# The repository without its tag or digest, used to recognise this image's own
# entry among the RepoDigests of a pulled manifest.
blitzecdn_edge_stack_image_reference: >-
  {{ blitzecdn_edge_runtime.image | regex_replace('(@sha256:[0-9a-f]+|:[^/:]+)$', '') }}

# --- project layout ------------------------------------------------------
#
# The container name and every host directory the container mounts are
# blitzecdn_edge_runtime's — they describe the environment rather than this
# role's behaviour, and blitzecdn_nginx renders into the same directories and
# signals the same container. What is left below is state only this role reads
# or writes.

# The Compose project. Only this role creates, inspects or removes it, and a
# contract member with one reader is a variable that escaped its owner.
blitzecdn_edge_stack_project: blitzecdn
blitzecdn_edge_stack_compose_file: >-
  {{ blitzecdn_edge_runtime.paths.state }}/compose.yml
# Runtime state this role owns, kept apart from the contract's state path so a
# configuration backup does not carry a record of which image bytes were running
# on one host at one moment.
blitzecdn_edge_stack_runtime_path: /var/lib/blitzecdn/edge
# The image reference the last successful converge left running. Read back on
# the next run to tell "nothing changed" from "this is an upgrade", and to give
# a rollback something exact to return to.
blitzecdn_edge_stack_deployed_image_file: /var/lib/blitzecdn/edge/image

# --- health --------------------------------------------------------------
#
# Where the status endpoint lives, which ports must be open and whether QUIC is
# expected are all blitzecdn_edge_runtime's: this role probes exactly what
# blitzecdn_nginx rendered and blitzecdn_firewall opened. What is left here is
# how long this role waits.
#
# How long a recreated edge is given to become healthy and open every listener.
# A cold edge on a busy fleet reads thirteen listeners and every managed site
# before its first connection, while still pulling. Health itself is not
# optional: Docker does not restart a running container for being unhealthy, so
# the wait and health.yml are what turn an unhealthy edge into a failed deploy.
blitzecdn_edge_stack_health_timeout: 90
# Graceful stop. SIGQUIT lets Nginx finish in-flight requests; anything shorter
# turns every container replacement into a burst of visitor errors.
blitzecdn_edge_stack_stop_grace_period: 30s

# --- lifecycle -----------------------------------------------------------
#
# Recreate the container even when nothing about it changed. Off, because a
# configuration deployment must not replace the process serving traffic: the
# nginx role reloads instead, and only an image change recreates. Set true for a
# deliberate `docker compose up --force-recreate`, never as routine policy.
blitzecdn_edge_stack_recreate: false
