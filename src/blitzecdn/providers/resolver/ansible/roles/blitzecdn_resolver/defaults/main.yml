---
# Managing a host's resolver is off unless asked for. Many fleets run a
# legitimate internal resolver, and silently replacing it on every converge
# would be a networking change nobody requested.
#
# Turn it on where the host resolver cannot be trusted to answer public names
# truthfully — a split-horizon view, an internal forwarder, or a transparent
# proxy that claims every hostname. Nginx resolves origin *names* through this
# host resolver too, so a lying one is not only a certificate problem.
blitzecdn_resolver_enabled: false

# Resolver addresses, highest priority first. Addresses only: a hostname here
# would have to be resolved by the resolver being replaced.
blitzecdn_resolver_addresses: []

# Consulted only when none of the above answer.
blitzecdn_resolver_fallback_addresses: []

# systemd-resolved routing domains. '~.' claims every domain, which is what
# makes these servers the default and overrides whatever the link supplies.
# Narrow it to specific zones to leave the rest of resolution untouched.
blitzecdn_resolver_domains: ['~.']
