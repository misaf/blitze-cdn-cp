---
- name: Converge BlitzeCDN edge servers
  hosts: blitzecdn_edges
  become: true
  gather_facts: true
  # A failed edge stops every edge in the same run after that task. See
  # docs/design/edge-playbook.md#failure-policy.
  any_errors_fatal: true
  # No `serial`: the controller paces a rollout itself, canary first and then in
  # batches, limiting each run to one batch. A hand run reaches every edge it is
  # given at once, so canary one with --limit first. See
  # docs/design/edge-playbook.md#how-a-rollout-is-paced.
  # Phases are tag selections; untagged runs stage then activate. See
  # docs/design/edge-playbook.md.
  pre_tasks:
    - name: Validate supported operating system
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Ubuntu'
          - ansible_facts.distribution_version == '26.04'
        fail_msg: BlitzeCDN edges for this release require Ubuntu 26.04 LTS.
      tags: [always, stage]
    # The shared runtime contract, first so an unservable one fails before the
    # host changes.
    - name: Establish the shared edge runtime contract
      ansible.builtin.import_role:
        name: blitzecdn_edge
      tags: [always, stage, firewall, nginx, edge_stack]
    - name: Select the versioned configuration tree
      ansible.builtin.import_role:
        name: blitzecdn_config_release
        tasks_from: select.yml
      tags: [always]
    # Engine, directories and image before the firewall opens ports; the
    # container starts only after `nginx -t` passes.
    - name: Install and verify the host container engine
      ansible.builtin.import_role:
        name: blitzecdn_docker
      when: "'rollback' not in ansible_run_tags and 'commit' not in ansible_run_tags"
      tags: [always, stage, docker]
    - name: Prepare the persistent edge state and runtime image
      ansible.builtin.import_role:
        name: blitzecdn_edge_stack
        tasks_from: prepare.yml
      when: "'rollback' not in ansible_run_tags and 'commit' not in ansible_run_tags"
      tags: [always, stage, docker, edge_stack]
    - name: Verify the edge runtime image before firewall changes
      ansible.builtin.import_role:
        name: blitzecdn_nginx
        tasks_from: verify-runtime.yml
      vars:
        # The pinned digest, so the image probed is the image that serves.
        blitzecdn_nginx_config_test_image: >-
          {{ blitzecdn_edge_stack_resolved_image
             | default(blitzecdn_edge_runtime.image) }}
      when: "'rollback' not in ansible_run_tags and 'commit' not in ansible_run_tags"
      tags: [always, stage, nginx]
    # Reconciled on every stage and activation, so a stale token is repaired.
    - name: Install the controller's release probe token
      ansible.builtin.import_role:
        name: blitzecdn_nginx
        tasks_from: release-probe.yml
      when: "'rollback' not in ansible_run_tags and 'commit' not in ansible_run_tags"
      tags: [always, stage, nginx]
  roles:
    - role: blitzecdn_base
      tags: [base, activate]
    - role: blitzecdn_kernel
      tags: [kernel, activate]
    # Edge capability slot. Its position is a contract; see
    # docs/design/edge-playbook.md#order.
    - role: blitzecdn_capabilities
      vars:
        blitzecdn_capabilities_roles: "{{ blitzecdn_capability_roles | default([]) }}"
      when:
        - not blitzecdn_config_release_seal.stat.exists
        - "ansible_run_tags | intersect(['all', 'stage', 'nginx', 'capabilities']) | length > 0"
      tags: [capabilities, nginx, stage]
    - role: blitzecdn_firewall
      tags: [firewall, activate]
    # Host state the controller-rendered configuration depends on.
    - role: blitzecdn_nginx
      when: not blitzecdn_config_release_seal.stat.exists
      tags: [nginx, stage]
    # Stage, validate, start or replace the container, prove it serves.
    - role: blitzecdn_config_release
    # Host capability slot, after the edge serves. Its position is a
    # contract; see docs/design/edge-playbook.md#order.
    - role: blitzecdn_capabilities
      vars:
        blitzecdn_capabilities_roles: >-
          {{ blitzecdn_host_capability_roles | default([]) }}
      when: "ansible_run_tags | intersect(['all', 'activate', 'security', 'capabilities']) | length > 0"
      tags: [capabilities, security, activate]
