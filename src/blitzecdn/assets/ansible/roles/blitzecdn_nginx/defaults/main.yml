---
blitzecdn_nginx_worker_connections: 8192
blitzecdn_nginx_listen_backlog: 16384
blitzecdn_nginx_sites: []
# Removing the final managed site is unusually destructive and often means a
# new controller was pointed at an existing edge before its state was imported.
# Require an explicit controller setting for that transition. A fresh edge has
# no registry and can still be hardened before its first site is added.
blitzecdn_nginx_allow_empty_sites: false
blitzecdn_nginx_resources:
  http: []
  server: []
  access: []
  upstream: []
  module: []
# The Nginx dynamic modules the installed capabilities need loaded, composed by
# the control plane and delivered as an extra-var on every run. Empty here so
# the role stands on its own, and empty is a valid edge: HTTP/1.1, HTTP/2,
# HTTP/3, gzip and every core directive are compiled in.
blitzecdn_nginx_modules: []
# Where the edge runtime image keeps them. Core's half of the contract: a
# capability names a shared object, this names the directory it lands in, and
# neither has to know the other's answer.
blitzecdn_nginx_module_directory: /usr/lib/nginx/modules
blitzecdn_nginx_proxy_connect_timeout: 5s
blitzecdn_nginx_proxy_read_timeout: 30s
# Idle connections to an origin each worker keeps open per upstream group, for
# the next cache miss to reuse. Every proxied site renders one group per origin
# scheme and port it reaches; see site.conf.j2. It is a cap on idle sockets,
# not on concurrency: a burst opens as many connections as it needs and only
# this many are kept afterwards. 0 turns pooling off and every miss opens a
# fresh connection, as an edge did before upstream groups existed.
blitzecdn_nginx_upstream_keepalive: 32
# How long an idle origin connection is kept. Below an Nginx origin's own 75s,
# so against the most common origin the edge closes first rather than writing a
# request into a socket the origin is closing. An origin with a shorter idle
# timeout — Apache's default is 5s — closes first instead; Nginx retries a
# request whose reused connection turns out to be closed, except a
# non-idempotent one it had already sent.
blitzecdn_nginx_upstream_keepalive_timeout: 60s
# The shared-memory zone every upstream group on the edge is placed in. Only
# used with resolvers: `server ... resolve` re-resolves the origin at runtime
# and needs its group in shared memory. One zone for the whole edge, so its
# size is one setting rather than one per site. Measured against the edge
# image, a megabyte holds about seven hundred groups and a site needs at most
# one per listener port, so 32m is well over a thousand fully-proxied sites.
# Too small fails `nginx -t` with "no memory in upstream zone" before the
# release is activated, never at runtime.
blitzecdn_nginx_upstream_zone: blitzecdn_origins
blitzecdn_nginx_upstream_zone_size: 32m
blitzecdn_nginx_managed_sites_file: "{{ blitzecdn_edge_runtime.paths.nginx }}/blitzecdn-managed-sites"
# Which site carries `reuseport` on the QUIC listener. Nginx accepts it on
# exactly one server block, so this names the owner rather than the capability
# — the capability itself is blitzecdn_edge_runtime.listeners.http3, which the
# firewall reads too. Derived by the control plane from enabled sites.
blitzecdn_nginx_http3_listener_owner: ''
# Which image a configuration test runs under. Normally the image this edge
# runs — blitzecdn_edge_runtime.image, the same one blitzecdn_edge_stack serves
# from, because validating against one image and serving from another is the
# drift the shared contract exists to prevent. blitzecdn_edge_stack overrides
# this to validate the current configuration against a *new* image before
# replacing the container serving traffic.
#
# Nginx no longer runs on the host: it runs in the container
# blitzecdn_edge_stack starts, so `nginx -t` and `nginx -s reload` in this role
# mean "in that container".
blitzecdn_nginx_config_test_image: "{{ blitzecdn_edge_runtime.image }}"
# Certificate paths become copy destinations written as root, so confine them to
# directories that may legitimately hold certificates. Without this an operator
# could aim a deploy at /etc/cron.d or ~root/.ssh. Referenced as a variable, so
# the backslashes are literal rather than Jinja string escapes.
blitzecdn_nginx_certificate_path_pattern: '^/(?!.*(?:^|/)\.\.(?:/|$))etc/(?:blitzecdn/tls|ssl|letsencrypt)/[^;{}]+$'
# Defaults to Ubuntu 26.04's systemd-resolved stub listener. Set to [] to pin
# origin IPs at config-load time instead.
blitzecdn_nginx_resolvers: [127.0.0.53]
blitzecdn_nginx_resolver_valid: 30s
blitzecdn_nginx_resolver_timeout: 5s

# Claims the default_server position for a block that serves ACME challenges and
# answers everything else with 444. Without it, a request for a hostname no
# managed site declares is served by whichever site nginx loaded first, which on
# a shared edge is another customer's configuration. Turn off only on an edge
# that is genuinely single-tenant and fronted by something else.
blitzecdn_nginx_default_server: true
blitzecdn_nginx_default_site_file: >-
  {{ blitzecdn_edge_runtime.paths.nginx }}/sites-available/blitzecdn-default.conf

# Mozilla "intermediate" suites, TLS 1.2 only — TLS 1.3 picks its own and
# ignores this. All AEAD, all forward-secret.
blitzecdn_nginx_ssl_ciphers: >-
  ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-CHACHA20-POLY1305
# Off, because the CA this collection provisions from no longer publishes an
# OCSP responder URL in its certificates. Stapling against such a chain staples
# nothing and costs a warning on every `nginx -t` and reload, which trains
# operators to read a clean config test as noisy. Turn it back on only for a CA
# whose leaf carries an OCSP URL — the template also needs a resolver.
blitzecdn_nginx_ssl_stapling: false

# HSTS binds the customer's domain, not ours, and cannot be retracted faster
# than it expires in browsers that already saw it. Opt in per deployment.
blitzecdn_nginx_hsts_enabled: false
blitzecdn_nginx_hsts_max_age: 31536000

# Observability.
#
# Each configured hostname writes domains/<hostname>.access.log and
# domains/<hostname>.error.log under the runtime log root; wildcards use
# _wildcard in place of *. These are the only request logs: access files are
# JSON Lines, and record a contributed X-Cache-Status response header when
# present (empty without the cache capability). Error files retain Nginx text
# and are also copied to Docker stderr. The status endpoint exposes connection
# and request totals independently.
blitzecdn_nginx_access_log_enabled: true
blitzecdn_nginx_log_format_name: blitzecdn_json

# Where the status endpoint listens is blitzecdn_edge_runtime.status: the
# Compose healthcheck, health.yml and blitzecdn_cache_stats all read the same
# endpoint this role renders. The access list below is this role's half of the
# control — stub_status has no authentication of its own, so the loopback bind
# in the contract and this list are two independent controls, and neither
# should be widened without narrowing the other.
blitzecdn_nginx_status_allow: [127.0.0.1, "::1"]
blitzecdn_nginx_status_file: >-
  {{ blitzecdn_edge_runtime.paths.nginx }}/conf.d/blitzecdn-status.conf

# `/.blitzecdn/release` answers the active release digest only to a request
# carrying this token in X-BlitzeCDN-Probe, and 404 to everyone else, so the
# public listeners do not tell a stranger which configuration an edge runs.
# The controller generates the token once, keeps it under its state directory
# and passes it in the environment; its rollout verification sends the same
# value. Written as an Nginx include into the secrets directory, outside every
# configuration release, so it is not part of any release digest.
blitzecdn_nginx_release_probe_token: "{{ lookup('env', 'BLITZE_RELEASE_PROBE_TOKEN') }}"
blitzecdn_nginx_release_probe_file: >-
  {{ blitzecdn_edge_runtime.paths.secrets }}/release-probe.conf
