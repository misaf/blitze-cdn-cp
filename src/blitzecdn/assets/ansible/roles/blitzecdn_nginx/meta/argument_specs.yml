---
argument_specs:
  main:
    short_description: Converge Nginx CDN virtual hosts.
    options:
      blitzecdn_nginx_worker_connections: {type: int, required: true}
      blitzecdn_nginx_listen_backlog: {type: int, required: true}
      blitzecdn_nginx_sites:
        type: list
        elements: dict
        required: true
        description: >-
          The virtual hosts to converge, as the control plane derives them: each
          carries name, server_names and origin_host, and one key per setting of
          the site policy its features compose. The control plane validates every
          site against that policy before a release is compiled, so the keys are
          not declared here, where a capability adding a setting would have to
          edit this role. The templates supply the policy default for a setting
          left out.
      blitzecdn_nginx_allow_empty_sites:
        type: bool
        required: true
      blitzecdn_edge_runtime:
        type: dict
        required: true
        description: >-
          The shared edge runtime contract, owned and validated by the
          blitzecdn_edge role. This role reads the paths it renders into,
          the public listener sets, the status endpoint, the capability data
          directory and the image it validates against. It reads no variable belonging
          to blitzecdn_edge_stack or blitzecdn_firewall.
      blitzecdn_nginx_resources:
        type: dict
        required: true
        description: >-
          Validated package-owned static fragments grouped by stable Nginx
          context. Resolved from the features' contributions at run time.
      blitzecdn_nginx_modules:
        type: list
        elements: dict
        required: true
        description: >-
          The Nginx dynamic modules the capabilities load, composed by the
          control plane and delivered as an extra-var. Each entry names the
          contributing feature, the module and its shared objects; the
          rendered list is mounted over the one the runtime image was built
          with, so an edge loads what the features ask for rather than what the
          image carries. Empty is a valid edge.
        options:
          feature: {type: str, required: true}
          name: {type: str, required: true}
          objects: {type: list, elements: str, required: true}
      blitzecdn_nginx_module_directory:
        type: path
        required: true
        description: >-
          Where the runtime image keeps its dynamic modules. Core's half of the
          contract: a capability names a shared object and this names the
          directory it resolves against.
      blitzecdn_nginx_proxy_connect_timeout: {type: str, required: true}
      blitzecdn_nginx_proxy_read_timeout: {type: str, required: true}
      blitzecdn_nginx_upstream_keepalive:
        type: int
        required: true
        description: >-
          Idle origin connections each worker keeps per upstream group for the
          next cache miss to reuse. 0 disables pooling.
      blitzecdn_nginx_upstream_keepalive_timeout: {type: str, required: true}
      blitzecdn_nginx_upstream_zone: {type: str, required: true}
      blitzecdn_nginx_upstream_zone_size:
        type: str
        required: true
        description: >-
          Shared memory for every origin upstream group on the edge, used when
          resolvers are set so origins re-resolve at runtime.
      blitzecdn_nginx_managed_sites_file: {type: path, required: true}
      blitzecdn_nginx_http3_listener_owner: {type: str, required: true}
      blitzecdn_nginx_config_test_image:
        type: str
        required: true
        description: >-
          The image a configuration test runs under. Overridden by
          blitzecdn_edge_stack to validate the running configuration against a
          new image before the container serving traffic is replaced.
      blitzecdn_nginx_config_test_volumes:
        type: list
        elements: str
        required: true
        description: >-
          Compose-form mounts the configuration test container receives. The
          same set the running edge gets: a test that cannot see a certificate,
          an njs module or a capability's data file passes against a tree the
          real edge refuses. No default: blitzecdn_config_release's select.yml
          binds it to the release tree before this role runs. Cache and logs
          are writable because contributed resources may initialize runtime
          storage and `nginx -t` opens the error log.
      blitzecdn_nginx_certificate_path_pattern: {type: str, required: true}
      blitzecdn_nginx_resolvers: {type: list, elements: str, required: true}
      blitzecdn_nginx_resolver_valid: {type: str, required: true}
      blitzecdn_nginx_resolver_timeout: {type: str, required: true}
      blitzecdn_nginx_default_server: {type: bool, required: true}
      blitzecdn_nginx_default_site_file: {type: path, required: true}
      blitzecdn_nginx_ssl_ciphers: {type: str, required: true}
      blitzecdn_nginx_ssl_stapling: {type: bool, required: true}
      blitzecdn_nginx_hsts_enabled: {type: bool, required: true}
      blitzecdn_nginx_hsts_max_age: {type: int, required: true}
      blitzecdn_nginx_access_log_enabled:
        type: bool
        required: true
        description: >-
          Write each request and its cache outcome to its hostname's JSON
          Lines access log.
      blitzecdn_nginx_log_format_name:
        type: str
        required: true
        description: Name of the http-context log_format the managed sites use.
      blitzecdn_nginx_log_query_strings:
        type: bool
        required: true
        description: >-
          Keep query strings in the request line and referer. Off logs the
          path only.
      blitzecdn_nginx_log_client_ip:
        type: str
        required: true
        choices: [full, truncated]
        description: >-
          How much of the client address an access record keeps: all of it, or
          an IPv4 /24 and at most an IPv6 /48.
      blitzecdn_nginx_log_retention_days:
        type: int
        required: true
        description: >-
          Days rotated access and error logs are kept, and the most archives
          kept per file. At least 1.
      blitzecdn_nginx_status_allow:
        type: list
        elements: str
        required: true
        description: >-
          Sources permitted to read the status endpoint. The second, redundant
          control alongside the loopback listen address.
      blitzecdn_nginx_status_file: {type: path, required: true}
