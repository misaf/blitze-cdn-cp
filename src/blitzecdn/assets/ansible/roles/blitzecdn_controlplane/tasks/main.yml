---
# The control plane needs Python 3.12 or newer. This gate is intentionally
# separate from the edge play's Ubuntu 26.04 managed-stack contract.
- name: Validate supported operating system
  ansible.builtin.assert:
    that:
      - >-
        (ansible_facts.distribution == 'Debian' and
         ansible_facts.distribution_major_version | int >= 13) or
        (ansible_facts.distribution == 'Ubuntu' and
         ansible_facts.distribution_major_version | int >= 24)
    fail_msg: >-
      The BlitzeCDN control plane supports Debian 13+ and Ubuntu 24.04+, because
      it needs Python 3.12 or newer. BlitzeCDN edges separately require Ubuntu
      26.04 LTS.

- name: Install control-plane packages
  ansible.builtin.apt:
    name: "{{ blitzecdn_controlplane_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: blitzecdn_controlplane_apt
  until: blitzecdn_controlplane_apt is success
  retries: 3
  delay: 5

- name: Enable the SSH daemon
  ansible.builtin.systemd_service:
    name: ssh
    enabled: true
    state: started

# --- deployment access and filesystem ownership -----------------------------

- name: Create the deployment account
  ansible.builtin.user:
    name: "{{ blitzecdn_controlplane_deploy_user }}"
    shell: /bin/bash
    create_home: true

- name: Permit deployment account provisioning
  ansible.builtin.copy:
    content: |
      {{ blitzecdn_controlplane_deploy_user }} ALL=(root) NOPASSWD: ALL
    dest: "{{ blitzecdn_controlplane_sudoers_file }}"
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s

# --- loopback trust between the container and deployment account -------------
#
# A standalone host is its own edge, so the control plane reaches it the same
# way it reaches any other: over SSH, key-only, as the deployment account. That
# keeps one code path for one edge and for fifty.

- name: Create the state directory
  ansible.builtin.file:
    path: "{{ blitzecdn_controlplane_state_dir }}"
    state: directory
    # Debian's existing nobody:nogroup image account is 65534:65534. Numeric
    # ownership does not require a corresponding BlitzeCDN account on the host.
    owner: "65534"
    group: "65534"
    mode: "0700"

- name: Create the container SSH directory
  ansible.builtin.file:
    path: "{{ blitzecdn_controlplane_state_dir }}/.ssh"
    state: directory
    owner: "65534"
    group: "65534"
    mode: "0700"

# 0700, because an archive in here holds every TLS private key, the API
# credentials, and the whole audit trail. File modes alone would still let any
# account list what this controller holds and when it was last backed up.
- name: Create the backup directory
  ansible.builtin.file:
    path: "{{ blitzecdn_controlplane_backup_dir }}"
    state: directory
    owner: "65534"
    group: "65534"
    mode: "0700"

- name: Create the controller key pair
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -q
      - -t
      - ed25519
      - -N
      - ""
      - -C
      - blitzecdn-local-controller
      - -f
      - "{{ blitzecdn_controlplane_state_dir }}/id_ed25519"
    creates: "{{ blitzecdn_controlplane_state_dir }}/id_ed25519"

- name: Set controller key ownership for the container identity
  ansible.builtin.file:
    path: "{{ blitzecdn_controlplane_state_dir }}/{{ item.path }}"
    owner: "65534"
    group: "65534"
    mode: "{{ item.mode }}"
  loop:
    - {path: id_ed25519, mode: "0600"}
    - {path: id_ed25519.pub, mode: "0644"}

- name: Read the controller public key
  ansible.builtin.slurp:
    src: "{{ blitzecdn_controlplane_state_dir }}/id_ed25519.pub"
  register: blitzecdn_controlplane_public_key

- name: Authorize the controller key for the deployment account
  ansible.posix.authorized_key:
    user: "{{ blitzecdn_controlplane_deploy_user }}"
    key: "{{ blitzecdn_controlplane_public_key.content | b64decode | trim }}"
    state: present

# Recorded rather than trusted on first use: the controller runs SSH with
# StrictHostKeyChecking, so the loopback keys have to be known before the first
# deployment or it fails instead of prompting.
# Deliberately not `ssh-keyscan -H`: hashing salts each run, so the file would
# differ every time and every converge would report a change it did not make.
# Hashing protects the list of hosts an account connects to, and this list is
# localhost and 127.0.0.1.
- name: Scan the loopback host keys
  ansible.builtin.command:
    argv: [ssh-keyscan, localhost, 127.0.0.1]
  register: blitzecdn_controlplane_host_keys
  changed_when: false

- name: Record the loopback host keys
  ansible.builtin.copy:
    # Sorted because ssh-keyscan does not promise an order, and an unsorted
    # write would report a change on every run.
    content: "{{ blitzecdn_controlplane_host_keys.stdout_lines | sort | join('\n') }}\n"
    dest: "{{ blitzecdn_controlplane_state_dir }}/.ssh/known_hosts"
    owner: "65534"
    group: "65534"
    mode: "0600"

- name: Configure the controller's SSH client
  ansible.builtin.template:
    src: ssh_config.j2
    dest: "{{ blitzecdn_controlplane_state_dir }}/.ssh/config"
    owner: "65534"
    group: "65534"
    mode: "0600"

# --- the CLI wrapper and the service environment -----------------------------

- name: Install the blitzecdn command
  ansible.builtin.template:
    src: blitzecdn-cli.j2
    dest: "{{ blitzecdn_controlplane_cli_wrapper }}"
    owner: root
    group: root
    mode: "0755"

# Copied from the image this play runs in, so the host always holds the
# installer of the release it runs: an update replaces it with the target's.
- name: Install the blitzecdn-install command
  ansible.builtin.copy:
    src: "{{ blitzecdn_controlplane_install_dir }}/install.sh"
    dest: "{{ blitzecdn_controlplane_installer }}"
    owner: root
    group: root
    mode: "0755"

- name: Create the configuration directory
  ansible.builtin.file:
    path: "{{ blitzecdn_controlplane_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Inspect the environment file
  ansible.builtin.stat:
    path: "{{ blitzecdn_controlplane_config_dir }}/blitzecdn.env"
  register: blitzecdn_controlplane_environment

- name: Inspect the service configuration
  ansible.builtin.stat:
    path: "{{ blitzecdn_controlplane_config_dir }}/blitzecdn.toml"
  register: blitzecdn_controlplane_configuration

- name: Read the existing service configuration
  ansible.builtin.slurp:
    path: "{{ blitzecdn_controlplane_config_dir }}/blitzecdn.toml"
  register: blitzecdn_controlplane_existing_configuration
  when: blitzecdn_controlplane_configuration.stat.exists

- name: Resolve the ACME address without losing an existing installation value
  ansible.builtin.set_fact:
    blitzecdn_controlplane_effective_acme_email: >-
      {{
        blitzecdn_controlplane_acme_email
        if blitzecdn_controlplane_acme_email | length > 0
        else (
          blitzecdn_controlplane_existing_configuration.content
          | default('')
          | b64decode
          | regex_findall('(?m)^acme_default_email\\s*=\\s*"([^"]*)"')
          | first
          | default('', true)
        )
      }}
  no_log: true

- name: Require an ACME address for a first installation
  ansible.builtin.assert:
    that:
      - blitzecdn_controlplane_effective_acme_email | length > 0
    fail_msg: >-
      No environment file exists yet and no ACME account address was given.
      Run the installer with --email ADDRESS.
  when: not blitzecdn_controlplane_environment.stat.exists

- name: Write the non-secret service configuration
  ansible.builtin.template:
    src: blitzecdn.toml.j2
    dest: "{{ blitzecdn_controlplane_config_dir }}/blitzecdn.toml"
    owner: root
    group: root
    mode: "0644"

- name: Generate the API credential for a first installation
  ansible.builtin.set_fact:
    blitzecdn_controlplane_api_key: >-
      {{ lookup('ansible.builtin.password', '/dev/null', chars=['hexdigits'], length=64) | lower }}
  when: not blitzecdn_controlplane_environment.stat.exists
  no_log: true

# Never rewritten: re-running the installer must not rotate the API credential
# an operator is already using. The `when` is what enforces that, not `force`
# alone — a template task still renders its source to decide whether the file
# would change, and the credential only exists as a fact on a first run.
- name: Write the service environment
  ansible.builtin.template:
    src: blitzecdn.env.j2
    dest: "{{ blitzecdn_controlplane_config_dir }}/blitzecdn.env"
    force: false
    owner: root
    group: root
    mode: "0600"
  when: not blitzecdn_controlplane_environment.stat.exists
  no_log: true

- name: Enforce the environment file ownership
  ansible.builtin.file:
    path: "{{ blitzecdn_controlplane_config_dir }}/blitzecdn.env"
    owner: root
    group: root
    mode: "0600"

# The template above writes this line only on a first installation, and the file
# is never rewritten after that. Without this task `--allowed-ips` would work
# once and then silently do nothing on every later run — the worst shape for a
# flag about who may reach the API. Supplying it is the operator naming the list
# on the command line; omitting it leaves whatever the file says, hand edits
# included. The regexp cannot match the commented example the template ships:
# the name has to start the line, which is the rule the firewall composition
# below reads by as well.
- name: Set the API access list this run was given
  ansible.builtin.lineinfile:
    path: "{{ blitzecdn_controlplane_config_dir }}/blitzecdn.env"
    regexp: '^[ \t]*BLITZE_ALLOWED_IPS[ \t]*='
    line: "BLITZE_ALLOWED_IPS={{ blitzecdn_controlplane_allowed_ips }}"
    owner: root
    group: root
    mode: "0600"
  when: blitzecdn_controlplane_allowed_ips | length > 0

# --- Compose runtime ---------------------------------------------------------

# Parse once in the image, using the same literal environment format as backups.
# Compose reads this generated file raw; dollars and quotes are credentials,
# never interpolation syntax. The original operator file remains authoritative.
- name: Prepare the literal Compose environment
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - none
      - --user
      - "0:0"
      - --security-opt
      - no-new-privileges:true
      - --volume
      - "{{ blitzecdn_controlplane_config_dir }}:{{ blitzecdn_controlplane_config_dir }}"
      - --entrypoint
      - python
      - "{{ blitzecdn_controlplane_image }}"
      - -m
      - blitzecdn.host.compose_files
      - --config-dir
      - "{{ blitzecdn_controlplane_config_dir }}"
      - environment
  register: blitzecdn_controlplane_compose_environment
  changed_when: "'Updated' in blitzecdn_controlplane_compose_environment.stdout"
  no_log: true

- name: Render the control-plane Compose project
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ blitzecdn_controlplane_compose_file }}"
    owner: root
    group: root
    mode: "0600"
    validate: docker compose --file %s config --quiet

# Never pulled or built here: install.sh obtained the image before this play,
# which runs inside it. Asserted rather than assumed, so a role run with some
# other reference fails before a service is stopped, not at `up`.
- name: Require the control-plane runtime image
  ansible.builtin.command:
    argv:
      - docker
      - image
      - inspect
      - --format
      - "{{ '{{' }}.Id{{ '}}' }}"
      - "{{ blitzecdn_controlplane_image }}"
  changed_when: false

# Prove the exact identity and mounts used by API/worker/CLI can use the
# controller key. No host service account participates in this trust chain.
- name: Verify the container can reach this host as the deployment account
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --file
      - "{{ blitzecdn_controlplane_compose_file }}"
      - run
      - --rm
      - --no-deps
      - --entrypoint
      - ssh
      - blitzecdn-cli
      - -F
      - /opt/blitzecdn/.state/.ssh/config
      - -o
      - BatchMode=yes
      - "{{ blitzecdn_controlplane_deploy_user }}@localhost"
      - sudo
      - -n
      - "true"
  changed_when: false

# The one place the services are stopped, for a first install, an update, an
# upgrade, or a repair run of this role alike: after the image is in place, so
# downtime is only the migration and the restart. install.sh takes its backup
# before calling this play.
- name: Stop application services before schema migration
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --file
      - "{{ blitzecdn_controlplane_compose_file }}"
      - stop
      - blitzecdn-api
      - blitzecdn-worker
  changed_when: true

# The API and worker both open the repository during startup. Migrating before
# Compose starts them gives both processes an already validated schema.
- name: Initialize the application schema before starting services
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --file
      - "{{ blitzecdn_controlplane_compose_file }}"
      - run
      - --rm
      - --no-deps
      - blitzecdn-cli
      - migrate
  changed_when: false

- name: Recreate and start the control-plane services
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - --file
      - "{{ blitzecdn_controlplane_compose_file }}"
      - up
      - --detach
      - --remove-orphans
      - --force-recreate
  changed_when: true

- name: Wait for the API and worker containers to become healthy
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - --format
      - "{{ '{{' }}.State.Health.Status{{ '}}' }}"
      - "{{ item }}"
  loop: [blitzecdn-api, blitzecdn-worker]
  register: blitzecdn_controlplane_health
  changed_when: false
  retries: 24
  delay: 5
  until: blitzecdn_controlplane_health.stdout == 'healthy'

# --- scheduled backups -------------------------------------------------------

# A host timer, not a worker job: the archive has to carry the environment
# file, which is root-only on the host and which the CLI wrapper alone stages
# into the backup container. After the services are healthy, because the first
# run may fire as soon as the timer starts if a scheduled time was missed.
- name: Install the scheduled backup units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ blitzecdn_controlplane_systemd_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [blitzecdn-backup.service, blitzecdn-backup.timer]
  register: blitzecdn_controlplane_backup_units

- name: Schedule the backup timer
  ansible.builtin.systemd_service:
    name: blitzecdn-backup.timer
    daemon_reload: "{{ blitzecdn_controlplane_backup_units is changed }}"
    enabled: "{{ blitzecdn_controlplane_backup_schedule | length > 0 }}"
    state: >-
      {{
        ('restarted' if blitzecdn_controlplane_backup_units is changed else 'started')
        if blitzecdn_controlplane_backup_schedule | length > 0
        else 'stopped'
      }}

# Strictly after the API is healthy. A rule installed before the listener
# exists is an open port nothing serves, and this play is `any_errors_fatal`,
# so a run that never got the container up ends without having widened
# anything.
- name: Read the environment the API was started with
  ansible.builtin.slurp:
    path: "{{ blitzecdn_controlplane_config_dir }}/compose.env"
  register: blitzecdn_controlplane_environment_content
  no_log: true

# Read the generated environment, so duplicate assignments and shell quotes
# have already been resolved by the same parser that supplied the API.
- name: Compose the API rules this role manages
  ansible.builtin.set_fact:
    blitzecdn_controlplane_desired_rules: >-
      {{
        (
          [''] + (
            blitzecdn_controlplane_environment_content.content
            | b64decode
            | regex_findall('(?m)^[ \t]*BLITZE_ALLOWED_IPS[ \t]*=[ \t]*(.*)$')
          )
        )
        | last
        | regex_replace('^["\x27](.*)["\x27]$', '\1')
        | split(',')
        | map('trim')
        | select
        | map('regex_replace', '^(.+)$',
              'tcp|' ~ (blitzecdn_controlplane_api_port | string) ~ '|\1')
        | list
      }}

# ufw is neither installed nor enabled here, and the default policy is left
# alone. A controller-only host may be firewalled by something else entirely,
# and switching an unprepared host to deny-by-default from a play it did not
# ask for would cut off the SSH session running it. Where ufw is not the
# authority this role manages no rule and says so; the README's manual
# commands remain the answer for any other firewall.
- name: Inspect the host firewall
  ansible.builtin.command: ufw status
  register: blitzecdn_controlplane_ufw
  changed_when: false
  failed_when: false

- name: Decide whether ufw is the authority on this host
  ansible.builtin.set_fact:
    blitzecdn_controlplane_ufw_active: >-
      {{
        blitzecdn_controlplane_ufw.rc == 0
        and 'Status: active' in blitzecdn_controlplane_ufw.stdout
      }}

- name: Report a firewall this role cannot converge
  ansible.builtin.debug:
    msg: >-
      ufw is not active on this host, so the API rules for
      {{ blitzecdn_controlplane_desired_rules | length }} allowed source(s)
      were not applied. Admit port {{ blitzecdn_controlplane_api_port }} from
      those addresses in whichever firewall is authoritative here.
  when:
    - not blitzecdn_controlplane_ufw_active | bool
    - blitzecdn_controlplane_desired_rules | length > 0

- name: Converge the API firewall rules
  when: blitzecdn_controlplane_ufw_active | bool
  block:
    - name: Inspect the managed API rule registry
      ansible.builtin.stat:
        path: "{{ blitzecdn_controlplane_firewall_registry_file }}"
      register: blitzecdn_controlplane_registry

    - name: Read the managed API rule registry
      ansible.builtin.slurp:
        path: "{{ blitzecdn_controlplane_firewall_registry_file }}"
      register: blitzecdn_controlplane_registry_content
      when: blitzecdn_controlplane_registry.stat.exists

    # Only well-formed lines select a rule for deletion. The registry is ours,
    # but it is a plain file on a host an operator can edit, and a malformed
    # line would otherwise be handed to ufw as a rule specification.
    - name: Calculate API rules this role no longer manages
      ansible.builtin.set_fact:
        blitzecdn_controlplane_stale_rules: >-
          {{
            (blitzecdn_controlplane_registry_content.content | default('') | b64decode).splitlines()
            | select('match', '^tcp\|[0-9]{1,5}\|[^|]+$')
            | difference(blitzecdn_controlplane_desired_rules)
            | list
          }}

    - name: Allow the API from its allowed sources
      community.general.ufw:
        rule: allow
        direction: in
        proto: tcp
        port: "{{ blitzecdn_controlplane_api_port }}"
        src: "{{ item.split('|')[2] }}"
        comment: BlitzeCDN control-plane API
      loop: "{{ blitzecdn_controlplane_desired_rules }}"

    # After the additions, for the same reason the edge role withdraws last: on
    # a run that swaps one office range for another, withdrawing first would
    # open a window in which the replacement had not landed yet.
    - name: Withdraw API rules this role no longer manages
      community.general.ufw:
        rule: allow
        direction: in
        delete: true
        proto: tcp
        port: "{{ item.split('|')[1] }}"
        src: "{{ item.split('|')[2] }}"
      loop: "{{ blitzecdn_controlplane_stale_rules }}"

    # Written last and only once the rules above have all applied, so a run
    # that failed midway leaves the previous registry in place rather than
    # claiming rules the host never had.
    - name: Record the managed API rule set
      ansible.builtin.copy:
        content: "{{ blitzecdn_controlplane_desired_rules | sort | join('\n') }}\n"
        dest: "{{ blitzecdn_controlplane_firewall_registry_file }}"
        owner: root
        group: root
        mode: "0644"
