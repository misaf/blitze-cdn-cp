---
argument_specs:
  main:
    short_description: Converge this host as a BlitzeCDN control plane.
    description:
      - >-
        Owns every piece of Linux state a standalone installation needs. The
        deployment account, explicit container-state ownership, the sudo rule,
        loopback SSH trust, CLI wrapper, configuration, and Docker Compose
        project.
      - >-
        Runs from the standalone installer, inside the control-plane image,
        against the host through the community.docker.nsenter connection.
    options:
      blitzecdn_controlplane_install_dir: {type: path, required: true}
      blitzecdn_controlplane_config_dir: {type: path, required: true}
      blitzecdn_controlplane_state_dir: {type: path, required: true}
      blitzecdn_controlplane_backup_dir: {type: path, required: true}
      blitzecdn_controlplane_backup_schedule:
        type: str
        required: true
        description: >-
          When the host timer takes a full backup and then prunes the backup
          directory, as a systemd OnCalendar expression. Empty disables it.
      blitzecdn_controlplane_backup_retain_count:
        type: int
        required: true
        description: >-
          Newest archives kept in the backup directory after each scheduled
          backup. 0 keeps every archive.
      blitzecdn_controlplane_systemd_dir: {type: path, required: true}
      blitzecdn_controlplane_deploy_user: {type: str, required: true}
      blitzecdn_controlplane_cli_wrapper: {type: path, required: true}
      blitzecdn_controlplane_sudoers_file: {type: path, required: true}
      blitzecdn_controlplane_compose_file: {type: path, required: true}
      blitzecdn_controlplane_compose_project: {type: str, required: true}
      blitzecdn_controlplane_image:
        type: str
        required: true
        description: >-
          The control-plane image the services and the CLI wrapper run. Must
          already be present in the local engine: install.sh pulls or builds
          it before this play, which itself runs inside that image.
      blitzecdn_controlplane_runtime_dir: {type: path, required: true}
      blitzecdn_controlplane_packages: {type: list, elements: str, required: true}
      blitzecdn_controlplane_acme_email:
        type: str
        required: false
        default: ""
        description:
          - >-
            Required when no environment file exists yet, because the ACME
            account address cannot be invented. On a host that already has one
            the address is left alone unless a value is supplied here, in which
            case the account is repointed.
      blitzecdn_controlplane_certificate_reconcile_seconds: {type: int, required: true}
      blitzecdn_controlplane_ssl_automatic_scan_seconds: {type: int, required: true}
      blitzecdn_controlplane_certificate_renewal_seconds: {type: int, required: true}
      blitzecdn_controlplane_drift_check_seconds: {type: int, required: true}
      blitzecdn_controlplane_allowed_ips:
        type: str
        required: false
        default: ""
        description: >-
          Comma-separated client IPv4 addresses and CIDRs allowed to reach the
          API, as install.sh --allowed-ips supplied them. Seeds BLITZE_ALLOWED_IPS
          on a first installation and repoints it on a later run, so the flag
          never quietly does nothing; empty leaves the line alone, because the
          environment file is the operator's to edit.
      blitzecdn_controlplane_api_port:
        type: int
        required: true
        description: >-
          The port the installed API listens on and the one this role admits
          through ufw. Held equal to blitzecdn.entrypoints.api.__main__.API_PORT by a
          contract test, so a rule on a dead port and a listener behind a
          closed one are both impossible rather than merely unlikely.
      blitzecdn_controlplane_firewall_registry_file:
        type: path
        required: true
        description: >-
          Where the role records the API rules it manages, so a later run can
          tell a rule it installed from one an operator added by hand and
          withdraw only its own. Removing an address from BLITZE_ALLOWED_IPS
          revokes its rule instead of leaving the host still admitting it.
