---
argument_specs:
  main:
    short_description: Stage and atomically activate a versioned edge configuration
    options:
      blitzecdn_release_digest:
        type: str
        required: true
        description: Full immutable release identity supplied by the control plane.
      blitzecdn_config_release_bundle:
        type: path
        description: >-
          Controller-local path of the configuration bundle the control plane
          rendered for this release. Required to stage a candidate.
      blitzecdn_config_release_root:
        type: path
        default: /etc/blitzecdn/releases
        description: Stable parent mounted read-only into the edge runtime.
      blitzecdn_config_release_helper:
        type: path
        default: /etc/blitzecdn/configuration-release.py
        description: Location of the edge-local durable activation helper.
      blitzecdn_config_release_keep_older:
        type: int
        default: 2
        description: >-
          Number of additional completed releases to retain beyond the active
          release and its predecessor. Must be nonnegative; zero keeps only
          those releases and any trees required by unfinished transactions.
