# Build-time capability probe for the BlitzeCDN edge image. Not shipped as
# runtime configuration: `nginx -t -c` this file during the build, so an image
# whose dynamic modules do not match the binary is never published.
#
# It names no module, and it cannot: which modules this image carries is an
# input to the build, emitted by `blitzecdn edge image spec` from the
# capabilities that declare them. So the two files it includes are generated —
# the same `load_module` list the image runs with, and one directive per module
# from the same declarations — and this file is only their frame.
include /etc/nginx/modules.conf;
pid /tmp/blitzecdn-module-probe.pid;
events {}
http {
    # One directive from each module. A module that loads but registers nothing
    # is indistinguishable from a working one until an edge configuration uses
    # it, which is far too late. Empty for an image built with no modules, and
    # for a module whose every directive needs a file the image must not carry.
    include /usr/share/blitzecdn/module-probe-directives.conf;
    server {
        listen 127.0.0.1:65535;
        location / {
            return 204;
        }
    }
}
