---
name: CI

"on":
  pull_request:
  push:
    branches: [master, 1.x]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      # The edge roles come from the blitzecdn.edge collection pinned in
      # ansible/requirements.yml. tests/test_contract.py reads the installed
      # collection, so this step decides which edge version we test against.
      - name: Install project and the pinned edge collection
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          ansible-galaxy collection install -r ansible/requirements.yml \
            -p .state/collections
      - name: Python format and lint
        run: |
          ruff format --check src tests
          ruff check src tests
      - name: Strict type checking
        run: mypy src
      - name: Tests and coverage
        run: pytest --cov-report=xml
      - name: Fail if the contract tests silently skipped
        run: |
          test -d .state/collections/ansible_collections/blitzecdn/edge \
            || { echo "edge collection missing; contract tests skipped"; exit 1; }
      - name: YAML and Ansible lint
        env:
          ANSIBLE_CONFIG: ansible/ansible.cfg
          ANSIBLE_LOCAL_TEMP: .state/ansible-local
        run: |
          yamllint .
          ansible-playbook \
            -i ansible/inventory/hosts.example.yml \
            ansible/playbooks/edge.yml \
            --syntax-check \
            --extra-vars @tests/fixtures/desired-state.yml
          ansible-playbook \
            -i ansible/inventory/hosts.example.yml \
            ansible/playbooks/acme-challenge.yml \
            --syntax-check
          ansible-lint ansible/playbooks/edge.yml ansible/playbooks/acme-challenge.yml
      - name: Security checks
        run: |
          bandit -c pyproject.toml -r src
          pip-audit
      - name: Build package
        run: python -m build
