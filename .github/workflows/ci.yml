---
name: CI

"on":
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install project and collections
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          ansible-galaxy collection install -r ansible/requirements.yml
      - name: Python format and lint
        run: |
          ruff format --check src tests
          ruff check src tests
      - name: Strict type checking
        run: mypy src
      - name: Tests and coverage
        run: pytest --cov-report=xml
      - name: YAML and Ansible lint
        env:
          ANSIBLE_CONFIG: ansible/ansible.cfg
          ANSIBLE_LOCAL_TEMP: .state/ansible-local
        run: |
          yamllint .
          ansible-playbook \
            -i ansible/inventory/hosts.example.yml \
            ansible/playbooks/edge.yml \
            --syntax-check \
            --extra-vars @tests/fixtures/desired-state.yml
          ansible-lint ansible/playbooks/edge.yml
      - name: Security checks
        run: |
          bandit -c pyproject.toml -r src
          pip-audit
      - name: Build package
        run: python -m build
