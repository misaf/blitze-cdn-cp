---
name: CI

"on":
  pull_request:
  push:
    branches: [master, 1.x, 2.x, 3.x]
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"
          enable-cache: true
      # The Python uv builds the environment around. Pinned here rather than
      # left to uv so CI and a server install agree on the interpreter.
      - name: Install Python
        run: uv python install 3.14
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import tomllib

          tag = os.environ["GITHUB_REF_NAME"]
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          version = project["project"]["version"]
          if tag != f"v{version}":
              raise SystemExit(f"release tag {tag!r} must equal v{version}")
          PY
      # Every gate below is a justfile recipe, and `just check` runs all of
      # them in this order. Nothing here duplicates a command: a gate added to
      # the justfile is a gate this workflow picks up without a second edit,
      # and a contributor running `just check` locally runs this pipeline.
      #
      # Every BlitzeCDN role lives in ansible/roles/ and is checked out with
      # this repository, so only third-party dependencies are installed here.
      - name: Install project and collection dependencies
        run: just install
      - name: Lockfile is current
        run: just lock-check
      - name: Python format and lint
        run: just lint
      - name: Strict type checking
        run: just types
      # install.sh provisions deployment access, writes sudoers, and stops services as
      # root. Nothing else in this workflow reads it.
      - name: Shell lint
        run: just shell-lint
      - name: Tests and coverage
        run: just test --cov-report=xml
      # The other half of the packaging boundary, and not something the run
      # above can prove: it has every optional distribution installed, so a
      # core test that imported one would pass there. This syncs them away,
      # runs the control plane's own suite, and syncs them back.
      - name: The control plane with no optional package installed
        run: just test-core-only
      # The report was produced and then thrown away with the runner. Kept as
      # an artifact so a coverage question about a specific run can be answered
      # after the fact rather than by re-running the suite locally and hoping
      # it matches.
      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-${{ github.run_id }}
          path: coverage.xml
          retention-days: 14
          if-no-files-found: error
      - name: YAML and Ansible lint
        run: just ansible-check
      - name: Security checks
        run: just audit
      - name: Build package
        run: just build

  # The quality job exercises the newest supported interpreter. These smaller
  # jobs make the rest of the declared Python range executable without
  # repeating format, lint, audit, and build work for every version.
  python-compatibility:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"
          enable-cache: true
      - name: Install Python
        run: uv python install ${{ matrix.python-version }}
      # `--all-packages` is the workspace form: a plain sync installs the
      # control plane alone and leaves every optional distribution's tests
      # unable to import.
      - name: Install the workspace
        run: uv sync --frozen --all-packages --python ${{ matrix.python-version }}
      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest --no-cov

  # The published reference is hand-written MDX in another repository, so
  # nothing in the job above can notice that a route, command, setting, or
  # model changed here and left the documentation describing the old one. This
  # job is that noticing, and it belongs on this side: drift starts with a
  # change to the control plane, and this is where the author can still fix it
  # in the same pull request.
  #
  # It only reads the docs repository. A documentation-only change is checked
  # by that repository's own pipeline, which runs the same script the other way
  # around.
  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned to the release branch for the same reason the docs repository
      # pins this one: the published pages describe the released control plane.
      - name: Check out the documentation site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: misaf/blitze-cdn-web
          ref: 1.x
          path: docs-site
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.3"
          enable-cache: true
      - name: Install Python
        run: uv python install 3.14
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      # The check imports `blitzecdn` and reads the live OpenAPI document, so
      # the optional distributions have to be installed: their routes and
      # models are part of the surface the reference describes. The collections
      # `just install` also fetches are not involved, so this stays narrower
      # than that.
      - name: Install the workspace
        run: uv sync --frozen --all-packages
      - name: Check the reference against this control plane
        run: just docs-check docs-site

  # The only job that runs `install.sh standalone` against a real init on a real
  # distribution. Everything in the job above asserts on the scripts' shape or
  # runs them with the privileged commands stubbed, and neither can catch a
  # platform that cannot host the control plane at all.
  #
  # A standalone host is also an edge, so it uses the release's one supported
  # fresh-edge platform rather than the control-plane-only compatibility range.
  install:
    name: Install on ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu:26.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install, re-install, and uninstall
        run: bash tests/container-install.sh ${{ matrix.image }}

  http3-integration:
    name: Ubuntu 26.04 HTTP/3 edge
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Provision and test HTTP/1.1, HTTP/2, HTTP/3, GeoIP2, and Brotli
        run: bash tests/http3-edge-integration.sh
