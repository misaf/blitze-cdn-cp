---
name: CI

"on":
  pull_request:
  push:
    branches: [master, 1.x]
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          tag = os.environ["GITHUB_REF_NAME"]
          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          version = project["project"]["version"]
          if tag != f"v{version}":
              raise SystemExit(f"release tag {tag!r} must equal v{version}")
          PY
      # The edge roles come from the blitzecdn.edge collection pinned in
      # ansible/requirements.yml. tests/test_contract.py reads the installed
      # collection, so this step decides which edge version we test against.
      - name: Install project and the pinned edge collection
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          ansible-galaxy collection install -r ansible/requirements.yml \
            -p .state/collections
          # Exercise the existing-installation path too. Git refs have a v
          # prefix but collection manifests do not; ansible-core 2.21 cannot
          # compare those representations unless reinstall is forced.
          ansible-galaxy collection install -r ansible/requirements.yml \
            -p .state/collections --force
      - name: Python format and lint
        run: |
          ruff format --check src tests
          ruff check src tests
      - name: Strict type checking
        run: mypy src
      # install.sh provisions users, writes sudoers, and stops services as
      # root. Nothing else in this workflow reads it.
      - name: Shell lint
        run: shellcheck install.sh
      - name: Tests and coverage
        run: pytest --cov-report=xml
      - name: Fail if the contract tests silently skipped
        run: |
          test -d .state/collections/ansible_collections/blitzecdn/edge \
            || { echo "edge collection missing; tests skipped"; exit 1; }
      - name: YAML and Ansible lint
        env:
          ANSIBLE_CONFIG: ansible/ansible.cfg
          ANSIBLE_LOCAL_TEMP: .state/ansible-local
        run: |
          yamllint .
          ansible-playbook \
            -i ansible/inventory/hosts.example.yml \
            ansible/playbooks/edge.yml \
            --syntax-check \
            --extra-vars @tests/fixtures/desired-state.yml
          ansible-playbook \
            -i ansible/inventory/hosts.example.yml \
            ansible/playbooks/acme-challenge.yml \
            --syntax-check
          ansible-lint \
            ansible/playbooks/edge.yml \
            ansible/playbooks/acme-challenge.yml
      - name: Security checks
        run: |
          bandit -c pyproject.toml -r src
          pip-audit
      - name: Build package
        run: python -m build
