---
# Build and publish the BlitzeCDN edge runtime image.
#
# Separate from CI because it produces an artefact rather than a verdict, and
# because the fleet consumes it by digest: a build that ran is not a build any
# edge is using until somebody sets blitzecdn_edge_image_tag in the control
# plane and deploys. That separation is deliberate — a merge to 2.x must not be
# able to upgrade Nginx on a production fleet.
#
# On a pull request the image is built and probed but never pushed, so the
# ABI invariant is checked on every change to docker/edge/ without publishing
# anything.
name: Edge image

"on":
  pull_request:
    paths:
      - docker/edge/**
      - .github/workflows/edge-image.yml
  push:
    branches: [2.x]
    paths:
      - docker/edge/**
      - .github/workflows/edge-image.yml
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # Only what pushing to GitHub's own registry needs.
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      # A pull request builds and probes without credentials; nothing is pushed.
      - name: Sign in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Name the image
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/blitzecdn-edge
          # No `latest`, ever. An edge pinned to a floating tag makes "which
          # build is this fleet running" unanswerable and rollback a guess.
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long,prefix=
      - name: Build and publish the edge runtime
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docker/edge
          # amd64 and arm64, because an edge fleet is rarely one architecture
          # and the Ubuntu package set is published for both.
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BLITZECDN_EDGE_VERSION=${{ github.ref_name }}
            BLITZECDN_EDGE_REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
      # The digest is what production is pinned to, so it belongs in the run's
      # own output rather than only in the registry: setting
      # blitzecdn_edge_image_digest is a copy-paste from here.
      - name: Report the published digest
        if: github.event_name != 'pull_request'
        run: |
          {
            echo '## Edge runtime image'
            echo
            echo '```'
            echo "digest: ${{ steps.build.outputs.digest }}"
            echo '```'
            echo
            echo 'Roll it out with:'
            echo
            echo '```'
            echo "blitzecdn config set blitzecdn_edge_image_digest ${{ steps.build.outputs.digest }}"
            echo 'blitzecdn deploy --limit edge-01'
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
