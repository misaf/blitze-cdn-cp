---
version: 2
# Every entry names master: GitHub's default branch is a release line (6.x),
# and Dependabot otherwise opens its pull requests against the default branch.
updates:
  - package-ecosystem: uv
    directory: /
    target-branch: master
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: UTC
    groups:
      python-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    target-branch: master
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: UTC
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  # The base images of the two images this repository publishes. Each Dockerfile
  # pins its base by digest, so a rebuilt upstream image changes nothing here
  # until this entry proposes the new digest; tests/platform/test_base_images.py
  # holds both halves — the pin and this entry — for every shipped Dockerfile.
  - package-ecosystem: docker
    directories:
      - /src/blitzecdn/assets/docker/control-plane
      - /src/blitzecdn/assets/docker/edge
    target-branch: master
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: UTC
    groups:
      docker-base-images:
        patterns:
          - "*"
    open-pull-requests-limit: 5
